          newLeftPx = Math.max(leftLimitPx, Math.min(newLeftPx, fixedRightPx - 20));
          newWidthPx = fixedRightPx - newLeftPx;
        }

        finalHeight = newHeight;
        finalWidthPx = newWidthPx;
        card.style.top = newTop + 'px';
        card.style.height = newHeight + 'px';
        card.style.left = newLeftPx + 'px';
        card.style.width = newWidthPx + 'px';

        // 即時預覽：用跟放開時完全相同的 5 分鐘吸附規則換算目前的時間，
        // 直接寫回卡片上的時間文字，這樣使用者放手時看到的數字
        // 就是最終會套用的結果，不會有落差。
        const startMinAbs = Math.round(newTop/hourPx*60);
        const previewDurationMin = Math.max(5, Math.round(newHeight/hourPx*60/5)*5);
        const previewEndMin = startMinAbs + previewDurationMin;
        updateCardTimeDisplay(card, meta, minutesToTime(startMinAbs)+' - '+minutesToTime(previewEndMin));
      };

      const onUp = function(e2){
        clearTimeout(longPressTimer);
        handle.classList.remove('touched');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);

        if(resizing){
          card.classList.remove('resizing');
          handle.classList.remove('active');

          // 時長 → 吸附到 5 分鐘；固定的那一端（上緣或下緣）直接沿用原本的時間，
          // 不用重新從像素換算，避免抖動誤差。
          let durationMin = Math.round(finalHeight/hourPx*60/5)*5;
          durationMin = Math.max(5, durationMin);
          let newStart, newEnd;
          if(vertDir === 'bottom'){
            const startMinAbs = Math.round(origTop/hourPx*60);
            newStart = minutesToTime(startMinAbs);
            newEnd = minutesToTime(startMinAbs + durationMin);
          } else {
            newEnd = inst.end;
            newStart = minutesToTime(Math.max(0, timeToMinutes(inst.end) - durationMin));
          }

          // 寬度 → 換算成實際涵蓋幾欄；固定的那一端（左欄或右欄）沿用原本的邊界。
          const evRect = eventsLayer.getBoundingClientRect();
          const n = Math.max(1, columns.length);
          const colWidthPx = evRect.width / n;
          const spanCols = Math.max(1, Math.round(finalWidthPx / colWidthPx));
          let pendingRunMin, pendingRunMax;
          if(horizDir === 'right'){
            pendingRunMin = runMin;
            pendingRunMax = Math.min(n-1, runMin + spanCols - 1);
          } else {
            pendingRunMax = runMax;
            pendingRunMin = Math.max(0, runMax - spanCols + 1);
          }

          // 把這個分段原本涵蓋的欄位，換成拖曳後的新範圍
          const origIds = columns.slice(runMin, runMax+1).map(c=>c.id);
          const newIds = columns.slice(pendingRunMin, pendingRunMax+1).map(c=>c.id);
          const pset = new Set(inst.participants||[]);
          origIds.forEach(id => { if(newIds.indexOf(id)===-1) pset.delete(id); });
          newIds.forEach(id => pset.add(id));

          applyQuickPlacement(inst.masterId, inst.instanceDate, inst.instanceDate, newStart, newEnd, Array.from(pset));
          renderEvents();
        }
      };

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  }

  /* ---------------- 長按空白時段 → 拖曳選取範圍(可跨欄) → 放開建立新行程 ----------------
     單純點一下不會建立行程；需長按 400ms 進入選取模式（會有震動回饋與
     選取框），接著拖曳決定時段範圍（上下）與參與欄位範圍（左右），
     放開手指才真正建立新行程並跳轉到編輯頁。長按尚未觸發前若上下移動
     超過 8px，視為頁面捲動，直接取消，不建立任何東西。 */
  const timelineScroll = document.getElementById('timelineScroll');
  let selectionBox = null;

  /* ---------------- 手動接手捲動時的慣性動畫 ----------------
     卡片跟空白格區域都是 touch-action:none，瀏覽器不會再自動處理捲動，
     所以判定成「其實是想捲動」的時候，是用 JS 手動即時推動 scrollTop
     （見下面兩組手勢處理的 cancelledByScroll / gestureMode==='scroll'
     分支）。手動推動本身沒有慣性，手指一放開就會硬停。這裡額外做一個
     簡單的慣性模擬：放開的當下用最後量到的速度繼續往同方向捲一小段，
     並隨時間用摩擦力係數逐漸變慢，直到接近 0 或碰到頂/底邊界為止，
     感覺就會跟原生捲動一樣有「放手後還會滑一下」的物理感。 */
  let momentumRAF = null;
  function stopMomentumScroll(){
    if(momentumRAF){ cancelAnimationFrame(momentumRAF); momentumRAF = null; }
  }
  function startMomentumScroll(velocity){ // velocity: scrollTop 每毫秒的變化量(px/ms)
    stopMomentumScroll();
    let v = velocity;
    let lastT = performance.now();
    function step(now){
      const dt = Math.min(32, now - lastT); // 掉幀時限制單幀最大時間差，避免瞬間跳太遠
      lastT = now;
      if(Math.abs(v) < 0.02){ momentumRAF = null; return; }
      const maxScroll = Math.max(0, timelineScroll.scrollHeight - timelineScroll.clientHeight);
      const next = timelineScroll.scrollTop + v*dt;
      if(next <= 0){ timelineScroll.scrollTop = 0; momentumRAF = null; return; }
      if(next >= maxScroll){ timelineScroll.scrollTop = maxScroll; momentumRAF = null; return; }
      timelineScroll.scrollTop = next;
      v *= 0.94; // 摩擦力衰減
      momentumRAF = requestAnimationFrame(step);
    }
    momentumRAF = requestAnimationFrame(step);
  }

  /* ---------------- 手動捲動的 rAF 節流 ----------------
     pointermove 觸發頻率可能遠高於畫面更新頻率（一秒數十到上百次），
     若每次都直接寫 scrollTop，會強迫瀏覽器同步做版面重算，手感容易卡頓。
     這裡把同一影格內的多次位移量先累加起來，改成每個影格只真正寫入
     scrollTop 一次，讓瀏覽器有機會把重算跟繪製合併在一起處理。 */
  let pendingScrollDelta = 0;
  let scrollFlushRAF = null;
  function scheduleTimelineScroll(deltaY){
    pendingScrollDelta -= deltaY;
    if(scrollFlushRAF) return;
    scrollFlushRAF = requestAnimationFrame(function(){
      scrollFlushRAF = null;
      timelineScroll.scrollTop += pendingScrollDelta;
      pendingScrollDelta = 0;
    });
  }
  function flushTimelineScrollNow(){ // 手指放開的當下要立刻套用剩餘位移，不要等下一影格
    if(scrollFlushRAF){ cancelAnimationFrame(scrollFlushRAF); scrollFlushRAF = null; }
    if(pendingScrollDelta){ timelineScroll.scrollTop += pendingScrollDelta; pendingScrollDelta = 0; }
  }

  function snapToFiveMin(px){ const step = hourPx/12; return Math.round(px/step)*step; } // hourPx/12px = 5分鐘（每小時高度 ÷ 12），格線視覺上仍只畫到15分刻度，只是拖曳吸附變細
  function fiveMinPx(){ return hourPx/12; } // 5 分鐘對應的像素高度，供各處拖曳/縮放/建立行程的最小單位統一使用；隨 hourPx 縮放即時變動，所以寫成函式而不是常數

  // 讓拉框選取的範圍不能延伸進已經被其他行程占用的地方：anchorPx/anchorColIdx
  // 是拖曳的固定端（手指最初按下的位置），只有「正在延伸」的那一端會被
  // 夾住，夾到剛好碰到既有行程的邊界為止；如果夾到完全沒有空間，回傳
  // 一個高度為 0 的範圍，代表這裡放不下、不能建立。
  function clampSelectionAgainstCollisions(top, bottom, colMin, colMax, growingDown, growingRight){
    const insts = getInstancesForDate(currentDate);
    const blockers = [];
    insts.forEach(inst => {
      const iTop = timeToMinutes(inst.start)/60*hourPx;
      const iBottom = timeToMinutes(inst.end)/60*hourPx;
      eventColRuns(inst).forEach(([runMin, runMax]) => {
        if(colMin <= runMax && runMin <= colMax && top < iBottom && iTop < bottom){
          blockers.push({iTop, iBottom, runMin, runMax});
        }
      });
    });
    if(blockers.length === 0) return {top, bottom, colMin, colMax};

    let newTop = top, newBottom = bottom;
    if(growingDown){
      // 上緣固定，往下延伸 → 夾住 bottom
      const limits = blockers.map(b => b.iTop).filter(v => v >= top - 0.01);
      if(limits.length) newBottom = Math.min(newBottom, Math.min(...limits));
    } else {
      // 下緣固定，往上延伸 → 夾住 top
      const limits = blockers.map(b => b.iBottom).filter(v => v <= bottom + 0.01);
      if(limits.length) newTop = Math.max(newTop, Math.max(...limits));
    }

    let newColMin = colMin, newColMax = colMax;
    const stillBlocking = blockers.filter(b => newTop < b.iBottom && b.iTop < newBottom);
    if(stillBlocking.length){
      if(growingRight){
        const limits = stillBlocking.map(b => b.runMin - 1).filter(v => v >= colMin);
        if(limits.length) newColMax = Math.min(newColMax, Math.min(...limits));
      } else {
        const limits = stillBlocking.map(b => b.runMax + 1).filter(v => v <= colMax);
        if(limits.length) newColMin = Math.max(newColMin, Math.max(...limits));
      }
    }

    if(newBottom < newTop) newBottom = newTop; // 夾到沒有空間，高度歸零（代表這裡放不下）
    if(newColMax < newColMin) newColMax = newColMin;
    return {top:newTop, bottom:newBottom, colMin:newColMin, colMax:newColMax};
  }

  function ensureSelectionBox(){
    if(selectionBox) return selectionBox;
    selectionBox = document.createElement('div');
    selectionBox.className = 'selection-box';
    selectionBox.innerHTML = '<span class="selection-label"></span>';
    // 一定要掛在 eventsLayer 底下（不是 timelineGrid！），因為欄位的
    // 百分比寬度是以 eventsLayer 的寬度為基準（已經扣掉左側 58px 的
    // 時間刻度區）。掛錯父層會讓百分比基準多算那 58px，導致選取框
    // 整體往左偏移。
    eventsLayer.appendChild(selectionBox);
    return selectionBox;
  }
  function removeSelectionBox(){
    if(selectionBox){ selectionBox.remove(); selectionBox = null; }
  }
  function paintSelectionBox(topPx, bottomPx, colMin, colMax){
    const box = ensureSelectionBox();
    const n = columns.length;
    const trueHeight = bottomPx - topPx;
    box.style.top = topPx+'px';
    box.style.height = Math.max(6, trueHeight)+'px'; // 視覺上留一點高度看得到,但不代表可以建立
    box.style.left = 'calc(' + (colMin/n*100) + '% + 2px)';
    box.style.width = 'calc(' + ((colMax-colMin+1)/n*100) + '% - 4px)';
    box.classList.toggle('no-room', trueHeight < fiveMinPx());
    // 直接記錄實際欄位索引跟「真實」高度，放開時讀這裡即可，不要從
    // calc() 字串或被強制拉高的 style.height 反推。
    box.dataset.colMin = colMin;
    box.dataset.colMax = colMax;
    box.dataset.trueTop = topPx;
    box.dataset.trueBottom = bottomPx;
    const startMin = Math.round(topPx/hourPx*60);
    const endMin = Math.round(bottomPx/hourPx*60);
    const names = columns.slice(colMin, colMax+1).map(c=>c.name).join('、');
    box.querySelector('.selection-label').textContent = trueHeight < fiveMinPx()
      ? '沒有空間'
      : minutesToTime(startMin) + ' – ' + minutesToTime(endMin) + (names ? ' · '+names : '');
  }

  (function(){
    let downY = 0, downX = 0, lastY = 0, anchorPx = 0, anchorColIdx = 0;
    let lastMoveTime = 0, scrollVelocity = 0;
    let longPressTimer = null;
    let selecting = false;
    let cancelled = false;
    let gestureMode = null; // 一旦離開長按判斷，決定是 'scroll'（捲動）還是 'swipeday'（左右滑動切日），決定後就不再切換
    let cachedRect = null; // 手勢開始時量一次就好，過程中 eventsLayer 不會捲動（見下方說明），不用每次 pointermove 重量

    function colIdxFromX(clientX){
      const rect = cachedRect || eventsLayer.getBoundingClientRect();
      const n = Math.max(1, columns.length);
      const ratio = (clientX - rect.left) / rect.width;
      return Math.max(0, Math.min(n-1, Math.floor(ratio * n)));
    }

    function onMove(e){
      if(pinchActive) return; // 雙指縮放進行中，這個手勢不再繼續處理

      if(!selecting){
        // timeline-grid 是 touch-action:none，瀏覽器不會自動幫忙捲動，
        // 所以一旦判定使用者其實是想捲動或左右滑動切日（而不是要長按
        // 拉框），要自己接手處理，才會有正常的手勢手感。
        if(!cancelled){
          const dy = e.clientY - downY;
          const dx = e.clientX - downX;
          if(Math.abs(dy) > 8 || Math.abs(dx) > 15){
            cancelled = true;
            clearTimeout(longPressTimer);
            let mode = (Math.abs(dx) > Math.abs(dy)) ? 'swipeday' : 'scroll';
            gestureMode = mode;
          }
        }
        if(gestureMode === 'scroll'){
          const now = performance.now();
          const dt = now - lastMoveTime || 16;
          const deltaY = e.clientY - lastY;
          scheduleTimelineScroll(deltaY);
          scrollVelocity = -deltaY / dt; // 記錄最後的捲動速度，放開時延續當慣性
          lastMoveTime = now;
        } else if(gestureMode === 'swipeday'){
          e.preventDefault();
          updateDaySlide(e.clientX - downX); // 畫面即時跟著手指位移滑動，跟垂直捲動同樣的連貫手感
        }
        lastY = e.clientY;
        return;
      }
      e.preventDefault();
      // 選取框拖曳期間畫面不會捲動（上面 scroll 分支只會在 !selecting 時觸發），
      // 所以用手勢開始時量到的 cachedRect 換算目前位置即可，不用每次 pointermove
      // 都重新呼叫 getBoundingClientRect() 強迫瀏覽器同步重算版面。
      const curPx = e.clientY - cachedRect.top;
      let top = Math.min(anchorPx, curPx);
      let bottom = Math.max(anchorPx, curPx);
      top = Math.max(0, snapToFiveMin(top));
      bottom = Math.min(hourPx*24, snapToFiveMin(bottom));
      if(bottom - top < fiveMinPx()) bottom = top + fiveMinPx();

      const curColIdx = colIdxFromX(e.clientX);
      const colMin = Math.min(anchorColIdx, curColIdx);
      const colMax = Math.max(anchorColIdx, curColIdx);
      const growingDown = curPx >= anchorPx;
      const growingRight = curColIdx >= anchorColIdx;

      const clamped = clampSelectionAgainstCollisions(top, bottom, colMin, colMax, growingDown, growingRight);
      paintSelectionBox(clamped.top, clamped.bottom, clamped.colMin, clamped.colMax);
    }

    function onUp(e){
      clearTimeout(longPressTimer);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);

      if(selecting){
        const box = selectionBox;
        const top = Number(box.dataset.trueTop);
        const bottom = Number(box.dataset.trueBottom);
        const colMin = Number(box.dataset.colMin);
        const colMax = Number(box.dataset.colMax);
        removeSelectionBox();
        if(bottom - top >= fiveMinPx()){ // 被夾到沒有空間時這裡會趨近 0，不建立行程
          const startMin = Math.round(top/hourPx*60);
          const endMin = Math.round(bottom/hourPx*60);
          const participantIds = columns.slice(colMin, colMax+1).map(c=>c.id);
          createNewEvent(startMin, endMin, participantIds);
        }
      } else if(gestureMode === 'swipeday'){
        // 放開手指：滑動幅度夠大就用動畫接續完成切日，不夠就彈回原位
        endDaySlide(e.clientX - downX);
      } else if(gestureMode === 'scroll'){
        flushTimelineScrollNow();
        startMomentumScroll(scrollVelocity);
      }
      selecting = false;
      cancelled = false;
      gestureMode = null;
    }

    timelineGrid.addEventListener('pointerdown', function(e){
      if(selectMode) return; // 選取狀態下，空白處長按不建立新行程，避免手勢衝突
      if(pinchActive) return; // 雙指縮放進行中，單指手勢一律不啟動
      // 只處理空白區域（行程卡自己的 pointerdown 會 stopPropagation）
      stopMomentumScroll(); // 再次觸碰畫面就先停掉還在滑的慣性捲動
      downY = e.clientY;
      downX = e.clientX;
      lastY = e.clientY;
      lastMoveTime = performance.now();
      scrollVelocity = 0;
      cancelled = false;
      selecting = false;
      gestureMode = null;
      cachedRect = eventsLayer.getBoundingClientRect(); // 這次手勢期間都重複用這份，不再逐格重量
      anchorPx = e.clientY - cachedRect.top;
      anchorColIdx = colIdxFromX(e.clientX);

      longPressTimer = setTimeout(function(){
        if(cancelled) return;
        if(pinchActive) return; // 計時器觸發當下才是真正該檢查雙指縮放的時機，避免縮放時誤建新行程
        selecting = true;
        if(navigator.vibrate) navigator.vibrate(15);
        let top = Math.max(0, snapToFiveMin(anchorPx));
        let bottom = Math.min(hourPx*24, top + hourPx); // 預設長按不拖曳＝1小時
        const clamped = clampSelectionAgainstCollisions(top, bottom, anchorColIdx, anchorColIdx, true, true);
        paintSelectionBox(clamped.top, clamped.bottom, clamped.colMin, clamped.colMax);
      }, 400);

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  })();

  function createNewEvent(startMin, endMin, participantIds){
    startMin = Math.max(0, Math.min(23*60+55, startMin));
    endMin = Math.max(startMin+5, Math.min(24*60, endMin));
    if(!participantIds || participantIds.length===0) participantIds = [columns[0].id];
    const id = 'e' + Date.now();
    const ev = {
      id: id,
      title: '新行程',
      date: currentDate,
      start: minutesToTime(startMin),
      end: minutesToTime(endMin),
      notes: '',
      participants: participantIds.slice(),
      creatorId: CURRENT_USER_ID,
      color: EVENT_COLORS[events.length % EVENT_COLORS.length].id,
      recurrence: null
    };
    events.push(ev);
    renderEvents();
    return id;
  }

  document.getElementById('fabAdd').addEventListener('click', function(){
    if(selectMode) return;
    const now = new Date();
    const startHour = currentDate === todayStr() ? now.getHours() : 9;
    const newId = createNewEvent(startHour*60, startHour*60 + 60, [columns[0].id]);
    openEdit(newId, currentDate);
  });

  document.getElementById('btnAddColumn').addEventListener('click', function(){
    if(selectMode) return;
    const name = (window.prompt('新增共編使用者的名字：', '') || '').trim();
    if(!name) return;
    const id = 'p' + Date.now();
    columns.push({id, name});
    renderColumnHeader();
    renderEvents(); // 欄位數變了，行程的寬度/位置要重新計算
  });

  datePicker.addEventListener('change', function(){
    if(!datePicker.value) return;
    currentDate = datePicker.value;
    renderTimeline();
  });

  /* ---------------- 編輯頁：欄位連動 ---------------- */
  const pageTimeline = document.getElementById('page-timeline');
  const pageEdit = document.getElementById('page-edit');
  const fieldTitle = document.getElementById('fieldTitle');
  // 新建立的行程預設標題是「新行程」：點進標題欄位準備輸入時，
  // 如果還是這個預設值，直接幫使用者清空，不用自己手動刪除。
  fieldTitle.addEventListener('focus', function(){
    if(fieldTitle.value === '新行程') fieldTitle.value = '';
  });
  const fieldDate = document.getElementById('fieldDate');
  const fieldStart = document.getElementById('fieldStart');
  const fieldEnd = document.getElementById('fieldEnd');
  const fieldNotes = document.getElementById('fieldNotes');
  const participantsBox = document.getElementById('participantsBox');
  const colorBox = document.getElementById('colorBox');
  const weekdayBox = document.getElementById('weekdayBox');
  const syncField = document.getElementById('syncField');
  const fieldSyncEdit = document.getElementById('fieldSyncEdit');
  let selectedParticipants = new Set();
  let selectedWeekdays = new Set();
  let selectedColor = DEFAULT_EVENT_COLOR;

  function renderColorSwatches(colorId){
    selectedColor = colorId || DEFAULT_EVENT_COLOR;
    colorBox.innerHTML = '';
    EVENT_COLORS.forEach(c => {
      const sw = document.createElement('div');
      sw.className = 'color-swatch' + (selectedColor === c.id ? ' selected' : '');
      sw.style.background = c.hex;
      sw.title = c.name;
      sw.addEventListener('click', function(){
        selectedColor = c.id;
        colorBox.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
        sw.classList.add('selected');
      });
      colorBox.appendChild(sw);
    });
  }

  function renderParticipantChips(selectedIds){
    selectedParticipants = new Set(selectedIds);
    participantsBox.innerHTML = '';
    columns.forEach(col => {
      const chip = document.createElement('div');
      chip.className = 'participant-chip' + (selectedParticipants.has(col.id) ? ' selected' : '');
      chip.dataset.id = col.id;
      chip.innerHTML = '<span class="chip-dot"></span><span></span>';
      chip.querySelector('span:last-child').textContent = col.name;
      chip.addEventListener('click', function(){
        if(selectedParticipants.has(col.id)){
          // 至少保留一位參與者，避免行程變成沒人參加
          if(selectedParticipants.size > 1) selectedParticipants.delete(col.id);
        } else {
          selectedParticipants.add(col.id);
        }
        chip.classList.toggle('selected', selectedParticipants.has(col.id));
      });
      participantsBox.appendChild(chip);
    });
  }

  function renderWeekdayChips(weekdays){
    selectedWeekdays = new Set(weekdays||[]);
    weekdayBox.innerHTML = '';
    WEEKDAYS.forEach((label, idx) => {
      const chip = document.createElement('div');
      chip.className = 'weekday-chip' + (selectedWeekdays.has(idx) ? ' selected' : '');
      chip.textContent = label.slice(1); // 週日→日、週一→一...
      chip.addEventListener('click', function(){
        if(selectedWeekdays.has(idx)) selectedWeekdays.delete(idx);
        else selectedWeekdays.add(idx);
        chip.classList.toggle('selected', selectedWeekdays.has(idx));
      });
      weekdayBox.appendChild(chip);
    });
  }

  function fillEditForm(data, dateStr, isRecurring){
    fieldTitle.value = data.title || '';
    fieldDate.value = dateStr;
    fieldDate.disabled = !!isRecurring; // 重複行程的個別日期由「重複」規則決定，這裡不能單獨改
    fieldStart.value = data.start;
    fieldEnd.value = data.end;
    fieldNotes.value = data.notes || '';
    renderParticipantChips(data.participants && data.participants.length ? data.participants : [columns[0].id]);
    renderColorSwatches(data.color || DEFAULT_EVENT_COLOR);
  }

  // 開始／結束時間各自獨立，使用者手動調整，不再互相連動或自動推算

  /* ---------------- 開啟／關閉編輯頁（SPA + History API） ----------------
     注意：某些內嵌預覽環境（例如聊天工具的沙盒 iframe）會擋掉
     history.pushState/back，呼叫時會直接丟出例外。若不處理，例外會中斷
     整段初始化流程，導致時間網格畫不出來、點擊也沒有反應。
     這裡一律用 try/catch 包住，失敗時改用純 JS 的頁面切換當備援，
     真正部署到瀏覽器分頁時則會自動使用真正的 History API（返回鍵可用）。 */
  let usingRealHistory = true;
  let editingMasterId = null;
  let editingInstanceDate = null;

  function openEdit(masterId, instanceDate){
    const master = events.find(e => e.id === masterId);
    if(!master) return;
    editingMasterId = masterId;
    editingInstanceDate = instanceDate;

    // 取得這一天實際顯示的內容（已套用 override 的版本）
    const inst = getInstancesForDate(instanceDate).find(
      i => i.masterId === masterId && i.instanceDate === instanceDate
    );
    const data = inst || {
      title: master.title, start: master.start, end: master.end,
      notes: master.notes, participants: master.participants, color: master.color
    };

    fillEditForm(data, instanceDate, !!master.recurrence);
    renderWeekdayChips(master.recurrence ? master.recurrence.weekdays : []);
    syncField.style.display = master.recurrence ? 'flex' : 'none';
    fieldSyncEdit.checked = false;

    if(usingRealHistory){
      try{
        history.pushState({page:'edit'}, '', '#edit');
      }catch(err){
        usingRealHistory = false;
      }
    }
    showPage('edit');
  }

  function showPage(name){
    if(name === 'edit'){
      pageEdit.classList.add('active');
      pageTimeline.classList.add('pushed');
    } else {
      pageEdit.classList.remove('active');
      pageTimeline.classList.remove('pushed');
      editingMasterId = null;
      editingInstanceDate = null;
    }
  }

  function goBackToTimeline(){
    if(usingRealHistory){
      try{
        history.back(); // 觸發 popstate -> showPage('timeline')
        return;
      }catch(err){
        usingRealHistory = false;
      }
    }
    showPage('timeline'); // 備援：直接切換，不依賴 History API
  }

  window.addEventListener('popstate', function(e){
    // 手機返回鍵 / 側滑手勢：只退回時間軸主頁，不離開網頁
    showPage('timeline');
  });

  document.getElementById('btnCancel').addEventListener('click', function(){
    goBackToTimeline(); // 不儲存任何變更
  });

  document.getElementById('btnDone').addEventListener('click', function(){
    if(!editingMasterId) return;
    const master = events.find(e => e.id === editingMasterId);
    if(!master) return;

    const newTitle = fieldTitle.value.trim() || '新行程';
    const newNotes = fieldNotes.value;
    const newParticipants = selectedParticipants.size ? Array.from(selectedParticipants) : [columns[0].id];

    // 開始／結束時間各自獨立，直接讀取使用者手動填的值；
    // 只有在結束時間沒填或不晚於開始時間時才做最低限度的保底（開始後5分鐘）
    const newStart = fieldStart.value || master.start;
    let newEnd = fieldEnd.value;
    if(!newEnd || timeToMinutes(newEnd) <= timeToMinutes(newStart)){
      newEnd = minutesToTime(Math.min(24*60, timeToMinutes(newStart) + 5));
    }

    const newWeekdays = Array.from(selectedWeekdays).sort((a,b)=>a-b);
    const wasRecurring = !!master.recurrence;
    const syncOn = fieldSyncEdit.checked;

    // 顏色是整個行程系列共用的分類標籤，不像時間/備註那樣需要區分「只改這一天」，
    // 一律直接寫回本體，不放進 override。
    master.color = selectedColor;

    // 「重複」規則永遠套用到整個系列，跟同步編輯開關無關（單一日期沒有自己的重複規則）
    master.recurrence = newWeekdays.length ? {weekdays:newWeekdays} : null;

    if(!wasRecurring && !master.recurrence){
      // 原本就是單一行程，也沒有設定重複：直接改本體（含日期）
      master.title = newTitle;
      master.date = fieldDate.value || master.date;
      master.start = newStart; master.end = newEnd;
      master.notes = newNotes; master.participants = newParticipants;
    } else if(!wasRecurring && master.recurrence){
      // 這次才剛把單一行程加上重複規則：本體變成系列的 master，
      // date 欄位保持原本的起始日（重複行程時日期欄位是鎖住的，不會被改到）
      master.title = newTitle;
      master.start = newStart; master.end = newEnd;
      master.notes = newNotes; master.participants = newParticipants;
    } else if(syncOn){
      // 同步編輯：套用到整個系列
      master.title = newTitle;
      master.start = newStart; master.end = newEnd;
      master.notes = newNotes; master.participants = newParticipants;
      // 這一天如果原本有獨立編輯過的內容，順便清掉，讓它跟系列同步一致
      if(master.overrides) delete master.overrides[editingInstanceDate];
    } else {
      // 沒開同步編輯：只改這一天，寫入 override，系列其他日期不受影響
      master.overrides = master.overrides || {};
      master.overrides[editingInstanceDate] = {
        title:newTitle, start:newStart, end:newEnd, notes:newNotes, participants:newParticipants
      };
    }

    currentDate = master.recurrence ? editingInstanceDate : master.date;
    renderTimeline();
    goBackToTimeline();
  });

  document.getElementById('btnDelete').addEventListener('click', function(){
    if(!editingMasterId) return;
    const master = events.find(e => e.id === editingMasterId);
    if(!master) return;
    const syncOn = fieldSyncEdit.checked;

    if(!master.recurrence){
      events = events.filter(e => e !== master);
    } else if(syncOn){
      events = events.filter(e => e !== master); // 整個系列都刪除
    } else {
      // 只刪除這一天：加入排除清單，其餘日期的系列不受影響
      master.excluded = master.excluded || [];
      if(master.excluded.indexOf(editingInstanceDate) === -1) master.excluded.push(editingInstanceDate);
      if(master.overrides) delete master.overrides[editingInstanceDate];
    }

    renderTimeline();
    goBackToTimeline();
  });

  /* ---------------- 初始化 ---------------- */
  try{
    history.replaceState({page:'timeline'}, '', '#timeline');
  }catch(err){
    usingRealHistory = false;
  }
  buildHourRows();
  renderTimeline();

  /* ---------------- 垂直縮放手勢：雙指 pinch ＋ 雙擊快速切換 ----------------
     用 capture 階段監聽 pointerdown/pointermove/pointerup，這樣不管是點在
     空白處還是行程卡片上（子元素自己的 pointerdown 通常會 stopPropagation），
     都一定能偵測到「現在有幾根手指按著」，藉此判斷雙指 pinch 是否開始。
     一旦偵測到第二根手指按下，就把 pinchActive 設成 true，讓其他單指手勢
     （拖曳搬移、調整時長、長按新增行程）在各自的 pointerdown/onMove 裡
     自動略過（見前面幾處 `if(pinchActive) return;`）。 */
  (function(){
    const activePointers = new Map(); // pointerId -> {x, y}，縮放期間持續更新，用來算兩指距離
    const downPositions = new Map();  // pointerId -> {x, y}，記錄按下當下的位置，判斷放開時是不是「真的只是輕點」
    let pinchStartDist = 0;
    let pinchStartHourPx = HOUR_PX_DEFAULT;
    let pinchRAF = null;
    let pendingPinch = null; // 存最新一次算出來的目標 hourPx / 縮放中心，等下一影格才真的套用

    function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
    function currentTwoPoints(){
      const pts = Array.from(activePointers.values());
      return pts.length >= 2 ? [pts[0], pts[1]] : null;
    }
    function flushPinchZoom(){
      pinchRAF = null;
      if(pendingPinch){
        setHourPx(pendingPinch.hourPx, pendingPinch.midY);
        pendingPinch = null;
      }
    }

    timelineScroll.addEventListener('pointerdown', function(e){
      activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      downPositions.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(activePointers.size === 2){
        const [p1, p2] = currentTwoPoints();
        pinchActive = true;
        pinchStartDist = dist(p1, p2) || 1;
        pinchStartHourPx = hourPx;
        closeCardMenu();
        closeClusterMenu();
        stopMomentumScroll();
      }
    }, true);

    timelineScroll.addEventListener('pointermove', function(e){
      if(!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(!pinchActive || activePointers.size < 2) return;
      const [p1, p2] = currentTwoPoints();
      const curDist = dist(p1, p2) || 1;
      const midY = (p1.y+p2.y)/2;
      // setHourPx 內部會整個重繪行程卡片，原始 pointermove 觸發頻率遠高於
      // 畫面更新頻率，這裡改成只記下最新目標值，真正的縮放動作節流到
      // 每個影格只做一次，跟捲動用同樣的節流手法。
      pendingPinch = { hourPx: pinchStartHourPx * (curDist / pinchStartDist), midY: midY };
      if(!pinchRAF) pinchRAF = requestAnimationFrame(flushPinchZoom);
    }, true);

    // 雙擊快速切換「預設／放大一級」，方便單指操作、不方便用雙指 pinch 的人。
    // 只有「按下到放開之間幾乎沒有移動」才算數，避免拖曳搬移行程、調整
    // 時長、放開慣性捲動之類的操作被誤判成點擊。
    let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

    timelineScroll.addEventListener('pointerup', function(e){
      const wasPinching = activePointers.size >= 2;
      const downPos = downPositions.get(e.pointerId);
      activePointers.delete(e.pointerId);
      downPositions.delete(e.pointerId);
      if(activePointers.size < 2){
        pinchActive = false;
        if(pinchRAF){ cancelAnimationFrame(pinchRAF); pinchRAF = null; }
        flushPinchZoom(); // 手指放開時，確保最後一次算出來的縮放結果一定有套用到，不會卡在上一影格
      }
      if(wasPinching || !downPos) return; // 剛結束一次 pinch，這一放開不算輕點

      const movedSinceDown = dist(downPos, {x:e.clientX, y:e.clientY});
      if(movedSinceDown > 12) return; // 手指移動過，代表這是拖曳/長按類的放開，不是輕點

      const now = performance.now();
      const dt = now - lastTapTime;
      const movedFromLastTap = Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY);
      if(dt < 300 && movedFromLastTap < 25){
        lastTapTime = 0; // 消耗掉這次雙擊，避免連續多擊又誤觸發
        const target = (Math.abs(hourPx - HOUR_PX_DEFAULT) < 1) ? HOUR_PX_ZOOM_STEP : HOUR_PX_DEFAULT;
        setHourPx(target, e.clientY);
      } else {
        lastTapTime = now;
        lastTapX = e.clientX;
        lastTapY = e.clientY;
      }
    }, true);

    timelineScroll.addEventListener('pointercancel', function(e){
      activePointers.delete(e.pointerId);
      downPositions.delete(e.pointerId);
      if(activePointers.size < 2){
        pinchActive = false;
        if(pinchRAF){ cancelAnimationFrame(pinchRAF); pinchRAF = null; }
        pendingPinch = null; // 手勢被取消，不要再套用殘留的縮放目標
      }
    }, true);
  })();

  // 開場自動捲到「現在時間線」的位置，讓那條線落在可視範圍由上往下 1/3
  // 的地方；如果現在時間太晚，往下捲會超過畫面底部，夾限會自動讓它
  // 停在捲動範圍的最底端，不會硬要維持在 1/3 處造成過捲。
  function scrollToNowLine(){
    if(currentDate !== todayStr()){
      timelineScroll.scrollTop = 7*hourPx; // 不是今天就沒有「現在時間線」，退回原本的預設位置
      return;
    }
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const nowTopPx = nowMin/60*hourPx;
    const visibleHeight = timelineScroll.clientHeight;
    let target = nowTopPx - visibleHeight/3;
    const maxScroll = Math.max(0, timelineScroll.scrollHeight - timelineScroll.clientHeight);
    target = Math.max(0, Math.min(maxScroll, target));
    timelineScroll.scrollTop = target;
  }
  scrollToNowLine();

  // 每分鐘更新一次「現在時間」紅線
  setInterval(renderNowLine, 60*1000);

})();
</script>
</body>
</html>
