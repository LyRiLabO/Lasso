<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>手帳曆 · 共編行事曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4;
    --paper-deep:#EFE8D6;
    --line:#DBD0B4;
    --line-soft:#E8E0CC;
    --ink:#20263A;
    --ink-soft:#5B6178;
    --ink-faint:#9096A8;
    --red:#B23A2F;
    --red-deep:#8E2C24;
    --card:#FFFDF8;
    --shadow:rgba(32,38,58,0.16);
    --gold:#C08A2E;
    --sage:#7C8F6A;
    --dusk:#6E7FA3;
    --blush:#C77B6C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* 整個介面預設不能被框選文字，這是像手機 App 一樣操作的關鍵：
     手指誤觸不會選到文字。雙擊/雙指縮放已經靠 viewport 的
     user-scalable=no 擋掉了，這裡刻意不再疊加 touch-action:manipulation——
     那樣會讓瀏覽器提早搶走垂直滑動的判斷權，害長按拖曳（移動行程、
     空白處拉框建立行程）的 400ms 判斷來不及生效，整個被當成頁面捲動。
     真正需要輸入文字的欄位（文字框、日期、時間、數字、多行備註）
     則保留正常的選取/游標行為，不然沒辦法編輯內容。 */
  html, body{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  input, textarea{
    -webkit-user-select:text; user-select:text;
    -webkit-touch-callout:default;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:#DDD5C0;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100%;
  }
  #phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,0.35);
  }
  @media (min-width:431px){
    body{padding:28px 0;}
    #phone{min-height:860px; border-radius:28px; box-shadow:0 30px 70px rgba(20,20,30,0.45);}
  }

  .page{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    background:var(--paper);
    transform:translateX(0);
    transition:transform .32s cubic-bezier(.4,0,.2,1), opacity .32s ease;
  }
  .page.hidden{visibility:hidden; pointer-events:none;}
  #page-edit{transform:translateX(100%);}
  #page-edit.active{transform:translateX(0);}
  #page-timeline.pushed{transform:translateX(-18%); filter:brightness(0.9);}

  /* ---------- Timeline page ---------- */
  .planner-header{
    padding:16px 20px 14px 20px;
    display:flex; flex-direction:column; gap:12px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:relative;
    z-index:3;
  }
  .date-center-nav{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    min-height:44px;
  }
  .add-col-btn{
    position:absolute;
    right:0; top:50%;
    transform:translateY(-50%);
    padding:7px 10px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .add-col-btn svg{flex:0 0 auto;}
  .add-col-btn:active{opacity:.8;}
  /* 「選取」控制項：跟右側新增共編者按鍵左右對稱（left:0 對 right:0，
     同樣的 top:50% + translateY(-50%) 垂直置中），viewport 邊界間距一致。
     內含「選取／×」切換鍵本身，以及只有在選取狀態下才出現的垃圾桶鍵。
     造型先跟新增共編者按鍵同款（黑色圓角長方形），之後再依需求微調。 */
  .select-controls{
    position:absolute;
    left:0; top:50%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .select-toggle-btn{
    padding:7px 14px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.02em;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .select-toggle-btn:active{opacity:.8;}
  .select-toggle-btn.active{
    background:var(--red);
    border-color:var(--red);
  }
  .select-delete-btn{
    padding:7px 10px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .select-delete-btn svg{flex:0 0 auto;}
  .select-delete-btn:active{opacity:.8;}
  .select-delete-btn[hidden]{display:none;}
  #phone.select-mode-active .fab,
  #phone.select-mode-active .add-col-btn{
    display:none;
  }
  .date-display{
    position:relative;
    text-align:center;
    min-width:150px;
    padding:5px 14px;
    /* 白色實心底板，襯出「嵌在螢幕裡」的感覺 */
    background:#FFFFFF;
    border-radius:10px;
    border:2px solid transparent; /* 預留邊框粗細，是今天時只換顏色，不會因為邊框出現/消失而跳動 */
    box-shadow:inset 0 1px 4px rgba(32,38,58,0.18), 0 1px 0 rgba(255,255,255,0.6);
    overflow:hidden;
  }
  .date-display.is-today{
    border-color:var(--red);
  }
  .date-content{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    width:100%;
  }
  .date-content-preview{
    position:absolute;
    top:6px; left:14px; right:14px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    pointer-events:none;
  }
  .date-display.animating .date-content,
  .date-display.animating .date-content-preview{
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  .date-display .weekday{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.12em;
    color:var(--ink-faint);
  }
  .date-display .date-num{
    display:block;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:17px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  /* 疊在日期文字上的原生日期輸入框：本身完全透明，但可以點擊/觸控，
     點下去就會跳出手機/瀏覽器內建的日期選擇器，選完直接換日。 */
  .date-picker-input{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    opacity:0;
    border:none;
    padding:0; margin:0;
    cursor:pointer;
    -webkit-appearance:none;
  }

  .timeline-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;
    touch-action:pan-y;
    overscroll-behavior:contain;
    padding-bottom:110px; /* 讓接近24:00的時段可以捲離畫面底部，方便觸控 */
  }
  .day-slider{
    position:relative;
    height:1200px; /* 24 * 50px，撐開外層可以捲動的高度 */
    overflow-x:hidden;
  }
  .timeline-grid, .day-preview-panel{
    position:absolute;
    top:0; left:0; right:16px;
    height:1200px;
  }
  .timeline-grid{
    touch-action:none;
  }
  .day-preview-panel{
    pointer-events:none; /* 純預覽用，滑動中不可互動 */
  }
  .day-slider.animating .timeline-grid,
  .day-slider.animating .day-preview-panel{
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  .margin-rule{
    position:absolute;
    top:0; bottom:0;
    left:52px;
    width:1.5px;
    background:var(--red);
    opacity:.55;
    z-index:1;
  }
  .hour-row{
    position:absolute;
    left:0; right:0;
    height:50px;
    border-top:1px solid var(--line-soft);
  }
  .hour-row:first-child{border-top:none;}
  .hour-row .hlabel{
    position:absolute;
    left:12px; top:-7px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    background:var(--paper);
    padding:0 3px;
  }
  .hour-row .half-tick{
    position:absolute;
    left:52px; right:0; top:25px;
    border-top:1px dashed var(--line);
    opacity:.7;
  }
  .hour-row .quarter-tick{
    position:absolute;
    left:52px; right:0;
    border-top:1px dotted var(--line);
    opacity:.4;
  }
  .now-line{
    position:absolute;
    left:52px; right:0;
    height:0;
    border-top:2px solid var(--red);
    z-index:4;
  }
  .now-line::before{
    content:"";
    position:absolute;
    left:-4px; top:-4px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--red);
  }
  .events-layer{
    position:absolute; inset:0;
    left:58px; right:14px;
    z-index:2;
  }
  .event-card{
    position:absolute;
    left:0; right:0;
    min-height:8px;
    touch-action:none;
    background:var(--card);
    border-radius:8px;
    border-left:4px solid var(--gold);
    box-shadow:0 2px 6px var(--shadow);
    padding:5px 10px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    user-select:none;
  }
  .event-card .ecard-title{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .event-card .ecard-time{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .event-card.c-gold{border-left-color:var(--gold);}
  .event-card.c-sage{border-left-color:var(--sage);}
  .event-card.c-dusk{border-left-color:var(--dusk);}
  .event-card.c-blush{border-left-color:var(--blush);}
  .event-card.c-gold .resize-handle::after{background:var(--gold);}
  .event-card.c-sage .resize-handle::after{background:var(--sage);}
  .event-card.c-dusk .resize-handle::after{background:var(--dusk);}
  .event-card.c-blush .resize-handle::after{background:var(--blush);}
  /* 選取狀態：拖曳圓點收起（避免跟選取手勢打架），
     已選取的行程整張卡片變灰，沒有權限選取的行程則半透明淡出、無法點擊。 */
  .event-card.select-mode .resize-handle{display:none;}
  .event-card.select-picked{
    background:#CBCDD4 !important;
    border-left-color:#8A8FA0 !important;
  }
  .event-card.select-picked .ecard-title,
  .event-card.select-picked .ecard-time{
    color:#4B5066;
  }
  .event-card.select-locked{
    opacity:.4;
    cursor:not-allowed;
  }
  .event-card.dragging{
    transform:scale(1.04);
    box-shadow:0 10px 26px var(--shadow);
    z-index:10;
  }
  .event-card.resizing{
    box-shadow:0 10px 26px var(--shadow);
    z-index:12;
  }
  .resize-handle{
    position:absolute;
    right:-13px; bottom:-13px;
    width:36px; height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:se-resize;
    touch-action:none;
    z-index:13;
  }
  .resize-handle::after{
    content:"";
    display:block;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--ink);
    border:2.5px solid var(--paper);
    transition:transform .12s ease;
  }
  .resize-handle.active::after{
    transform:scale(1.7);
  }

  /* 長按拖曳行程時的浮動卡片：脫離欄位的百分比定位系統，直接用
     position:fixed 跟著手指座標走，可以自由跨欄、跨日移動，
     不會被卡在固定的欄位位置上。 */
  .card-ghost{
    position:fixed !important;
    right:auto !important;
    z-index:999;
    pointer-events:none;
    box-shadow:0 14px 30px rgba(32,38,58,0.38);
    transform:scale(1.06);
    opacity:0.97;
  }
  .card-ghost .resize-handle{ display:none; }

  /* 長按行程卡片（不拖動）跳出的「複製／刪除」快捷選單 */
  .card-menu{
    position:fixed;
    display:flex;
    background:var(--ink);
    border-radius:11px;
    box-shadow:0 10px 24px rgba(32,38,58,0.4);
    overflow:visible;
    z-index:1000;
  }
  .card-menu button{
    border:none;
    background:none;
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;
    font-weight:700;
    padding:11px 18px;
    cursor:pointer;
    white-space:nowrap;
  }
  .card-menu button:first-child{
    border-radius:11px 0 0 11px;
  }
  .card-menu button:last-child{
    border-radius:0 11px 11px 0;
  }
  .card-menu button + button{
    border-left:1px solid rgba(246,241,228,0.22);
  }
  .card-menu button:active{background:rgba(246,241,228,0.14);}
  .card-menu button.danger{color:#F4B8AA;}
  .card-menu.arrow-down::after,
  .card-menu.arrow-up::after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    border-width:6px 6px 0 6px;
    border-style:solid;
    border-color:var(--ink) transparent transparent transparent;
  }
  .card-menu.arrow-down::after{ bottom:-6px; }
  .card-menu.arrow-up::after{ top:-6px; transform:translateX(-50%) rotate(180deg); }

  /* 好幾個很短、緊挨在一起的行程：各自的浮動標籤會疊在一起沒辦法辨識，
     這種情況乾脆合併成一個「+N 個行程」提示，點下去才展開清單。
     清單本身的視覺跟長按選單（.card-menu）同一套語彙，只是改成直向排列。 */
  .event-card .ecard-solo.ecard-cluster{
    pointer-events:auto;
    cursor:pointer;
    background:var(--red);
  }
  .cluster-menu{
    position:fixed;
    display:flex;
    flex-direction:column;
    background:var(--ink);
    border-radius:11px;
    box-shadow:0 10px 24px rgba(32,38,58,0.4);
    overflow:hidden;
    z-index:1000;
    min-width:180px;
    max-width:min(280px, 84vw);
  }
  .cluster-menu-title{
    color:var(--ink-faint);
    font-family:'Noto Sans TC', sans-serif;
    font-size:11px;
    font-weight:700;
    padding:10px 14px 4px;
  }
  .cluster-menu button{
    border:none;
    background:none;
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;
    font-weight:700;
    padding:10px 14px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:baseline;
    gap:8px;
    white-space:nowrap;
    overflow:hidden;
  }
  .cluster-menu button span:first-child{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1 1 auto;
    min-width:0;
  }
  .cluster-menu button span:last-child{
    flex:0 0 auto;
    font-weight:600;
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .cluster-menu button:active{background:rgba(246,241,228,0.14);}
  .cluster-menu button + button{border-top:1px solid rgba(246,241,228,0.14);}

  /* 時長 < 45 分鐘：高度放不下兩行，標題與時間改成同一行並排 */
  .event-card.compact{
    display:flex;
    align-items:center;
    padding:2px 9px;
  }
  .event-card.compact .ecard-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    min-width:0;
    width:100%;
    overflow:hidden;
    white-space:nowrap;
  }
  .event-card.compact .ecard-row .ecard-title{
    flex:0 1 auto;
    min-width:0;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .event-card.compact .ecard-row .ecard-time{
    flex:0 0 auto;
    margin:0;
  }

  /* 格子不管用哪種排版都裝不下行程名稱＋時間時（不管是被高度夾住，
     還是寬度太窄被截斷），改用這個統一的「浮動標籤」：字體大小固定
     不再動態縮小，文字整段貼在格子正上方（貼在時間軸最上緣、上面
     沒有空間時改貼下方），永遠完整顯示。格子本身留一條乾淨的色塊
     當作這段時間的視覺提示即可。 */
  .event-card.label-floated{
    overflow:visible;
    padding:0;
  }
  .event-card .ecard-solo{
    position:absolute;
    left:0;
    white-space:nowrap;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:11px;
    line-height:1.3;
    color:var(--paper);
    background:var(--ink);
    padding:3px 8px;
    border-radius:8px;
    box-shadow:0 3px 8px rgba(32,38,58,0.32);
    z-index:6;
    pointer-events:none; /* 純顯示用，點擊要穿透到底下的色塊，不擋原本的卡片互動 */
  }
  .event-card.float-above .ecard-solo{ bottom:calc(100% + 4px); }
  .event-card.float-below .ecard-solo{ top:calc(100% + 4px); }

  .fab{
    position:absolute;
    right:16px; bottom:22px;
    width:auto; height:auto;
    padding:10px;
    border-radius:12px;
    background:none;
    color:var(--ink);
    border:none;
    box-shadow:none;
    filter:drop-shadow(0 3px 6px rgba(32,38,58,0.28));
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:5;
  }
  .fab:active{opacity:.6;}

  .selection-box{
    position:absolute;
    left:58px; right:14px;
    background:rgba(178,58,47,0.12);
    border:1.5px dashed var(--red);
    border-radius:6px;
    z-index:6;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .selection-box .selection-label{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:11px;
    color:var(--red-deep);
    background:var(--paper);
    padding:2px 8px;
    border-radius:10px;
    white-space:nowrap;
  }
  .selection-box.no-room{
    background:rgba(120,120,120,0.14);
    border-color:var(--ink-faint);
  }
  .selection-box.no-room .selection-label{
    color:var(--ink-faint);
  }

  .column-header-row{
    position:sticky; top:0; z-index:3;
    display:flex;
    padding:10px 14px 8px 58px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    gap:0;
  }
  .column-header-row .col-head{
    flex:1 1 0;
    min-width:0;
    text-align:center;
    padding:0 4px;
  }
  .col-head .col-dot{
    display:inline-block;
    width:7px; height:7px;
    border-radius:50%;
    margin-right:4px;
  }
  .col-head .col-name{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .col-head .col-name.col-name-editable{
    cursor:pointer;
  }
  .col-head .col-name.col-name-editable:active{
    opacity:.6;
  }
  .col-head.col-gold .col-dot{background:var(--gold);}
  .col-head.col-sage .col-dot{background:var(--sage);}
  .col-head.col-dusk .col-dot{background:var(--dusk);}
  .col-head.col-blush .col-dot{background:var(--blush);}

  /* 選取狀態下，欄位標題也是可點擊的選取對象：自己的欄位可以點擊圈選，
     別人的欄位變半透明表示不可操作；圈選後整欄（含標題）都會出現灰底。 */
  .col-head.select-pickable{cursor:pointer;}
  .col-head.select-locked{opacity:.4; cursor:not-allowed;}
  .col-head.select-picked{
    background:rgba(91,97,120,0.22);
    border-radius:8px;
  }
  .col-head.select-picked .col-name{color:var(--ink-soft);}
  /* 整欄由上到下的灰底，畫在 col-dividers 這層（在格線之上、行程卡之下） */

    position:absolute;
    top:0; bottom:0;
    background:rgba(91,97,120,0.16);
    pointer-events:none;

  .col-dividers{
    position:absolute;
    inset:0;
    left:58px; right:14px;

    pointer-events:none;

  .col-dividers .col-div-line{
    position:absolute;
    top:0; bottom:0;

    background:var(--line);

  .hint-empty{
    position:absolute;

    pointer-events:none;

  /* ---------- Edit page ---------- */
  .edit-header{
    padding:20px 16px 16px 16px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .edit-title-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;

  .text-btn{
    background:none; border:none;
    font-family:'Noto Sans TC', sans-serif;
    font-size:14.5px;
    color:var(--ink-soft);
    padding:6px 4px;
    cursor:pointer;
  }
  .text-btn.primary{
    color:#fff;
    background:var(--red);
    border-radius:20px;
    padding:7px 18px;
    font-weight:700;
  }
  .text-btn.primary:active{background:var(--red-deep);}
  .text-btn:active{color:var(--ink);}

  .edit-body{
    flex:1;
    overflow-y:auto;
    padding:22px 20px 40px 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  .field input[type=text],
  .field input[type=date],
  .field textarea{
    font-family:'Noto Serif TC', serif;
    font-size:17px;
    color:var(--ink);
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    padding:6px 2px 10px 2px;
    outline:none;
    width:100%;
  }
  .field input:focus-visible,
  .field textarea:focus-visible,
  .time-trio input:focus-visible{
    outline:none;
    border-bottom-color:var(--red);
  }
  .field textarea{
    font-family:'Noto Sans TC', sans-serif;
    font-size:14.5px;

    display:flex;
    background:var(--card);
    border-radius:12px;
    box-shadow:0 2px 8px var(--shadow);
    position:relative;
    overflow:visible;

  .ticket::before, .ticket::after{

  .ticket::before{left:-8px;}

  }
  .toggle-switch{
    position:relative;
    width:36px; height:20px;
    border-radius:11px;
    background:var(--line);

    transition:background .18s ease;
  }
  .toggle-switch::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:16px; height:16px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
    transition:transform .18s ease;
  }
  .sync-toggle input:checked + .toggle-switch{
    background:var(--red);
  }
  .sync-toggle input:checked + .toggle-switch::after{
    transform:translateX(16px);
  }

  .field input[type=date]:disabled{
    color: var(--ink-faint);
    -webkit-text-fill-color: var(--ink-faint);

  ::-webkit-scrollbar{width:0;height:0;}

  @media (prefers-reduced-motion: reduce){
    .page{transition:none;}
    .event-card{transition:none;}
  }
