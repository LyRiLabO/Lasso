        '<button type="button" data-action="del" class="danger">刪除</button>' +
      '</div>';
    if(shrunkTitle) menu.querySelector('.card-menu-title-row').textContent = shrunkTitle;
    document.body.appendChild(menu);

    const menuRect = menu.getBoundingClientRect();
    let left = rect.left + rect.width/2 - menuRect.width/2;
    left = Math.max(8, Math.min(left, window.innerWidth - menuRect.width - 8));
    let top = rect.top - menuRect.height - 10;
    let arrowDown = true;
    if(top < 8){ top = rect.bottom + 10; arrowDown = false; } // 卡片太靠畫面上緣就改顯示在下方
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.classList.add(arrowDown ? 'arrow-down' : 'arrow-up');

    menu.querySelector('[data-action="dup"]').addEventListener('click', function(ev){
      ev.stopPropagation();
      duplicateInstance(masterId, instanceDate);
      closeCardMenu();
      renderEvents();
    });
    menu.querySelector('[data-action="del"]').addEventListener('click', function(ev){
      ev.stopPropagation();
      closeCardMenu();
      showConfirmDialog('確定刪除？', function(){
        deleteInstanceQuick(masterId, instanceDate);
        renderEvents();
      }, {danger:true});
    });

    cardMenuEl = menu;
  }

  // 用 capture 階段監聽，確保比任何卡片自己的 pointerdown（會 stopPropagation）
  // 都還早判斷到「點了選單以外的地方」，藉此正確關閉選單。
  document.addEventListener('pointerdown', function(e){
    if(!cardMenuEl) return;
    if(cardMenuEl.contains(e.target)) return; // 點選單本身不算「點空白處」
    closeCardMenu();
    // 這一下點擊的目的只是收起選單，不該讓同一次點擊繼續被底下的卡片/空白處
    // 當成一次全新的手勢處理（否則點卡片收起選單的同時，又會被判定成單擊
    // 而跳進編輯頁；點空白處也可能誤觸長按新建）。在 capture 階段就攔下來，
    // 之後不會再傳到任何卡片或空白處自己的 pointerdown 監聽器。
    e.stopPropagation();
    e.preventDefault();
  }, true);

  /* ---------------- 緊鄰短行程合併後的「N 項行程」清單彈窗 ----------------
     浮動標籤解決了「文字被截斷/縮到看不清」，但好幾個很短的行程緊挨在
     一起時，各自的浮動標籤還是會疊在一起沒辦法辨識（不管是不是同一個
     人的行程都可能發生）。與其硬擠，乾脆把這一群合併成一個「N 項行程」
     提示，點下去才展開完整清單，點清單裡的項目就直接跳去那個行程的
     編輯頁（跟平常點行程卡片一樣）。 */
  let clusterMenuEl = null;

  function closeClusterMenu(){
    if(clusterMenuEl){ clusterMenuEl.remove(); clusterMenuEl = null; }
  }

  function openClusterMenu(anchorEl, items){
    closeClusterMenu();
    closeCardMenu();
    const rect = anchorEl.getBoundingClientRect();

    const menu = document.createElement('div');
    menu.className = 'cluster-menu';
    menu.innerHTML = '<div class="cluster-menu-title">'+items.length+' 項行程</div>';
    items.forEach(item => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.innerHTML = '<span class="cluster-title"></span><span class="cluster-time"></span>';
      const colorInfo = eventColorById(item.color);
      const light = isLightColor(colorInfo.hex);
      btn.style.setProperty('--item-bg', colorInfo.hex);
      btn.style.setProperty('--item-text', light ? 'rgba(30,26,22,0.92)' : '#FFFFFF');
      btn.style.setProperty('--item-text-soft', light ? 'rgba(30,26,22,0.68)' : 'rgba(255,255,255,0.78)');
      btn.querySelector('.cluster-title').textContent = item.title;
      btn.querySelector('.cluster-time').textContent = item.timeStr;

      if(selectMode){
        // 選取狀態下，清單項目改成勾選／取消勾選要刪除的行程，不會點進
        // 編輯頁；沒有權限的（別人建立的共同行程）直接鎖住、無法點擊。
        const key = item.masterId+'@'+item.instanceDate;
        btn.classList.add('select-mode');
        if(!canSelectInstance(item)){
          btn.classList.add('locked');
          btn.disabled = true;
        } else {
          if(selectedEventKeys.has(key)) btn.classList.add('selected');
          btn.addEventListener('click', function(ev){
            ev.stopPropagation();
            if(selectedEventKeys.has(key)) selectedEventKeys.delete(key);
            else selectedEventKeys.add(key);
            btn.classList.toggle('selected', selectedEventKeys.has(key));
            updateMoveButtonVisibility();
            // 只同步時間軸上那個小色塊本身的灰底狀態，不整個重繪畫面，
            // 這樣清單才不會因為 renderEvents() 把自己也重置掉。
            document.querySelectorAll(
              '.event-card[data-master-id="'+CSS.escape(item.masterId)+'"][data-date="'+CSS.escape(item.instanceDate)+'"]'
            ).forEach(c => c.classList.toggle('select-picked', selectedEventKeys.has(key)));
          });
        }
      } else {
        btn.addEventListener('click', function(ev){
          ev.stopPropagation();
          closeClusterMenu();
          openEdit(item.masterId, item.instanceDate);
        });
      }

      menu.appendChild(btn);
    });
    document.body.appendChild(menu);

    const menuRect = menu.getBoundingClientRect();
    let left = rect.left + rect.width/2 - menuRect.width/2;
    left = Math.max(8, Math.min(left, window.innerWidth - menuRect.width - 8));
    let top = rect.top - menuRect.height - 10;
    if(top < 8) top = rect.bottom + 10; // 標籤太靠畫面上緣就改顯示在下方
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';

    clusterMenuEl = menu;
  }

  document.addEventListener('pointerdown', function(e){
    if(!clusterMenuEl) return;
    if(clusterMenuEl.contains(e.target)) return;
    closeClusterMenu();
    e.stopPropagation();
    e.preventDefault();
  }, true);

  /* ---------------- 時間軸主頁 ---------------- */
  const timelineGrid = document.getElementById('timelineGrid');
  const eventsLayer = document.getElementById('eventsLayer');
  const colDividers = document.getElementById('colDividers');
  const columnHeaderRow = document.getElementById('columnHeaderRow');
  const weekdayLabel = document.getElementById('weekdayLabel');
  const dateLabel = document.getElementById('dateLabel');

  // ---- 垂直縮放：每小時的高度（px） ----
  // 預設 50px／小時，雙指 pinch／雙擊可以即時放大縮小；每次重新整理網頁
  // 都會回到預設值，不會記住上次縮放到哪裡。放大到最大值時，就算是最短
  // （5 分鐘）的行程也有足夠高度可以完整顯示一行文字，不需要再靠浮動標籤。
  const HOUR_PX_DEFAULT = 50;
  const HOUR_PX_MIN = 24;
  const HOUR_PX_MAX = 300;
  let hourPx = HOUR_PX_DEFAULT;
  // 時間軸上下各保留的緩衝空間（px），讓 00:00 / 24:00 附近也能捲離畫面邊緣方便觸控。
  // 這個緩衝區是「day-slider 自己的額外高度」，不是用 timeline-scroll 的 padding 做
  // （padding-bottom 在部分瀏覽器的捲動容器裡不會確實計入可捲動範圍，是已知的跨瀏覽器
  // 相容性陷阱），必須跟 CSS 裡 .day-slider 的 220px（=2*110）常數維持一致，改這裡記得
  // CSS 那邊也要一起改。
  const TIMELINE_BUFFER_PX = 110;
  let pinchActive = false; // 雙指縮放進行中時，讓其他單指手勢（拖曳/調整時長/長按新增）全部按兵不動
  const datePicker = document.getElementById('datePicker');
  const dateDisplayBtn = document.getElementById('dateDisplayBtn');
  const dateContentCurrent = document.getElementById('dateContentCurrent');

  /* ---------------- 選取模式（批次刪除行程／使用者欄位） ----------------
     權限規則：
     - 使用者欄位：僅剩一位使用者時不可刪除；除此之外任何欄位都可以選取
       ／刪除，包含別人的（見下方 canSelectColumn 的說明）。
     - 行程：自己創建的行程（無論是否為共同行程）都可以選取／刪除；
       不是自己創建、但只單獨掛在自己欄位上的行程，也視為「自己欄位上的
       行程」可以選取／刪除；不是自己創建、且是跟別人共同參與的行程，
       則不能選取／刪除（只有創建者本人可以）。 */
  let selectMode = false;
  // 剛剛才被建立出來、下一次 renderEvents() 要幫它加上「捲軸攤開」進場動畫
  // 的行程 id；用完（套用到那張卡片後）立刻清成 null，避免之後任何一次
  // 重繪（拖曳、縮放、切換日期…）誤觸發同一張卡片再跑一次動畫。
  let justCreatedEventId = null;
  let selectedEventKeys = new Set();   // 'masterId@instanceDate'
  let selectedColumnIds = new Set();

  // 暫時開放：後端（Supabase）還沒接上真正的多人身份與 owner_id 機制之前，
  // 這台裝置的操作者可以刪除任何人的欄位，不限自己的。等後端做好之後，
  // 這裡要改回只放行 col.id === CURRENT_USER_ID（真正的 owner-only）。
  function canSelectColumn(col){
    if(columns.length <= 1) return false; // 僅剩一位使用者，不可刪除
    return true;
  }

  function canSelectInstance(inst){
    const creatorId = inst.creatorId || CURRENT_USER_ID;
    if(creatorId === CURRENT_USER_ID) return true; // 自己創建的，一定可以
    // 不是自己創建：只有「單獨掛在自己欄位上」的行程才可以選取
    return !!(inst.participants && inst.participants.length === 1 && inst.participants[0] === CURRENT_USER_ID);
  }

  const phoneEl = document.getElementById('phone');
  const selectToggleBtn = document.getElementById('btnSelectToggle');
  const selectToggleIcon = document.getElementById('selectToggleIcon');
  const deleteSelectedBtn = document.getElementById('btnDeleteSelected');
  const moveSelectedBtn = document.getElementById('btnMoveSelected');
  const moveTargetDatePicker = document.getElementById('moveTargetDatePicker');
  const btnUndo = document.getElementById('btnUndo');
  const btnRedo = document.getElementById('btnRedo');
  btnUndo.addEventListener('click', undo);
  btnRedo.addEventListener('click', redo);

  // 「移動」鍵只在選取模式中、且至少勾選一個行程時才顯示；使用者欄位的
  // 勾選（selectedColumnIds）不會讓它出現，移動功能目前只針對行程本身。
  function updateMoveButtonVisibility(){
    moveSelectedBtn.hidden = !(selectMode && selectedEventKeys.size > 0);
  }

  function setSelectMode(on){
    selectMode = on;
    selectedEventKeys.clear();
    selectedColumnIds.clear();
    selectToggleBtn.classList.toggle('active', on);
    selectToggleBtn.setAttribute('aria-label', on ? '取消選取' : '選取');
    selectToggleIcon.textContent = on ? '×' : '選取';
    deleteSelectedBtn.hidden = !on;
    updateMoveButtonVisibility();
    phoneEl.classList.toggle('select-mode-active', on);
    renderColumnHeader();
    renderEvents();
  }

  selectToggleBtn.addEventListener('click', function(){
    setSelectMode(!selectMode);
  });

  deleteSelectedBtn.addEventListener('click', function(){
    if(selectedEventKeys.size === 0 && selectedColumnIds.size === 0) return;
    showConfirmDialog('確定刪除？', function(){
      // 1) 刪除被選取的行程：只刪除「目前這一天」看到的這一場，
      //    重複行程的其他日期不受影響（跟單一編輯頁「不同步」刪除的規則一致）。
      selectedEventKeys.forEach(key => {
        const at = key.lastIndexOf('@');
        const masterId = key.slice(0, at);
        const instanceDate = key.slice(at+1);
        const master = events.find(e => e.id === masterId);
        if(!master) return;
        if(!master.recurrence){
          events = events.filter(e => e !== master);
        } else {
          master.excluded = master.excluded || [];
          if(master.excluded.indexOf(instanceDate) === -1) master.excluded.push(instanceDate);
          if(master.overrides) delete master.overrides[instanceDate];
        }
      });

      // 2) 刪除被選取的使用者欄位：從所有行程的參與者名單中移除該欄位，
      //    行程若因此變成沒有任何參與者，代表整段都只掛在被刪除的人身上，一併刪除。
      if(selectedColumnIds.size){
        deleteColumnsById(selectedColumnIds);
      }

      setSelectMode(false); // 刪除完成後自動關閉選取狀態
    }, {danger:true});
  });

  // 實際刪除欄位的共用邏輯，抽出來讓「選取模式批次刪除」跟「長按姓名單獨
  // 刪除」共用同一套規則，不要各自維護一份容易兜不起來。colIds 是一個
  // Set，裡面放要刪除的欄位 id（可以只有一個）。
  function deleteColumnsById(colIds){
    columns = columns.filter(c => !colIds.has(c.id));
    events = events.filter(ev => {
      ev.participants = (ev.participants||[]).filter(pid => !colIds.has(pid));
      if(ev.overrides){
        Object.keys(ev.overrides).forEach(d => {
          const ov = ev.overrides[d];
          if(ov.participants) ov.participants = ov.participants.filter(pid => !colIds.has(pid));
        });
      }
      return ev.participants.length > 0;
    });
    renderColumnHeader();
    renderColumnDividers();
    renderEvents();
  }

  // 按下「移動」鍵會打開共用的自訂日期選擇器；選完日期後才觸發
  // moveTargetDatePicker 的 change 事件，把每個被勾選的行程搬到新日期，
  // 時間、參與者都維持原樣不變。重複行程沿用 applyQuickPlacement 既有
  // 規則──會從系列中拆成一筆獨立的單次行程搬走，其餘日期不受影響
  // （跟拖曳搬移單一行程的行為一致）。
  moveSelectedBtn.addEventListener('click', function(){
    if(selectedEventKeys.size === 0) return;
    openDatePicker(currentDate, function(dateStr){
      moveTargetDatePicker.value = dateStr;
      moveTargetDatePicker.dispatchEvent(new Event('change'));
    });
  });
  moveTargetDatePicker.addEventListener('change', function(){
    const targetDate = moveTargetDatePicker.value;
    moveTargetDatePicker.value = ''; // 用完立刻清空，下次點開才不會殘留上次選的日期
    if(!targetDate || selectedEventKeys.size === 0) return;

    selectedEventKeys.forEach(key => {
      const at = key.lastIndexOf('@');
      const masterId = key.slice(0, at);
      const instanceDate = key.slice(at+1);
      const inst = getInstancesForDate(instanceDate).find(i => i.masterId === masterId);
      if(!inst) return;
      applyQuickPlacement(masterId, instanceDate, targetDate, inst.start, inst.end, inst.participants);
    });

    currentDate = targetDate; // 直接跳到目標日期，讓使用者馬上看到搬過去的結果
    setSelectMode(false); // 跟刪除一致：動作完成後自動離開選取狀態
    renderTimeline(); // 補齊 setSelectMode 沒處理到的日期標籤/星期/今天樣式
  });

  function renameColumn(col){
    showPromptDialog('修改編輯者姓名：', col.name, function(value){
      const newName = (value || '').trim();
      if(!newName || newName === col.name) return;
      col.name = newName;
      scheduleSaveToStorage();
      renderColumnHeader();
      renderEvents(); // 行程卡片上顯示的參與者名字（"· 小明、小華"）也要跟著更新
    });
  }

  function renderColumnHeader(){
    captureUndoCheckpoint();
    columnHeaderRow.innerHTML = '';
    columns.forEach((col, idx) => {
      const cell = document.createElement('div');
      cell.className = 'col-head';
      cell.innerHTML = '<span class="col-name"></span>';
      cell.querySelector('.col-name').textContent = col.name;

      if(selectMode){
        const pickable = canSelectColumn(col);
        if(pickable){
          cell.classList.add('select-pickable');
          if(selectedColumnIds.has(col.id)) cell.classList.add('select-picked');
          cell.addEventListener('click', function(){
            if(selectedColumnIds.has(col.id)) selectedColumnIds.delete(col.id);
            else selectedColumnIds.add(col.id);
            renderColumnHeader();
            renderColumnDividers();
          });
        } else {
          cell.classList.add('select-locked');
        }
      } else {
        // 非選取狀態下，點擊欄位上方的姓名可以直接重新命名這位編輯者
        // （包含一開始就有的「我」，以及後來透過「新增共編者」加入的人）。
        // 長按同一個姓名則是快速刪除的捷徑，等同選取模式裡勾選這個欄位
        // 再按刪除，省得為了刪一個人特地切進選取模式。
        const nameEl = cell.querySelector('.col-name');
        nameEl.classList.add('col-name-editable');

        let longPressTimer = null;
        let longPressFired = false;
        let pressStart = null;

        nameEl.addEventListener('pointerdown', function(e){
          longPressFired = false;
          pressStart = {x:e.clientX, y:e.clientY};
          clearTimeout(longPressTimer);
          longPressTimer = setTimeout(function(){
            longPressFired = true;
            if(!canSelectColumn(col)) return; // 僅剩一位使用者時不給刪
            showConfirmDialog('確定刪除「'+col.name+'」這位編輯者？', function(){
              deleteColumnsById(new Set([col.id]));
            }, {danger:true});
          }, 500);
        });
        nameEl.addEventListener('pointermove', function(e){
          if(!pressStart) return;
          const dx = e.clientX - pressStart.x, dy = e.clientY - pressStart.y;
          if(Math.hypot(dx, dy) > 10) clearTimeout(longPressTimer); // 手指滑動視為取消長按
        });
        nameEl.addEventListener('pointerup', function(){ clearTimeout(longPressTimer); });
        nameEl.addEventListener('pointercancel', function(){ clearTimeout(longPressTimer); });
        nameEl.addEventListener('click', function(e){
          e.stopPropagation();
          if(longPressFired){ longPressFired = false; return; } // 長按已經處理過，放開手指帶出的這次 click 不要再跳去改名
          renameColumn(col);
        });
      }

      columnHeaderRow.appendChild(cell);
    });
  }

  function renderColumnDividers(){
    colDividers.innerHTML = '';
    const n = Math.max(1, columns.length);
    if(selectMode && selectedColumnIds.size){
      columns.forEach((col, idx) => {
        if(!selectedColumnIds.has(col.id)) return;
        const band = document.createElement('div');
        band.className = 'col-select-band';
        band.style.left = (idx/n*100)+'%';
        band.style.width = (1/n*100)+'%';
        colDividers.appendChild(band);
      });
    }
    for(let i=1; i<columns.length; i++){
      const line = document.createElement('div');
      line.className = 'col-div-line';
      line.style.left = (i/columns.length*100)+'%';
      colDividers.appendChild(line);
    }
  }

  function buildHourRows(){
    // 先移除舊的 hour-row（保留 margin-rule 與 events-layer）
    timelineGrid.querySelectorAll('.hour-row').forEach(el=>el.remove());
    for(let h=0; h<24; h++){
      const row = document.createElement('div');
      row.className = 'hour-row';
      row.style.top = (h*hourPx)+'px';
      row.innerHTML = '<span class="hlabel">'+pad2(h)+':00</span><span class="half-tick"></span>'+
        '<span class="quarter-tick" style="top:'+(hourPx*0.25)+'px"></span><span class="quarter-tick" style="top:'+(hourPx*0.75)+'px"></span>';
      timelineGrid.insertBefore(row, eventsLayer);
    }
  }

  // 縮放後重新整理畫面：格線、行程卡、現在時間線全部要依照新的 hourPx
  // 重新計算位置。anchorClientY 是這次縮放要固定不動的螢幕座標（pinch
  // 兩指的中點，或雙擊的那一點）；縮放前後都要讓同一個時間點對齊在這個
  // 螢幕座標上，畫面才會有「以手指為中心放大/縮小」的自然手感，而不是
  // 整個畫面跳來跳去。沒有指定 anchorClientY 時（例如未來若有其他呼叫
  // 情境）就固定用可視範圍正中間當作縮放中心。
  function setHourPx(newHourPx, anchorClientY){
    newHourPx = Math.max(HOUR_PX_MIN, Math.min(HOUR_PX_MAX, newHourPx));
    if(Math.abs(newHourPx - hourPx) < 0.5) return;

    const scrollRect = timelineScroll.getBoundingClientRect();
    const refClientY = anchorClientY != null ? anchorClientY : (scrollRect.top + timelineScroll.clientHeight/2);
    // 用「舊」hourPx 換算出縮放中心目前對應到的絕對分鐘數（scrollTop=0 對應到緩衝區
    // 開頭，不是 00:00，所以要先扣掉緩衝區高度才是真正的時間軸座標）
    const anchorMin = (timelineScroll.scrollTop + (refClientY - scrollRect.top) - TIMELINE_BUFFER_PX) / hourPx * 60;

    hourPx = newHourPx;
    document.documentElement.style.setProperty('--hour-px', hourPx);
    daySlider.style.height = (hourPx*24 + TIMELINE_BUFFER_PX*2)+'px';
    timelineGrid.style.height = (hourPx*24)+'px';
    buildHourRows();
    renderEvents();
    renderNowLine();

    // 縮放後，把同一個時間點（anchorMin）重新對齊回 refClientY 這個螢幕座標，
    // 換算回捲動座標時要把緩衝區高度加回來
    const newTop = TIMELINE_BUFFER_PX + anchorMin/60*hourPx;
    const targetScrollTop = newTop - (refClientY - scrollRect.top);
    const maxScroll = Math.max(0, timelineScroll.scrollHeight - timelineScroll.clientHeight);
    timelineScroll.scrollTop = Math.max(0, Math.min(maxScroll, targetScrollTop));
  }

  function renderDateHeader(){
    const [y,m,d] = currentDate.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    weekdayLabel.textContent = (y)+'年';
    dateLabel.textContent = m+'月'+d+'日 · '+WEEKDAYS[dt.getDay()];
    dateDisplayBtn.classList.toggle('is-today', currentDate === todayStr());
    if(datePicker.value !== currentDate) datePicker.value = currentDate;
  }

  function renderNowLine(){
    const old = timelineGrid.querySelector('.now-line');
    if(old) old.remove();
    if(currentDate !== todayStr()) return;
    const now = new Date();
    const min = now.getHours()*60 + now.getMinutes();
    const line = document.createElement('div');
    line.className = 'now-line';
    line.style.top = (min/60*hourPx)+'px';
    timelineGrid.insertBefore(line, eventsLayer);
  }

  function renderEvents(){
    captureUndoCheckpoint();
    scheduleSaveToStorage(); // 每次重繪代表資料可能剛異動過，順便存起來（debounce，避免同步阻塞）
    updateMoveButtonVisibility(); // 勾選狀態常常伴隨重繪一起變動，這裡統一同步一次
    closeCardMenu(); // 畫面要重繪了，任何還開著的快捷選單先收起來，避免指到舊卡片
    closeClusterMenu();
    eventsLayer.innerHTML = '';
    renderColumnDividers();
    const insts = getInstancesForDate(currentDate).filter(inst =>
      !(floatingDrag && floatingDrag.masterId === inst.masterId && floatingDrag.homeDate === inst.instanceDate)
    );
    if(insts.length === 0){
      const hint = document.createElement('div');
      hint.className = 'hint-empty';
      hint.textContent = '本日尚未安排行程';
      eventsLayer.appendChild(hint);
      return;
    }

    const n = Math.max(1, columns.length);
    // 裝不下、需要浮動標籤的候選項先集中收集起來，等這一天的卡片都建完，
    // 才能正確判斷哪些會疊在一起、需要合併成「N 項行程」（見 renderFloatLabels）。
    const floatCandidates = [];

    insts.forEach(inst => {
      const startMin = timeToMinutes(inst.start);
      const endMin = timeToMinutes(inst.end);
      const top = startMin/60*hourPx;
      const height = Math.max(8, (endMin-startMin)/60*hourPx);
      const durationMin = endMin - startMin;
      const runs = eventColRuns(inst);
      const recurMark = inst.isRecurring ? '<span class="ecard-recur-inline">↻</span>' : '';
      const title = escapeHtml(inst.title || '(未命名行程)');
      const timeStr = inst.start+' - '+inst.end;
      const notesHtml = inst.notes ? escapeHtml(inst.notes) : '';
      // 這一場是不是剛剛才被建立出來、這次渲染要幫它跑「捲軸攤開」進場動畫。
      const isJustCreated = !!(justCreatedEventId && inst.masterId === justCreatedEventId);

      runs.forEach(([runMin, runMax]) => {
        const leftPct = (runMin/n*100);
        const widthPct = ((runMax-runMin+1)/n*100);

        const card = document.createElement('div');
        card.className = 'event-card';
        applyEventColor(card, inst.color);
        card.style.top = top+'px';
        card.style.height = height+'px';
        card.style.left = 'calc(' + leftPct + '% + 3px)';
        card.style.width = 'calc(' + widthPct + '% - 6px)';
        card.dataset.masterId = inst.masterId;
        card.dataset.date = inst.instanceDate;

        if(selectMode){
          card.classList.add('select-mode');
          if(canSelectInstance(inst)){
            const key = inst.masterId+'@'+inst.instanceDate;
            if(selectedEventKeys.has(key)) card.classList.add('select-picked');
          } else {
            card.classList.add('select-locked');
          }
        }

        if(durationMin < 45){
          // 放得下一行，但兩行會被壓縮：標題與時間並排在同一行
          card.classList.add('compact');
          card.innerHTML =
            '<div class="ecard-row">'+
              '<span class="ecard-title">'+recurMark+title+'</span>'+
              '<span class="ecard-time">'+timeStr+'</span>'+
            '</div>';
        } else {
          // 行程格子本身不顯示參與者名單：橫跨的欄位範圍已經很清楚表達
          // 「誰參與了」，格子裡再重複列一次名字反而佔位置又多餘。
          // 時間下方如果有備註就順便顯示，格子太小裝不下時最優先被拿掉。
          card.innerHTML =
            (inst.isRecurring ? '<span class="ecard-recur-tag">↻</span>' : '') +
            '<div class="ecard-title">'+title+'</div>'+
            '<div class="ecard-time">'+timeStr+'</div>' +
            (notesHtml ? '<div class="ecard-notes">'+notesHtml+'</div>' : '');
        }

        eventsLayer.appendChild(card); // 先掛進 DOM 才能量出實際渲染尺寸

        // 量測剛剛這個排版是否真的裝得下（不管是被高度夾住，還是文字
        // 太長被截斷）。裝不下的話，依序退讓：先拿掉備註，還是不行就
        // 拿掉時間只留標題，標題單獨顯示還是放不下的話才開始縮小字體，
        // 直到剛好塞進格子。
        function overflowCheck(){
          const t = card.querySelector('.ecard-title');
          return (card.scrollHeight - card.clientHeight > 1) ||
                 (t && t.scrollWidth - t.clientWidth > 1);
        }

        if(overflowCheck()){
          const notesEl = card.querySelector('.ecard-notes');
          if(notesEl) notesEl.remove();
        }

        if(overflowCheck()){
          const fitted = fitTitleOnly(card, recurMark, title);
          if(!fitted){
            // 縮到最小字體還是放不下：極端情況下才交給「N 項行程」機制，
            // 跟鄰近同樣放不下的行程合併成一個提示。
            card.classList.remove('compact');
            card.classList.add('label-floated');
            card.innerHTML = '';
            floatCandidates.push({
              card, top, height, runMin, runMax,
              recurMark, title, timeStr,
              rawTitle: inst.title || '(未命名行程)',
              isRecurring: !!inst.isRecurring,
              creatorId: inst.creatorId, participants: inst.participants,
              color: inst.color,
              masterId: inst.masterId, instanceDate: inst.instanceDate
            });
          }
        }

        attachCardInteractions(card, inst, runMin, runMax);
        ['tl','tr','bl','br'].forEach(corner => {
          const handle = document.createElement('span');
          handle.className = 'resize-handle rh-' + corner;
          handle.setAttribute('aria-hidden', 'true');
          card.appendChild(handle);
          attachResizeHandle(card, inst, handle, runMin, runMax, {title:title, recurMark:recurMark}, corner);
        });

        if(isJustCreated){
          // 先套用「收起」狀態，等瀏覽器先畫過這一幀之後（雙層 rAF）再切到
          // 「展開」狀態，兩個 class 才不會在同一幀被瀏覽器合併成瞬間跳過去、
          // 完全看不到過渡動畫。
          card.classList.add('card-unfurl');
          requestAnimationFrame(function(){
            requestAnimationFrame(function(){
              card.classList.add('card-unfurl-open');
            });
          });
          card.addEventListener('transitionend', function onUnfurlDone(ev){
            if(ev.propertyName !== 'clip-path') return;
            card.classList.remove('card-unfurl', 'card-unfurl-open');
            card.removeEventListener('transitionend', onUnfurlDone);
          });
        }
      });

      if(isJustCreated) justCreatedEventId = null; // 動畫已經套用上去了，清掉旗標避免之後的重繪重跑一次
    });

    renderFloatLabels(floatCandidates);
    resolveFloatLabelOverlaps();
  }

  // 浮動標籤本身是貼在自己那格外面的色塊，寬度可能超出自己那一欄，
  // 疊到旁邊其他正常顯示完整文字的行程格子上，把底下的字擋住。這裡
  // 排版完成後統一檢查一次：先試著翻到另一側（上緣／下緣對調）看能不能
  // 整個閃開；翻了還是會疊到，就限制寬度、讓被擋住的部分改用刪節號，
  // 而不是硬蓋在別人的文字上面。
  function resolveFloatLabelOverlaps(){
    const solidRects = Array.from(eventsLayer.querySelectorAll('.event-card:not(.label-floated)'))
      .map(c => c.getBoundingClientRect());
    if(!solidRects.length) return;

    function findOverlap(label){
      const r = label.getBoundingClientRect();
      for(const sr of solidRects){
        if(r.left < sr.right && r.right > sr.left && r.top < sr.bottom && r.bottom > sr.top) return sr;
      }
      return null;
    }

    eventsLayer.querySelectorAll('.ecard-solo').forEach(label => {
      label.style.maxWidth = '';
      let hit = findOverlap(label);
      if(!hit) return;

      const card = label.closest('.event-card');
      if(card){
        card.classList.toggle('float-above');
        card.classList.toggle('float-below');
        if(!findOverlap(label)) return; // 翻面就閃開了
        card.classList.toggle('float-above'); // 翻面沒用，切回原本那一側
        card.classList.toggle('float-below');
      }

      hit = findOverlap(label);
      if(hit){
        const r = label.getBoundingClientRect();
        const available = Math.max(28, hit.left - r.left - 4);
        label.style.maxWidth = available + 'px';
      }
    });
  }

  // 幫「裝不下、需要浮動標籤」的候選項分群：只要欄位範圍相鄰或重疊、
  // 而且垂直距離近到標籤會疊在一起，不管是不是同一個人的行程都合併成
  // 一個「N 項行程」提示，點下去才展開清單；沒有跟其他項目擠在一起的，
  // 照原本方式各自顯示完整的浮動標籤。
  //
  // 用 union-find 做群組合併，而不是單純依 top 排序後往下掃：因為同一
  // 時段常常會同時有好幾個人的欄位緊鄰在一起，彼此的欄位範圍不會完全
  // 相同（分別是不同人的欄位），照時間排序掃過去會漏掉「欄位相鄰但
  // 中間夾著別的時間點的項目」這種情況，用 union-find 兩兩比對才不會漏。
  function renderFloatLabels(candidates){
    const CLUSTER_GAP = 28; // 約略一個標籤本身的高度，兩個色塊間的空隙小於這個值就視為標籤會疊在一起

    const n = candidates.length;
    const parent = candidates.map((_, i) => i);
    function find(i){ while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; }
    function union(i,j){ const ri=find(i), rj=find(j); if(ri!==rj) parent[ri]=rj; }

    for(let i=0; i<n; i++){
      for(let j=i+1; j<n; j++){
        const a = candidates[i], b = candidates[j];
        const colsTouch = a.runMin <= b.runMax+1 && b.runMin <= a.runMax+1; // 欄位相鄰或重疊
        if(!colsTouch) continue;
        const vGap = (a.top <= b.top) ? b.top-(a.top+a.height) : a.top-(b.top+b.height);
        if(vGap < CLUSTER_GAP) union(i,j);
      }
    }

    const groups = new Map();
    candidates.forEach((c, i) => {
      const root = find(i);
      if(!groups.has(root)) groups.set(root, []);
      groups.get(root).push(c);
    });

    groups.forEach(cluster => {
      cluster.sort((a,b) => a.top - b.top || a.runMin - b.runMin);
      flushCluster(cluster);
    });

    function flushCluster(cluster){
      if(cluster.length === 1){
        // 縮到最小字體還是放不下的極端情況：直接用最小字體顯示，
        // 放不下的部分交給 CSS 的刪節號處理，不再另外跳出提示。
        const only = cluster[0];
        only.card.classList.remove('label-floated');
        only.card.classList.add('title-only');
        only.card.innerHTML = '<div class="ecard-title">'+only.recurMark+only.title+'</div>';
        only.card.querySelector('.ecard-title').style.fontSize = '8px';
        only.card.dataset.shrunk = '1';
        return;
      }
      const anchor = cluster[0]; // 群組一律貼在最上面（同高度則最左）那一個項目的位置
      // 這幾個都要合併顯示成一個「N 項行程」，每張卡自己先前暫時顯示的
      // 內容都要清掉，改成單純的色塊（只有 anchor 上面會貼那個提示）。
      cluster.forEach(c => {
        c.card.classList.add('label-floated');
        c.card.innerHTML = '';
      });
      const label = document.createElement('span');
      label.className = 'ecard-solo ecard-cluster';
      label.textContent = cluster.length + ' 項行程';
      // 卡片本身是靠 pointerdown 判斷「點一下開編輯頁」的，click 事件
      // 發生得太晚（pointerdown 早就先冒泡上去把編輯頁打開了），所以
      // 這裡要在 pointerdown 階段就攔截並直接開清單，不能只擋 click。
      label.addEventListener('pointerdown', function(ev){
        ev.stopPropagation();
        ev.preventDefault();
        openClusterMenu(label, cluster.map(c => ({
          title: (c.isRecurring ? '↻ ' : '') + c.rawTitle,
          timeStr: c.timeStr,
          masterId: c.masterId,
          instanceDate: c.instanceDate,
          creatorId: c.creatorId,
          participants: c.participants,
          color: c.color
        })));
      });
      anchor.card.classList.add(anchor.top < 28 ? 'float-below' : 'float-above');
      anchor.card.appendChild(label);
    }
  }

  // 格子裝不下「標題＋時間＋備註」時的退讓順序：先拿掉備註，再拿掉時間、
  // 只留標題（字體大小不變）；標題單獨顯示還是放不下的話，才開始一路
  // 縮小字體，直到整段文字剛好塞進格子裡，或縮到最小可讀大小為止。
  // 回傳 true 表示最後有塞進去；false 表示縮到最小還是放不下（極端情況）。
  function fitTitleOnly(card, recurMark, title){
    card.classList.remove('compact');
    // 只剩標題這一行時，讓它在格子裡「垂直置中、水平靠左」：錨點是最
    // 左側的垂直中點，不是預設文字排版那種左上（或字體縮小後看起來
    // 像左下）的錨點。
    card.classList.add('title-only');
    card.innerHTML = '<div class="ecard-title">'+recurMark+title+'</div>';
    const titleEl = card.querySelector('.ecard-title');

    function fits(){
      return (card.scrollHeight - card.clientHeight <= 1) &&
             (titleEl.scrollWidth - titleEl.clientWidth <= 1);
    }

    if(fits()) return true;

    const MIN_FONT = 8;
    let size = 12.5;
    while(size > MIN_FONT){
      size -= 0.5;
      titleEl.style.fontSize = size + 'px';
      if(fits()){
        card.dataset.shrunk = '1'; // 字體被縮小過：長按時額外顯示完整名稱
        return true;
      }
    }
    card.dataset.shrunk = '1';
    return false;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 拖曳圓點調整時長時，即時把卡片上顯示的時間文字換成拖曳當下（吸附到
  // 5 分鐘後）的預覽值，讓使用者可以直接看數字決定在哪裡放手，
  // 不用再靠肉眼對齊格線。卡片本身不顯示參與者名字（欄位跨度已經很
  // 明確表達參與者了），這裡只更新時間文字。
  function updateCardTimeDisplay(card, meta, timeStr){
    const soloEl = card.querySelector('.ecard-solo');
    if(soloEl){
      soloEl.innerHTML = meta.recurMark + meta.title + ' · ' + timeStr;
      return;
    }
    const timeEl = card.querySelector('.ecard-time');
    if(!timeEl) return;
    timeEl.textContent = timeStr;
  }

  function renderTimeline(){
    renderDateHeader();
    renderColumnHeader();
    renderNowLine();
    renderEvents();
  }

  /* ---------------- 跨日滑動轉場（左右滑動切日 / 拖曳行程到畫面邊緣切日 共用） ----------------
     核心概念：畫面上同時放著「目前這天」跟「即將滑入的那一天（唯讀預覽，
     不能互動）」兩塊面板，手勢移動多少，兩塊面板就一起平移多少，感覺
     跟垂直捲動一樣連貫；放開後如果滑動幅度夠大就用動畫把畫面接續著滑
     完最後一小段，此時才真的切換 currentDate 並重新整理成完整可互動的
     內容；幅度不夠就用動畫彈回原位，不改變日期。 */
  const daySlider = document.getElementById('daySlider');
  let previewPanel = null;
  let previewDirection = null; // 'next' 表示手勢往左滑、預覽面板是明天；'prev' 則是昨天

  // 產生某一天的「唯讀預覽」面板：只畫時間格線、欄位分隔線、行程卡片外觀，
  // 不綁任何長按/拖曳互動，純粹給滑動轉場當中的視覺過場使用。
  function buildStaticDayPanel(dateStr){
    const panel = document.createElement('div');
    panel.className = 'timeline-grid day-preview-panel';

    for(let h=0; h<24; h++){
      const row = document.createElement('div');
      row.className = 'hour-row';
      row.style.top = (h*hourPx)+'px';
      row.innerHTML = '<span class="hlabel">'+pad2(h)+':00</span><span class="half-tick"></span>';
      panel.appendChild(row);
    }

    const n = Math.max(1, columns.length);
    const dividers = document.createElement('div');
    dividers.className = 'col-dividers';
    for(let i=1; i<n; i++){
      const line = document.createElement('div');
      line.className = 'col-div-line';
      line.style.left = (i/n*100)+'%';
      dividers.appendChild(line);
    }
    panel.appendChild(dividers);

    const layer = document.createElement('div');
    layer.className = 'events-layer';
    getInstancesForDate(dateStr).forEach(inst => {
      const startMin = timeToMinutes(inst.start);
      const endMin = timeToMinutes(inst.end);
      const top = startMin/60*hourPx;
      const height = Math.max(8, (endMin-startMin)/60*hourPx);
      const durationMin = endMin-startMin;
      const runs = eventColRuns(inst);
      const title = escapeHtml(inst.title||'(未命名行程)');
      const timeStr = inst.start+' - '+inst.end;

      runs.forEach(([runMin, runMax]) => {
        const card = document.createElement('div');
        card.className = 'event-card';
        applyEventColor(card, inst.color);
        card.style.top = top+'px';
        card.style.height = height+'px';
        card.style.left = 'calc(' + (runMin/n*100) + '% + 3px)';
        card.style.width = 'calc(' + ((runMax-runMin+1)/n*100) + '% - 6px)';
        if(durationMin < 45){
          card.classList.add('compact');
          card.innerHTML = '<div class="ecard-row"><span class="ecard-title">'+title+'</span><span class="ecard-time">'+timeStr+'</span></div>';
        } else {
          card.innerHTML = '<div class="ecard-title">'+title+'</div><div class="ecard-time">'+timeStr+'</div>';
        }
        layer.appendChild(card);
      });
    });
    panel.appendChild(layer);
    return panel;
  }

  function ensurePreviewPanel(direction){
    if(previewPanel && previewDirection === direction) return previewPanel;
    if(previewPanel){ previewPanel.remove(); previewPanel = null; }
    previewDirection = direction;
    const targetDate = dateByOffset(currentDate, direction === 'next' ? 1 : -1);
    const panel = buildStaticDayPanel(targetDate);
    panel.style.transform = 'translateX(' + (direction === 'next' ? '100%' : '-100%') + ')';
    daySlider.appendChild(panel);
    previewPanel = panel;
    return panel;
  }

  // 手勢進行中：即時跟著手指位移量(dx，往左滑為負值)平移兩塊面板
  function updateDaySlide(dx){
    const w = daySlider.clientWidth || 1;
    const direction = dx < 0 ? 'next' : 'prev';
    ensurePreviewPanel(direction);
    const clamped = Math.max(-w, Math.min(w, dx));
    timelineGrid.style.transform = 'translateX(' + clamped + 'px)';
    const base = direction === 'next' ? w : -w;
    previewPanel.style.transform = 'translateX(' + (base + clamped) + 'px)';
    updateDateScreenSlide(dx, w);
  }

  // 放開手指：滑動幅度夠大就用動畫接續滑完、真的切換日期；不夠就彈回原位
  function endDaySlide(dx){
    const w = daySlider.clientWidth || 1;
    const threshold = w * 0.28;
    const commit = Math.abs(dx) > threshold && previewPanel;
    daySlider.classList.add('animating');
    endDateScreenSlide(commit, dx < 0 ? 'next' : 'prev');

    if(commit){
      const delta = dx < 0 ? 1 : -1;
      timelineGrid.style.transform = 'translateX(' + (dx < 0 ? -w : w) + 'px)';
      previewPanel.style.transform = 'translateX(0px)';
      setTimeout(function(){
        daySlider.classList.remove('animating');
        currentDate = dateByOffset(currentDate, delta);
        if(previewPanel){ previewPanel.remove(); previewPanel = null; }
        timelineGrid.style.transform = '';
        renderTimeline();
      }, 300);
    } else {
      timelineGrid.style.transform = 'translateX(0px)';
      if(previewPanel){
        const base = previewDirection === 'next' ? w : -w;
        previewPanel.style.transform = 'translateX(' + base + 'px)';
      }
      setTimeout(function(){
        daySlider.classList.remove('animating');
        if(previewPanel){ previewPanel.remove(); previewPanel = null; }
        timelineGrid.style.transform = '';
      }, 300);
    }
  }

  /* ---------------- 頂部日期螢幕：跟著滑動手勢做「等比例」的同步捲動 ----------------
     不是像素對像素同步移動，而是進度對進度：主畫面滑動的進度（目前位移
     ÷ 整個畫面寬度）走到多少百分比，日期螢幕裡的文字也走到自己可移動
     範圍（螢幕自己的寬度）的同樣百分比，兩邊會在「進度 100%」那一刻
     同時到達終點——因為日期螢幕比主畫面窄很多，實際移動的像素會少很多、
     看起來也比較慢，但不會慢半拍或搶拍，是同時完成。 */
  let dateScreenPreviewEl = null;
  let dateScreenPreviewDir = null;

  function ensureDateScreenPreview(direction){
    if(dateScreenPreviewEl && dateScreenPreviewDir === direction) return dateScreenPreviewEl;
    if(dateScreenPreviewEl){ dateScreenPreviewEl.remove(); dateScreenPreviewEl = null; }
    dateScreenPreviewDir = direction;
    const targetDate = dateByOffset(currentDate, direction === 'next' ? 1 : -1);
    const [y,m,d] = targetDate.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const el = document.createElement('div');
    el.className = 'date-content-preview';
    el.innerHTML =
      '<span class="weekday">' + y + '年</span>' +
      '<span class="date-num">' + m + '月' + d + '日 · ' + WEEKDAYS[dt.getDay()] + '</span>';
    // 一定要先設定「螢幕外」的起始位置，之後的動畫才是從這裡滑進來，
    // 不然元素一創建就停在最終位置（translateX(0)），動畫只剩終點、
    // 沒有起點，看起來就會像是原地突然冒出來。
    const screenW = dateDisplayBtn.clientWidth || 1;
    el.style.transform = 'translateX(' + (direction === 'next' ? screenW : -screenW) + 'px)';
    dateDisplayBtn.appendChild(el);
    dateScreenPreviewEl = el;
    return el;
  }

  function updateDateScreenSlide(dx, pageWidth){
    const progress = Math.max(-1, Math.min(1, dx / pageWidth));
    const direction = dx < 0 ? 'next' : 'prev';
    const preview = ensureDateScreenPreview(direction);
    const screenW = dateDisplayBtn.clientWidth || 1;
    const travel = progress * screenW;
    dateContentCurrent.style.transform = 'translateX(' + travel + 'px)';
    const base = direction === 'next' ? screenW : -screenW;
    preview.style.transform = 'translateX(' + (base + travel) + 'px)';
  }

  function endDateScreenSlide(commit, direction){
    const screenW = dateDisplayBtn.clientWidth || 1;
    dateDisplayBtn.classList.add('animating');
    if(commit){
      dateContentCurrent.style.transform = 'translateX(' + (direction === 'next' ? -screenW : screenW) + 'px)';
      if(dateScreenPreviewEl) dateScreenPreviewEl.style.transform = 'translateX(0px)';
    } else {
      dateContentCurrent.style.transform = 'translateX(0px)';
      if(dateScreenPreviewEl){
        const base = dateScreenPreviewDir === 'next' ? screenW : -screenW;
        dateScreenPreviewEl.style.transform = 'translateX(' + base + 'px)';
      }
    }
    setTimeout(function(){
      dateDisplayBtn.classList.remove('animating');
      if(dateScreenPreviewEl){ dateScreenPreviewEl.remove(); dateScreenPreviewEl = null; dateScreenPreviewDir = null; }
      dateContentCurrent.style.transform = '';
    }, 300);
  }

  // 立即觸發完成一次日期切換的滑動動畫（給「拖曳行程到畫面邊緣」用，
  // 不是使用者手動滑出來的位移，是碰到邊緣就自動觸發一次完整轉場）。
  function animateCommitDaySlide(direction, onDone){
    const w = daySlider.clientWidth || 1;
    ensurePreviewPanel(direction);
    const dateScreenPreview = ensureDateScreenPreview(direction);
    const screenW = dateDisplayBtn.clientWidth || 1;
    daySlider.classList.add('animating');
    dateDisplayBtn.classList.add('animating');
    requestAnimationFrame(function(){
      timelineGrid.style.transform = 'translateX(' + (direction === 'next' ? -w : w) + 'px)';
      previewPanel.style.transform = 'translateX(0px)';
      dateContentCurrent.style.transform = 'translateX(' + (direction === 'next' ? -screenW : screenW) + 'px)';
      dateScreenPreview.style.transform = 'translateX(0px)';
    });
    setTimeout(function(){
      daySlider.classList.remove('animating');
      dateDisplayBtn.classList.remove('animating');
      currentDate = dateByOffset(currentDate, direction === 'next' ? 1 : -1);
      if(previewPanel){ previewPanel.remove(); previewPanel = null; }
      if(dateScreenPreviewEl){ dateScreenPreviewEl.remove(); dateScreenPreviewEl = null; dateScreenPreviewDir = null; }
      timelineGrid.style.transform = '';
      dateContentCurrent.style.transform = '';
      renderTimeline();
      if(onDone) onDone();
    }, 300);
  }

  /* ---------------- 浮動拖曳（可連續跨欄、跨日移動） ----------------
     長按行程卡片後，卡片會變成一個跟著手指座標走的浮動分身（ghost），
     不再受欄位百分比定位的限制；拖到畫面邊緣停留著不放，會連續不斷地
     翻到下一天/上一天，直到手指離開邊緣或放開為止；放開的當下，才依
     ghost 最後停留的位置換算出最終的時間／欄位／日期並真正寫入資料。 */
  let floatingDrag = null; // {masterId, homeDate, ghost, w, h, span, durationMin, lastEdgeDir}
  let edgeFlipTimer = null;

  function positionGhost(clientX, clientY){
    if(!floatingDrag) return;
    floatingDrag.ghost.style.left = (clientX - floatingDrag.grabOffsetX) + 'px';
    floatingDrag.ghost.style.top = (clientY - floatingDrag.grabOffsetY) + 'px';
  }

  function flipDayInstant(direction){
    animateCommitDaySlide(direction, function(){});
  }

  function armEdgeFlip(direction){
    if(edgeFlipTimer) return;
    edgeFlipTimer = setTimeout(function(){
      edgeFlipTimer = null;
      flipDayInstant(direction);
      // 手指還停在邊緣的話，繼續連續翻下一天，不用放開再重來
      if(floatingDrag && floatingDrag.lastEdgeDir === direction){
        armEdgeFlip(direction);
      }
    }, 500);
  }
  function disarmEdgeFlip(){
    if(edgeFlipTimer){ clearTimeout(edgeFlipTimer); edgeFlipTimer = null; }
  }

  // 拖曳行程碰到時間軸可視範圍的上/下邊界時，連續捲動時間軸（跟左右
  // 碰邊界連續換日是同一種手感，只是這裡捲的是同一天內的時段，不換日）。
  let vAutoScrollRAF = null;
  let vAutoScrollDir = null; // 'up' | 'down' | null
  const V_AUTO_SCROLL_EDGE_PX = 40; // 手指距離可視範圍上/下邊多近算「碰到邊界」
  const V_AUTO_SCROLL_SPEED = 7; // 每個 rAF frame 捲動幾 px

  function armVerticalAutoScroll(dir){
    vAutoScrollDir = dir;
    if(vAutoScrollRAF) return; // 迴圈已經在跑了，換方向只要改上面那個變數就好
    const step = function(){
      if(!floatingDrag || !vAutoScrollDir){ vAutoScrollRAF = null; return; }
      const before = timelineScroll.scrollTop;
      timelineScroll.scrollTop += (vAutoScrollDir === 'down' ? V_AUTO_SCROLL_SPEED : -V_AUTO_SCROLL_SPEED);
      if(timelineScroll.scrollTop === before){
        // 已經捲到頂或捲到底了，沒有更多內容，停下來
        vAutoScrollRAF = null;
        return;
      }
      // 手指沒有動，但底下內容被捲動了，浮動卡片上顯示的時間預覽要跟著更新，
      // 不然使用者會看到卡片位置沒變、時間卻是舊的。
      if(floatingDrag.lastClientY != null) updateGhostTimePreview(floatingDrag.lastClientY);
      vAutoScrollRAF = requestAnimationFrame(step);
    };
    vAutoScrollRAF = requestAnimationFrame(step);
  }
  function disarmVerticalAutoScroll(){
    vAutoScrollDir = null;
    if(vAutoScrollRAF){ cancelAnimationFrame(vAutoScrollRAF); vAutoScrollRAF = null; }
  }

  function startFloatingDrag(inst, runMin, runMax, sourceCard, grabX, grabY, curX, curY){
    const rect = sourceCard.getBoundingClientRect();
    const ghost = sourceCard.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.classList.remove('dragging', 'resizing');
    ghost.classList.add('card-ghost');
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    document.body.appendChild(ghost);

    floatingDrag = {
      masterId: inst.masterId,
      homeDate: inst.instanceDate,
      ghost: ghost,
      w: rect.width,
      h: rect.height,
      // 記住抓取當下的原始畫面位置，如果放開時發現會跟別的行程重疊，
      // 需要把 ghost 動畫移回這裡（而不是瞬間跳回）。
      originLeft: rect.left,
      originTop: rect.top,
      // 手指「一開始抓住」卡片時，指尖相對卡片左上角的位置——讓 ghost 全程
      // 保持手指原本抓的那個點，不要因為置中對齊而跳動；放開時也要用同一
      // 套偏移量換算回卡片左上角，才會跟畫面上看到的落點位置一致。用最初
      // 抓取的座標(grabX/grabY)算偏移量，而不是轉成拖曳當下的座標，是為了
      // 避免「長按跳出選單→移動一段距離才轉成拖曳」時 ghost 瞬間跳位。
      grabOffsetX: grabX - rect.left,
      grabOffsetY: grabY - rect.top,
      span: runMax - runMin,
      durationMin: timeToMinutes(inst.end) - timeToMinutes(inst.start),
      // 記錄下標題／重複標記，拖曳過程中即時換算時間文字時要用同一套
      // 格式重建卡片內容（跟 attachResizeHandle 共用同一個
      // updateCardTimeDisplay 輔助函式）。
      meta: {
        title: escapeHtml(inst.title || '(未命名行程)'),
        recurMark: inst.isRecurring ? '<span class="ecard-recur-inline">↻</span>' : ''
      },
      lastEdgeDir: null,
      lastClientX: curX,
      lastClientY: curY
    };
    positionGhost(curX, curY);
    renderEvents(); // 立刻重繪一次：本尊卡片先隱藏，畫面上只剩浮動的 ghost
  }

  // 把「拖曳目前放開的話會變成幾點」換算成文字、寫回浮動卡片，抽成獨立
  // 函式是因為兩種情況都要更新同一段預覽文字：手指真的在移動時（來自
  // pointermove），跟手指停在邊界沒動、但畫面因為自動捲動而底下內容
  // 位移時（來自 armVerticalAutoScroll 的 rAF 迴圈）。
  function updateGhostTimePreview(clientY){
    if(!floatingDrag) return;
    const ghostTop = clientY - floatingDrag.grabOffsetY;
    const gridRect = timelineGrid.getBoundingClientRect();
    const rawMin = Math.round((ghostTop - gridRect.top)/hourPx*60);
    const snappedStart = Math.max(0, Math.min(23*60, Math.round(rawMin/5)*5));
    const previewStr = minutesToTime(snappedStart)+' - '+minutesToTime(snappedStart + floatingDrag.durationMin);
    updateCardTimeDisplay(floatingDrag.ghost, floatingDrag.meta, previewStr);
  }

  function updateFloatingDrag(clientX, clientY){
    if(!floatingDrag) return;
    floatingDrag.lastClientX = clientX;
    floatingDrag.lastClientY = clientY;
    positionGhost(clientX, clientY);

    // 即時預覽：用跟放開時（endFloatingDrag）完全相同的 5 分鐘吸附規則，
    // 讓浮動卡片上顯示的時間即時反映「現在放開的話會變成幾點」，
    // 使用者可以直接看數字決定要在哪裡鬆手，不用肉眼對齊格線。
    updateGhostTimePreview(clientY);

    const rect = eventsLayer.getBoundingClientRect();
    const nearLeft = clientX - rect.left < 34;
    const nearRight = rect.right - clientX < 34;
    if(nearLeft || nearRight){
      const dir = nearRight ? 'next' : 'prev';
      if(floatingDrag.lastEdgeDir !== dir){
        floatingDrag.lastEdgeDir = dir;
        disarmEdgeFlip();
        armEdgeFlip(dir);
      }
    } else if(floatingDrag.lastEdgeDir){
      floatingDrag.lastEdgeDir = null;
      disarmEdgeFlip();
    }

    // 上下邊界：碰到時間軸可視範圍的上緣/下緣就連續捲動，讓使用者可以把
    // 行程拖到目前畫面看不到的更早/更晚時段，不用先放開、手動捲動、
    // 再重新長按拖曳一次。
    const scrollRect = timelineScroll.getBoundingClientRect();
    const nearTop = clientY - scrollRect.top < V_AUTO_SCROLL_EDGE_PX;
    const nearBottom = scrollRect.bottom - clientY < V_AUTO_SCROLL_EDGE_PX;
    if(nearTop){
      armVerticalAutoScroll('up');
    } else if(nearBottom){
      armVerticalAutoScroll('down');
    } else {
      disarmVerticalAutoScroll();
    }
  }

  // 放開時發現落點會跟別的行程重疊：不提交這次移動，把 ghost 動畫移回
  // 原本抓取時的位置（看得到移動過程，但不會慢吞吞的）。如果拖曳過程中
  // 已經翻到別天，先切回原本那一天（這一步不做動畫，只是切回正確的
  // 背景），再讓 ghost 動畫滑回原位。
  function bounceGhostBack(fd){
    if(currentDate !== fd.homeDate){
      currentDate = fd.homeDate;
      renderTimeline(); // floatingDrag 還沒清空，本尊仍會被跳過不顯示
    }
    fd.ghost.style.transition = 'left .22s cubic-bezier(.3,.6,.3,1), top .22s cubic-bezier(.3,.6,.3,1)';
    fd.ghost.style.left = fd.originLeft + 'px';
    fd.ghost.style.top = fd.originTop + 'px';
    if(navigator.vibrate) navigator.vibrate(10);
    setTimeout(function(){
      fd.ghost.remove();
      floatingDrag = null;
      renderEvents(); // 現在才把本尊畫回來（floatingDrag 已清空，不會再被跳過）
    }, 230);
  }

  function endFloatingDrag(clientX, clientY){
    if(!floatingDrag) return;
    disarmEdgeFlip();
    disarmVerticalAutoScroll();
    const fd = floatingDrag;

    // 換算成 ghost 實際的左上角位置（用抓取時記錄的偏移量還原），
    // 這樣落點才會跟畫面上看到的 ghost 位置完全一致，不會偏移。
    const ghostLeft = clientX - fd.grabOffsetX;
    const ghostTop = clientY - fd.grabOffsetY;

    const gridRect = timelineGrid.getBoundingClientRect();
    const rawMin = Math.round((ghostTop - gridRect.top)/hourPx*60);
    const snappedStart = Math.max(0, Math.min(23*60, Math.round(rawMin/5)*5));
    const newStart = minutesToTime(snappedStart);
    const newEnd = minutesToTime(snappedStart + fd.durationMin);

    const evRect = eventsLayer.getBoundingClientRect();
    const n = Math.max(1, columns.length);
    const colWidthPx = evRect.width / n || 1;
    let colIdx = Math.floor((ghostLeft - evRect.left) / colWidthPx);
    colIdx = Math.max(0, Math.min(n - 1 - fd.span, colIdx));
    const newParticipants = columns.slice(colIdx, colIdx + fd.span + 1).map(c => c.id);

    // 落點如果會跟別的行程重疊（欄位+時間都有交集），不提交這次移動，
    // 動畫跳回原位；複製出來、還沒被拖過的行程不會走到這裡（那時候
    // floatingDrag 根本還不存在），所以「剛複製可以重疊」的例外自然成立。
    const collision = findCollision(
      currentDate, colIdx, colIdx + fd.span,
      snappedStart, snappedStart + fd.durationMin,
      fd.masterId, fd.homeDate
    );
    if(collision){
      bounceGhostBack(fd);
      return;
    }

    fd.ghost.remove();
    floatingDrag = null;
    applyQuickPlacement(fd.masterId, fd.homeDate, currentDate, newStart, newEnd, newParticipants);
    renderEvents();
  }

  /* ---------------- 長按拖拽（防誤觸） ---------------- */
  function attachCardInteractions(card, inst, runMin, runMax){
    let longPressTimer = null;
    let phase = 'idle'; // 'idle' → 'menu'(長按跳出選單，尚未拖動) → 'dragging'(移動夠多，轉成浮動拖曳)
    let cancelledByScroll = false;
    let startX = 0;
    let startY = 0;
    let lastY = 0;
    let lastMoveTime = 0;
    let scrollVelocity = 0;

    card.addEventListener('pointerdown', function(e){
      if(pinchActive) return; // 雙指縮放進行中，單指手勢一律不啟動
      e.stopPropagation();

      if(selectMode){
        // 選取狀態下，點擊行程只用來勾選/取消勾選，不進入原本的長按選單／
        // 拖曳搬移／開編輯頁那套互動。沒有權限的行程（別人創建的共同行程）
        // 直接忽略點擊。
        if(!canSelectInstance(inst)) return;
        const key = inst.masterId+'@'+inst.instanceDate;
        if(selectedEventKeys.has(key)) selectedEventKeys.delete(key);
        else selectedEventKeys.add(key);
        renderEvents();
        return;
      }

      stopMomentumScroll(); // 再次觸碰畫面就先停掉還在滑的慣性捲動
      startX = e.clientX;
      startY = e.clientY;
      lastY = e.clientY;
      lastMoveTime = performance.now();
      scrollVelocity = 0;
      phase = 'idle';
      cancelledByScroll = false;

      let pinchTouched = false; // 這次手勢期間是否曾經進入過雙指縮放狀態

      longPressTimer = setTimeout(function(){
        if(cancelledByScroll) return;
        if(pinchActive){ pinchTouched = true; return; } // 計時器觸發當下才是真正該檢查雙指縮放的時機
        phase = 'menu';
        if(navigator.vibrate) navigator.vibrate(15);
        const shrunkTitle = card.dataset.shrunk === '1' ? (inst.title || '(未命名行程)') : null;
        openCardMenu(card, inst.masterId, inst.instanceDate, shrunkTitle);
      }, 400);

      const onMove = function(ev2){
        if(pinchActive){ pinchTouched = true; return; } // 雙指縮放進行中，這個手勢不再繼續處理，並記住曾經縮放過
        const dy = ev2.clientY - startY;

        if(phase === 'idle'){
          // 卡片本身是 touch-action:none，瀏覽器不會自動幫忙捲動頁面，
          // 所以一旦判定使用者其實是想捲動（而不是要長按），要自己
          // 動手把 scrollTop 往回推，才會有正常的捲動手感；未達門檻前
          // （手指還沒移動超過 16px）完全不動，讓長按判斷保有優先權。
          if(!cancelledByScroll && Math.abs(dy) > 16){
            cancelledByScroll = true;
            clearTimeout(longPressTimer);
          }
          if(cancelledByScroll){
            const now = performance.now();
            const dt = now - lastMoveTime || 16;
            const deltaY = ev2.clientY - lastY;
            scheduleTimelineScroll(deltaY);
            scrollVelocity = -deltaY / dt; // 記錄最後的捲動速度，放開時延續當慣性
            lastMoveTime = now;
          }
          lastY = ev2.clientY;
          return;
        }

        if(phase === 'menu'){
          // 選單已經跳出來了：手指如果開始明顯移動，代表使用者其實是要
          // 拖曳搬移這個行程，不是要用選單——收起選單，轉成浮動拖曳。
          const dx = ev2.clientX - startX;
          if(Math.abs(dx) > 10 || Math.abs(ev2.clientY - startY) > 10){
            closeCardMenu();
            phase = 'dragging';
            startFloatingDrag(inst, runMin, runMax, card, startX, startY, ev2.clientX, ev2.clientY);
          }
          return;
        }

        // phase === 'dragging'
        ev2.preventDefault();
        updateFloatingDrag(ev2.clientX, ev2.clientY);
      };

      const onUp = function(ev2){
        clearTimeout(longPressTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);

        if(phase === 'dragging'){
          endFloatingDrag(ev2.clientX, ev2.clientY);
        } else if(phase === 'menu'){
          // 長按後直接放開：選單維持顯示，等使用者點選單裡的按鈕，
          // 或點畫面其他地方讓它自動收起。
        } else if(cancelledByScroll){
          flushTimelineScrollNow();
          startMomentumScroll(scrollVelocity);
        } else if(pinchActive || pinchTouched){
          // 這次手勢過程中發生過雙指縮放：不是真正的單擊，不開編輯頁
        } else {
          card.classList.add('card-tapped-feedback');
          setTimeout(function(){
            card.classList.remove('card-tapped-feedback');
            openEdit(inst.masterId, inst.instanceDate);
          }, 110);
        }
      };

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  }

  // 長按卡片四個角落的圓點並拖曳：每個角落固定「對角那一點」不動，拖曳這個角
  // 同時調整鄰接的上/下緣（時長）與左/右緣（參與者範圍）。右下角＝原本的行為
  // （起始時間、起始欄固定，往下往右延伸）；其餘三個角是同一套邏輯依方向鏡射。
  function attachResizeHandle(card, inst, handle, runMin, runMax, meta, corner){
    const vertDir = (corner === 'tl' || corner === 'tr') ? 'top' : 'bottom'; // 這次拖曳移動的是上緣還是下緣
    const horizDir = (corner === 'tl' || corner === 'bl') ? 'left' : 'right'; // 移動的是左緣還是右緣

    let longPressTimer = null;
    let resizing = false;
    let startX = 0, startY = 0;
    let origHeight = 0, origTop = 0, origWidthPx = 0, origLeftPx = 0;
    let startScrollTop = 0;
    let finalHeight = 0, finalWidthPx = 0;
    let cancelledByScroll = false, lastY = 0, lastMoveTime = 0, scrollVelocity = 0;

    handle.addEventListener('pointerdown', function(e){
      if(pinchActive) return; // 雙指縮放進行中，單指手勢一律不啟動
      e.stopPropagation(); // 不要觸發卡片本體「移動時間」的那組互動

      startX = e.clientX;
      startY = e.clientY;
      const cardRect = card.getBoundingClientRect();
      const evRect0 = eventsLayer.getBoundingClientRect();
      origHeight = parseFloat(card.style.height) || 0;
      origTop = parseFloat(card.style.top) || 0;
      origWidthPx = cardRect.width;
      origLeftPx = cardRect.left - evRect0.left; // 換算成跟 card.style.top 同一套、相對 events-layer 的座標
      startScrollTop = timelineScroll.scrollTop;
      finalHeight = origHeight;
      finalWidthPx = origWidthPx;
      resizing = false;
      cancelledByScroll = false;
      lastY = startY;
      lastMoveTime = performance.now();
      scrollVelocity = 0;

      handle.classList.add('touched'); // 手指一按下就先讓把手現形（觸控回饋），跟是否已經判定成縮放無關

      longPressTimer = setTimeout(function(){
        if(pinchActive) return; // 計時器觸發當下才是真正該檢查雙指縮放的時機，避免縮放時誤觸調整時長
        resizing = true;
        card.classList.add('resizing');
        handle.classList.add('active');
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        if(navigator.vibrate) navigator.vibrate(15);
      }, 400);

      const onMove = function(e2){
        if(!resizing){
          if(pinchActive){ clearTimeout(longPressTimer); return; } // 雙指縮放中，取消這次調整時長的長按判斷
          // 把手熱區是 touch-action:none，瀏覽器不會自動幫忙捲動，一旦判定
          // 使用者其實是想捲動（而不是要調整時長），要自己接手驅動 scrollTop，
          // 否則畫面會卡住不動直到放開手指為止。
          if(!cancelledByScroll && Math.abs(e2.clientY - startY) > 16){
            cancelledByScroll = true;
            clearTimeout(longPressTimer);
          }
          if(cancelledByScroll){
            const now = performance.now();
            const dt = now - lastMoveTime || 16;
            const deltaY = e2.clientY - lastY;
            scheduleTimelineScroll(deltaY);
            scrollVelocity = -deltaY / dt; // 記錄最後的捲動速度，放開時延續當慣性
            lastMoveTime = now;
          }
          lastY = e2.clientY;
          return;
        }
        e2.preventDefault();

        const evRect = eventsLayer.getBoundingClientRect();
        const n = Math.max(1, columns.length);
        const colWidthPxEstimate = evRect.width / n;
        const otherInsts = getInstancesForDate(inst.instanceDate).filter(i =>
          !(i.masterId === inst.masterId && i.instanceDate === inst.instanceDate)
        );

        // ---- 垂直方向：拖曳的是上緣還是下緣，位移直接跟著手指連續變化，不吸附 ----
        let newTop = origTop, newHeight = origHeight;
        if(vertDir === 'bottom'){
          newHeight = origHeight + (e2.clientY - startY);
          newHeight = Math.max(8, Math.min(newHeight, hourPx*24 - origTop));
        } else {
          newTop = origTop + (e2.clientY - startY);
          newTop = Math.max(0, Math.min(newTop, origTop + origHeight - 8));
          newHeight = (origTop + origHeight) - newTop;
        }

        // ---- 水平方向：拖曳的是左緣還是右緣 ----
        let newLeftPx = origLeftPx, newWidthPx = origWidthPx;
        if(horizDir === 'right'){
          newWidthPx = origWidthPx + (e2.clientX - startX);
          newWidthPx = Math.max(20, Math.min(newWidthPx, evRect.right - (evRect.left + origLeftPx)));
        } else {
          newLeftPx = origLeftPx + (e2.clientX - startX);
          newLeftPx = Math.max(0, Math.min(newLeftPx, origLeftPx + origWidthPx - 20));
          newWidthPx = (origLeftPx + origWidthPx) - newLeftPx;
        }

        // ---- 碰撞限制：不能延伸進已經被其他行程占用的地方；固定的那一邊不用管，
        //      只需要夾住正在移動的那條邊。用「粗略換算的欄位範圍」跟原本邏輯一致。----
        const roughSpanCols = Math.max(1, Math.round(newWidthPx / colWidthPxEstimate));
        let roughColMin, roughColMax;
        if(horizDir === 'right'){
          roughColMin = runMin;
          roughColMax = Math.min(n-1, runMin + roughSpanCols - 1);
        } else {
          roughColMax = runMax;
          roughColMin = Math.max(0, runMax - roughSpanCols + 1);
        }

        if(vertDir === 'bottom'){
          let heightLimit = hourPx*24 - origTop;
          otherInsts.forEach(other => {
            const oTop = timeToMinutes(other.start)/60*hourPx;
            if(oTop < origTop) return; // 只考慮起始時間之後（下方）的
            eventColRuns(other).forEach(([oMin, oMax]) => {
              if(roughColMin <= oMax && oMin <= roughColMax) heightLimit = Math.min(heightLimit, oTop - origTop);
            });
          });
          newHeight = Math.max(8, Math.min(newHeight, heightLimit));
        } else {
          let topLimit = 0;
          const fixedBottomAbs = origTop + origHeight;
          otherInsts.forEach(other => {
            const oBottom = timeToMinutes(other.end)/60*hourPx;
            if(oBottom > fixedBottomAbs) return; // 只考慮結束時間在這個行程原本上緣之前（上方）的
            eventColRuns(other).forEach(([oMin, oMax]) => {
              if(roughColMin <= oMax && oMin <= roughColMax) topLimit = Math.max(topLimit, oBottom);
            });
          });
          newTop = Math.max(topLimit, Math.min(newTop, fixedBottomAbs - 8));
          newHeight = fixedBottomAbs - newTop;
        }

        const curStartMin = Math.round(newTop/hourPx*60);
        const curEndMin = Math.round((newTop+newHeight)/hourPx*60);
        if(horizDir === 'right'){
          let widthLimit = evRect.right - (evRect.left + origLeftPx);
          otherInsts.forEach(other => {
            const oStart = timeToMinutes(other.start), oEnd = timeToMinutes(other.end);
            if(!(curStartMin < oEnd && oStart < curEndMin)) return;
            eventColRuns(other).forEach(([oMin, oMax]) => {
              if(oMin > runMin) widthLimit = Math.min(widthLimit, (oMin - runMin) * colWidthPxEstimate);
            });
          });
          newWidthPx = Math.max(20, Math.min(newWidthPx, widthLimit));
        } else {
          let leftLimitPx = 0;
          const fixedRightPx = origLeftPx + origWidthPx;
          otherInsts.forEach(other => {
            const oStart = timeToMinutes(other.start), oEnd = timeToMinutes(other.end);
            if(!(curStartMin < oEnd && oStart < curEndMin)) return;
            eventColRuns(other).forEach(([oMin, oMax]) => {
              if(oMax < runMax) leftLimitPx = Math.max(leftLimitPx, (oMax + 1) * colWidthPxEstimate);
            });
          });
          newLeftPx = Math.max(leftLimitPx, Math.min(newLeftPx, fixedRightPx - 20));
          newWidthPx = fixedRightPx - newLeftPx;
        }

        finalHeight = newHeight;
        finalWidthPx = newWidthPx;
        card.style.top = newTop + 'px';
        card.style.height = newHeight + 'px';
        card.style.left = newLeftPx + 'px';
        card.style.width = newWidthPx + 'px';

        // 即時預覽：用跟放開時完全相同的 5 分鐘吸附規則換算目前的時間，
        // 直接寫回卡片上的時間文字，這樣使用者放手時看到的數字
        // 就是最終會套用的結果，不會有落差。
        // 即時預覽：畫面上顯示的分鐘數統一吸附成5的倍數（跟放開時真正套用的
        // 5分鐘吸附規則一致），不用顯示到1分鐘這麼細——拖曳下緣時因為上緣沒動、
        // 剛好本來就是5的倍數所以看起來沒問題，但拖曳上緣時上緣本身在連續變化，
        // 不吸附的話畫面會跳出1、2、3…這種細碎分鐘數。
        const startMinAbs = Math.round(newTop/hourPx*60/5)*5;
        const previewDurationMin = Math.max(5, Math.round(newHeight/hourPx*60/5)*5);
        const previewEndMin = startMinAbs + previewDurationMin;
        updateCardTimeDisplay(card, meta, minutesToTime(startMinAbs)+' - '+minutesToTime(previewEndMin));
      };

      const onUp = function(e2){
        clearTimeout(longPressTimer);
        handle.classList.remove('touched');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);

        if(resizing){
          card.classList.remove('resizing');
          handle.classList.remove('active');

          // 時長 → 吸附到 5 分鐘；固定的那一端（上緣或下緣）直接沿用原本的時間，
          // 不用重新從像素換算，避免抖動誤差。
          let durationMin = Math.round(finalHeight/hourPx*60/5)*5;
          durationMin = Math.max(5, durationMin);
          let newStart, newEnd;
          if(vertDir === 'bottom'){
            const startMinAbs = Math.round(origTop/hourPx*60);
            newStart = minutesToTime(startMinAbs);
            newEnd = minutesToTime(startMinAbs + durationMin);
          } else {
            newEnd = inst.end;
            newStart = minutesToTime(Math.max(0, timeToMinutes(inst.end) - durationMin));
          }

          // 寬度 → 換算成實際涵蓋幾欄；固定的那一端（左欄或右欄）沿用原本的邊界。
          const evRect = eventsLayer.getBoundingClientRect();
          const n = Math.max(1, columns.length);
          const colWidthPx = evRect.width / n;
          const spanCols = Math.max(1, Math.round(finalWidthPx / colWidthPx));
          let pendingRunMin, pendingRunMax;
          if(horizDir === 'right'){
            pendingRunMin = runMin;
            pendingRunMax = Math.min(n-1, runMin + spanCols - 1);
          } else {
            pendingRunMax = runMax;
            pendingRunMin = Math.max(0, runMax - spanCols + 1);
          }

          // 把這個分段原本涵蓋的欄位，換成拖曳後的新範圍
          const origIds = columns.slice(runMin, runMax+1).map(c=>c.id);
          const newIds = columns.slice(pendingRunMin, pendingRunMax+1).map(c=>c.id);
          const pset = new Set(inst.participants||[]);
          origIds.forEach(id => { if(newIds.indexOf(id)===-1) pset.delete(id); });
          newIds.forEach(id => pset.add(id));

          applyQuickPlacement(inst.masterId, inst.instanceDate, inst.instanceDate, newStart, newEnd, Array.from(pset));
          renderEvents();
        } else if(cancelledByScroll){
          flushTimelineScrollNow();
          startMomentumScroll(scrollVelocity);
        }
      };

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  }

  /* ---------------- 長按空白時段 → 拖曳選取範圍(可跨欄) → 放開建立新行程 ----------------
     單純點一下不會建立行程；需長按 400ms 進入選取模式（會有震動回饋與
     選取框），接著拖曳決定時段範圍（上下）與參與欄位範圍（左右），
     放開手指才真正建立新行程並跳轉到編輯頁。長按尚未觸發前若上下移動
     超過 8px，視為頁面捲動，直接取消，不建立任何東西。 */
  const timelineScroll = document.getElementById('timelineScroll');
  let selectionBox = null;

  /* ---------------- 手動接手捲動時的慣性動畫 ----------------
     卡片跟空白格區域都是 touch-action:none，瀏覽器不會再自動處理捲動，
     所以判定成「其實是想捲動」的時候，是用 JS 手動即時推動 scrollTop
     （見下面兩組手勢處理的 cancelledByScroll / gestureMode==='scroll'
     分支）。手動推動本身沒有慣性，手指一放開就會硬停。這裡額外做一個
     簡單的慣性模擬：放開的當下用最後量到的速度繼續往同方向捲一小段，
     並隨時間用摩擦力係數逐漸變慢，直到接近 0 或碰到頂/底邊界為止，
     感覺就會跟原生捲動一樣有「放手後還會滑一下」的物理感。 */
  let momentumRAF = null;
  function stopMomentumScroll(){
    if(momentumRAF){ cancelAnimationFrame(momentumRAF); momentumRAF = null; }
  }
  function startMomentumScroll(velocity){ // velocity: scrollTop 每毫秒的變化量(px/ms)
    stopMomentumScroll();
    let v = velocity;
    let lastT = performance.now();
    function step(now){
      const dt = Math.min(32, now - lastT); // 掉幀時限制單幀最大時間差，避免瞬間跳太遠
      lastT = now;
      if(Math.abs(v) < 0.02){ momentumRAF = null; return; }
      const maxScroll = Math.max(0, timelineScroll.scrollHeight - timelineScroll.clientHeight);
      const next = timelineScroll.scrollTop + v*dt;
      if(next <= 0){ timelineScroll.scrollTop = 0; momentumRAF = null; return; }
      if(next >= maxScroll){ timelineScroll.scrollTop = maxScroll; momentumRAF = null; return; }
      timelineScroll.scrollTop = next;
      v *= 0.94; // 摩擦力衰減
      momentumRAF = requestAnimationFrame(step);
    }
    momentumRAF = requestAnimationFrame(step);
  }

  /* 手動拖曳捲動時，pointermove 觸發頻率遠高於畫面更新頻率，原本每次事件都直接寫
     scrollTop 會強迫瀏覽器同步做版面重算（layout thrashing）。這裡把同一影格內的
     多次位移量累加起來，改用 requestAnimationFrame 節流，每影格只真正寫入一次。 */
  let pendingScrollDelta = 0;
  let scrollFlushRAF = null;
  function scheduleTimelineScroll(deltaY){
    pendingScrollDelta -= deltaY;
    if(scrollFlushRAF) return;
    scrollFlushRAF = requestAnimationFrame(function(){
      scrollFlushRAF = null;
      timelineScroll.scrollTop += pendingScrollDelta;
      pendingScrollDelta = 0;
    });
  }
  function flushTimelineScrollNow(){ // 手指放開時要立刻套用剩餘位移，不要等下一影格
    if(scrollFlushRAF){ cancelAnimationFrame(scrollFlushRAF); scrollFlushRAF = null; }
    if(pendingScrollDelta){ timelineScroll.scrollTop += pendingScrollDelta; pendingScrollDelta = 0; }
  }

  function snapToFiveMin(px){ const step = hourPx/12; return Math.round(px/step)*step; } // hourPx/12px = 5分鐘（每小時高度 ÷ 12），格線視覺上仍只畫到15分刻度，只是拖曳吸附變細
  function fiveMinPx(){ return hourPx/12; } // 5 分鐘對應的像素高度，供各處拖曳/縮放/建立行程的最小單位統一使用；隨 hourPx 縮放即時變動，所以寫成函式而不是常數

  // 讓拉框選取的範圍不能延伸進已經被其他行程占用的地方：anchorPx/anchorColIdx
  // 是拖曳的固定端（手指最初按下的位置），只有「正在延伸」的那一端會被
  // 夾住，夾到剛好碰到既有行程的邊界為止；如果夾到完全沒有空間，回傳
  // 一個高度為 0 的範圍，代表這裡放不下、不能建立。
  function clampSelectionAgainstCollisions(top, bottom, colMin, colMax, growingDown, growingRight){
    const insts = getInstancesForDate(currentDate);
    const blockers = [];
    insts.forEach(inst => {
      const iTop = timeToMinutes(inst.start)/60*hourPx;
      const iBottom = timeToMinutes(inst.end)/60*hourPx;
      eventColRuns(inst).forEach(([runMin, runMax]) => {
        if(colMin <= runMax && runMin <= colMax && top < iBottom && iTop < bottom){
          blockers.push({iTop, iBottom, runMin, runMax});
        }
      });
    });
    if(blockers.length === 0) return {top, bottom, colMin, colMax};

    // 固定端（不是正在延伸的那一端，也就是長按/拖曳的起點）如果本身就已經落在
    // 某個既有行程的時間＋欄位範圍裡面，代表這個起點根本不該拿來建立新行程——
    // 不管延伸端怎麼夾都沒用，直接回傳沒有空間。這種情況通常發生在：卡片因為
    // 「N 項行程」群組合併等原因，沒有實際 DOM 元素蓋住那個時段（長按穿透到
    // 空白處的判斷邏輯），如果沒有這道檢查，新行程就會跟底下既有行程重疊。
    const fixedPos = growingDown ? top : bottom;
    const fixedCol = growingRight ? colMin : colMax;
    const anchorBlocked = blockers.some(b =>
      fixedPos >= b.iTop - 0.01 && fixedPos < b.iBottom + 0.01 && fixedCol >= b.runMin && fixedCol <= b.runMax
    );
    if(anchorBlocked){
      return {top, bottom: top, colMin, colMax: colMin}; // 高度／欄位範圍歸零，代表這裡放不下
    }

    let newTop = top, newBottom = bottom;
    if(growingDown){
      // 上緣固定，往下延伸 → 夾住 bottom
      const limits = blockers.map(b => b.iTop).filter(v => v >= top - 0.01);
      if(limits.length) newBottom = Math.min(newBottom, Math.min(...limits));
    } else {
      // 下緣固定，往上延伸 → 夾住 top
      const limits = blockers.map(b => b.iBottom).filter(v => v <= bottom + 0.01);
      if(limits.length) newTop = Math.max(newTop, Math.max(...limits));
    }

    let newColMin = colMin, newColMax = colMax;
    const stillBlocking = blockers.filter(b => newTop < b.iBottom && b.iTop < newBottom);
    if(stillBlocking.length){
      if(growingRight){
        const limits = stillBlocking.map(b => b.runMin - 1).filter(v => v >= colMin);
        if(limits.length) newColMax = Math.min(newColMax, Math.min(...limits));
      } else {
        const limits = stillBlocking.map(b => b.runMax + 1).filter(v => v <= colMax);
        if(limits.length) newColMin = Math.max(newColMin, Math.max(...limits));
      }
    }

    if(newBottom < newTop) newBottom = newTop; // 夾到沒有空間，高度歸零（代表這裡放不下）
    if(newColMax < newColMin) newColMax = newColMin;
    return {top:newTop, bottom:newBottom, colMin:newColMin, colMax:newColMax};
  }

  function ensureSelectionBox(){
    if(selectionBox) return selectionBox;
    selectionBox = document.createElement('div');
    selectionBox.className = 'selection-box';
    selectionBox.innerHTML = '<span class="selection-label"></span>';
    // 一定要掛在 eventsLayer 底下（不是 timelineGrid！），因為欄位的
    // 百分比寬度是以 eventsLayer 的寬度為基準（已經扣掉左側 58px 的
    // 時間刻度區）。掛錯父層會讓百分比基準多算那 58px，導致選取框
    // 整體往左偏移。
    eventsLayer.appendChild(selectionBox);
    return selectionBox;
  }
  function removeSelectionBox(){
    if(selectionBox){ selectionBox.remove(); selectionBox = null; }
  }
  function paintSelectionBox(topPx, bottomPx, colMin, colMax){
    const box = ensureSelectionBox();
    const n = columns.length;
    const trueHeight = bottomPx - topPx;
    box.style.top = topPx+'px';
    box.style.height = Math.max(6, trueHeight)+'px'; // 視覺上留一點高度看得到,但不代表可以建立
    box.style.left = 'calc(' + (colMin/n*100) + '% + 2px)';
    box.style.width = 'calc(' + ((colMax-colMin+1)/n*100) + '% - 4px)';
    box.classList.toggle('no-room', trueHeight < fiveMinPx());
    // 直接記錄實際欄位索引跟「真實」高度，放開時讀這裡即可，不要從
    // calc() 字串或被強制拉高的 style.height 反推。
    box.dataset.colMin = colMin;
    box.dataset.colMax = colMax;
    box.dataset.trueTop = topPx;
    box.dataset.trueBottom = bottomPx;
    const startMin = Math.round(topPx/hourPx*60);
    const endMin = Math.round(bottomPx/hourPx*60);
    const names = columns.slice(colMin, colMax+1).map(c=>c.name).join('、');
    box.querySelector('.selection-label').textContent = trueHeight < fiveMinPx()
      ? '沒有空間'
      : minutesToTime(startMin) + ' – ' + minutesToTime(endMin) + (names ? ' · '+names : '');
  }

  (function(){
    let downY = 0, downX = 0, lastY = 0, anchorPx = 0, anchorColIdx = 0;
    let lastMoveTime = 0, scrollVelocity = 0;
    let longPressTimer = null;
    let selecting = false;
    let cancelled = false;
    let gestureMode = null; // 一旦離開長按判斷，決定是 'scroll'（捲動）還是 'swipeday'（左右滑動切日），決定後就不再切換
    let cachedRect = null; // 拉框選取過程中容器不會捲動，量一次存起來即可，不用每次 pointermove 都重新量測

    function colIdxFromX(clientX){
      const rect = cachedRect || eventsLayer.getBoundingClientRect();
      const n = Math.max(1, columns.length);
      const ratio = (clientX - rect.left) / rect.width;
      return Math.max(0, Math.min(n-1, Math.floor(ratio * n)));
    }

    function onMove(e){
      if(pinchActive) return; // 雙指縮放進行中，這個手勢不再繼續處理
      const rect = cachedRect || eventsLayer.getBoundingClientRect();
      const curPx = e.clientY - rect.top;

      if(!selecting){
        // timeline-grid 是 touch-action:none，瀏覽器不會自動幫忙捲動，
        // 所以一旦判定使用者其實是想捲動或左右滑動切日（而不是要長按
        // 拉框），要自己接手處理，才會有正常的手勢手感。
        if(!cancelled){
          const dy = e.clientY - downY;
          const dx = e.clientX - downX;
          if(Math.abs(dy) > 8 || Math.abs(dx) > 15){
            cancelled = true;
            clearTimeout(longPressTimer);
            let mode = (Math.abs(dx) > Math.abs(dy)) ? 'swipeday' : 'scroll';
            gestureMode = mode;
          }
        }
        if(gestureMode === 'scroll'){
          const now = performance.now();
          const dt = now - lastMoveTime || 16;
          const deltaY = e.clientY - lastY;
          scheduleTimelineScroll(deltaY);
          scrollVelocity = -deltaY / dt; // 記錄最後的捲動速度，放開時延續當慣性
          lastMoveTime = now;
        } else if(gestureMode === 'swipeday'){
          e.preventDefault();
          updateDaySlide(e.clientX - downX); // 畫面即時跟著手指位移滑動，跟垂直捲動同樣的連貫手感
        }
        lastY = e.clientY;
        return;
      }
      e.preventDefault();
      let top = Math.min(anchorPx, curPx);
      let bottom = Math.max(anchorPx, curPx);
      top = Math.max(0, snapToFiveMin(top));
      bottom = Math.min(hourPx*24, snapToFiveMin(bottom));
      if(bottom - top < fiveMinPx()) bottom = top + fiveMinPx();

      const curColIdx = colIdxFromX(e.clientX);
      const colMin = Math.min(anchorColIdx, curColIdx);
      const colMax = Math.max(anchorColIdx, curColIdx);
      const growingDown = curPx >= anchorPx;
      const growingRight = curColIdx >= anchorColIdx;

      const clamped = clampSelectionAgainstCollisions(top, bottom, colMin, colMax, growingDown, growingRight);
      paintSelectionBox(clamped.top, clamped.bottom, clamped.colMin, clamped.colMax);
    }

    function onUp(e){
      clearTimeout(longPressTimer);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);

      if(selecting){
        const box = selectionBox;
        const top = Number(box.dataset.trueTop);
        const bottom = Number(box.dataset.trueBottom);
        const colMin = Number(box.dataset.colMin);
        const colMax = Number(box.dataset.colMax);
        removeSelectionBox();
        if(bottom - top >= fiveMinPx()){ // 被夾到沒有空間時這裡會趨近 0，不建立行程
          const startMin = Math.round(top/hourPx*60);
          const endMin = Math.round(bottom/hourPx*60);
          const participantIds = columns.slice(colMin, colMax+1).map(c=>c.id);
          createNewEvent(startMin, endMin, participantIds);
        }
      } else if(gestureMode === 'swipeday'){
        // 放開手指：滑動幅度夠大就用動畫接續完成切日，不夠就彈回原位
        endDaySlide(e.clientX - downX);
      } else if(gestureMode === 'scroll'){
        flushTimelineScrollNow();
        startMomentumScroll(scrollVelocity);
      }
      selecting = false;
      cancelled = false;
      gestureMode = null;
      cachedRect = null;
    }

    timelineGrid.addEventListener('pointerdown', function(e){
      if(selectMode) return; // 選取狀態下，空白處長按不建立新行程，避免手勢衝突
      if(pinchActive) return; // 雙指縮放進行中，單指手勢一律不啟動
      // 只處理空白區域（行程卡自己的 pointerdown 會 stopPropagation）
      stopMomentumScroll(); // 再次觸碰畫面就先停掉還在滑的慣性捲動
      downY = e.clientY;
      downX = e.clientX;
      lastY = e.clientY;
      lastMoveTime = performance.now();
      scrollVelocity = 0;
      cancelled = false;
      selecting = false;
      gestureMode = null;
      cachedRect = eventsLayer.getBoundingClientRect();
      const rect = cachedRect;
      anchorPx = e.clientY - rect.top;
      anchorColIdx = colIdxFromX(e.clientX);

      longPressTimer = setTimeout(function(){
        if(cancelled) return;
        if(pinchActive) return; // 計時器觸發當下才是真正該檢查雙指縮放的時機，避免縮放時誤建新行程
        selecting = true;
        if(navigator.vibrate) navigator.vibrate(15);
        let top = Math.max(0, snapToFiveMin(anchorPx));
        let bottom = Math.min(hourPx*24, top + hourPx); // 預設長按不拖曳＝1小時
        const clamped = clampSelectionAgainstCollisions(top, bottom, anchorColIdx, anchorColIdx, true, true);
        paintSelectionBox(clamped.top, clamped.bottom, clamped.colMin, clamped.colMax);
      }, 400);

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  })();

  function createNewEvent(startMin, endMin, participantIds){
    startMin = Math.max(0, Math.min(23*60+55, startMin));
    endMin = Math.max(startMin+5, Math.min(24*60, endMin));
    if(!participantIds || participantIds.length===0) participantIds = [columns[0].id];
    const id = 'e' + Date.now();
    const ev = {
      id: id,
      title: '新行程',
      date: currentDate,
      start: minutesToTime(startMin),
      end: minutesToTime(endMin),
      notes: '',
      participants: participantIds.slice(),
      creatorId: CURRENT_USER_ID,
      color: EVENT_COLORS[events.length % EVENT_COLORS.length].id,
      recurrence: null
    };
    events.push(ev);
    justCreatedEventId = id; // 讓下一次 renderEvents() 幫這張新卡片跑「捲軸攤開」進場動畫
    renderEvents();
    return id;
  }

  document.getElementById('fabAdd').addEventListener('click', function(){
    if(selectMode) return;
    const now = new Date();
    const startHour = currentDate === todayStr() ? now.getHours() : 9;
    const newId = createNewEvent(startHour*60, startHour*60 + 60, [columns[0].id]);
    openEdit(newId, currentDate);
  });

  document.getElementById('btnAddColumn').addEventListener('click', function(){
    if(selectMode) return;
    showPromptDialog('新增共編使用者的名字：', '', function(value){
      const name = (value || '').trim();
      if(!name) return;
      const id = 'p' + Date.now();
      columns.push({id, name});
      renderColumnHeader();
      renderEvents(); // 欄位數變了，行程的寬度/位置要重新計算
    });
  });

  datePicker.addEventListener('change', function(){
    if(!datePicker.value) return;
    currentDate = datePicker.value;
    renderTimeline();
  });
  dateDisplayBtn.addEventListener('click', function(){
    openDatePicker(currentDate, function(dateStr){
      datePicker.value = dateStr;
      datePicker.dispatchEvent(new Event('change'));
    });
  });

  /* ---------------- 編輯頁：欄位連動 ---------------- */
  const pageTimeline = document.getElementById('page-timeline');
  const pageEdit = document.getElementById('page-edit');
  const pageMonth = document.getElementById('page-month');
  const fieldTitle = document.getElementById('fieldTitle');
  // 新建立的行程預設標題是「新行程」：點進標題欄位準備輸入時，
  // 如果還是這個預設值，直接幫使用者清空，不用自己手動刪除。
  fieldTitle.addEventListener('focus', function(){
    if(fieldTitle.value === '新行程') fieldTitle.value = '';
  });
  const fieldDate = document.getElementById('fieldDate');
  const fieldStart = document.getElementById('fieldStart');
  const fieldEnd = document.getElementById('fieldEnd');
  const fieldDateBtn = document.getElementById('fieldDateBtn');
  const fieldStartBtn = document.getElementById('fieldStartBtn');
  const fieldEndBtn = document.getElementById('fieldEndBtn');

  // 「2026年8月27日 · 週四」，跟頂部日期切換鍵同一套格式，比原生
  // input[type=date] 的 YYYY-MM-DD 好讀。
  function formatDateForDisplay(dateStr){
    if(!dateStr) return '—';
    const [y,m,d] = dateStr.split('-').map(Number);
    return y+'年'+m+'月'+d+'日 · '+WEEKDAYS[weekdayOf(dateStr)];
  }
  fieldDateBtn.addEventListener('click', function(){
    if(fieldDate.disabled) return;
    openDatePicker(fieldDate.value, function(dateStr){
      fieldDate.value = dateStr;
      fieldDateBtn.textContent = formatDateForDisplay(dateStr);
      fieldDate.dispatchEvent(new Event('change'));
    });
  });
  fieldStartBtn.addEventListener('click', function(){
    openTimePicker(fieldStart.value, function(timeStr){
      fieldStart.value = timeStr;
      fieldStartBtn.textContent = timeStr;
      fieldStart.dispatchEvent(new Event('change'));
    }, '開始時間');
  });
  fieldEndBtn.addEventListener('click', function(){
    openTimePicker(fieldEnd.value, function(timeStr){
      fieldEnd.value = timeStr;
      fieldEndBtn.textContent = timeStr;
      fieldEnd.dispatchEvent(new Event('change'));
    }, '結束時間');
  });
  const fieldNotes = document.getElementById('fieldNotes');
  const participantsBox = document.getElementById('participantsBox');
  const colorBox = document.getElementById('colorBox');
  const weekdayBox = document.getElementById('weekdayBox');
  const syncField = document.getElementById('syncField');
  const fieldSyncEdit = document.getElementById('fieldSyncEdit');
  let selectedParticipants = new Set();
  let selectedWeekdays = new Set();
  let selectedColor = DEFAULT_EVENT_COLOR;

  function renderColorSwatches(colorId){
    selectedColor = colorId || DEFAULT_EVENT_COLOR;
    colorBox.innerHTML = '';
    EVENT_COLORS.forEach(c => {
      const sw = document.createElement('div');
      sw.className = 'color-swatch' + (selectedColor === c.id ? ' selected' : '');
      sw.style.background = c.hex;
      sw.title = c.name;
      sw.addEventListener('click', function(){
        selectedColor = c.id;
        colorBox.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
        sw.classList.add('selected');
      });
      colorBox.appendChild(sw);
    });
  }

  function renderParticipantChips(selectedIds){
    selectedParticipants = new Set(selectedIds);
    participantsBox.innerHTML = '';
    columns.forEach(col => {
      const chip = document.createElement('div');
      chip.className = 'participant-chip' + (selectedParticipants.has(col.id) ? ' selected' : '');
      chip.dataset.id = col.id;
      chip.innerHTML = '<span class="chip-dot"></span><span></span>';
      chip.querySelector('span:last-child').textContent = col.name;
      chip.addEventListener('click', function(){
        if(selectedParticipants.has(col.id)){
          // 至少保留一位參與者，避免行程變成沒人參加
