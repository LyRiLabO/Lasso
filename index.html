          if(selectedParticipants.size > 1) selectedParticipants.delete(col.id);
        } else {
          selectedParticipants.add(col.id);
        }
        chip.classList.toggle('selected', selectedParticipants.has(col.id));
      });
      participantsBox.appendChild(chip);
    });
  }

  function renderWeekdayChips(weekdays){
    selectedWeekdays = new Set(weekdays||[]);
    weekdayBox.innerHTML = '';
    WEEKDAYS.forEach((label, idx) => {
      const chip = document.createElement('div');
      chip.className = 'weekday-chip' + (selectedWeekdays.has(idx) ? ' selected' : '');
      chip.textContent = label.slice(1); // 週日→日、週一→一...
      chip.addEventListener('click', function(){
        if(selectedWeekdays.has(idx)) selectedWeekdays.delete(idx);
        else selectedWeekdays.add(idx);
        chip.classList.toggle('selected', selectedWeekdays.has(idx));
      });
      weekdayBox.appendChild(chip);
    });
  }

  function fillEditForm(data, dateStr, isRecurring){
    fieldTitle.value = data.title || '';
    fieldDate.value = dateStr;
    fieldDate.disabled = !!isRecurring; // 重複行程的個別日期由「重複」規則決定，這裡不能單獨改
    fieldDateBtn.textContent = formatDateForDisplay(dateStr);
    fieldDateBtn.classList.toggle('disabled', !!isRecurring);
    fieldStart.value = data.start;
    fieldEnd.value = data.end;
    fieldStartBtn.textContent = data.start || '—';
    fieldEndBtn.textContent = data.end || '—';
    fieldNotes.value = data.notes || '';
    renderParticipantChips(data.participants && data.participants.length ? data.participants : [columns[0].id]);
    renderColorSwatches(data.color || DEFAULT_EVENT_COLOR);
  }

  // 開始／結束時間各自獨立，使用者手動調整，不再互相連動或自動推算

  /* ---------------- 開啟／關閉編輯頁（SPA + History API） ----------------
     注意：某些內嵌預覽環境（例如聊天工具的沙盒 iframe）會擋掉
     history.pushState/back，呼叫時會直接丟出例外。若不處理，例外會中斷
     整段初始化流程，導致時間網格畫不出來、點擊也沒有反應。
     這裡一律用 try/catch 包住，失敗時改用純 JS 的頁面切換當備援，
     真正部署到瀏覽器分頁時則會自動使用真正的 History API（返回鍵可用）。 */
  let usingRealHistory = true;
  let editingMasterId = null;
  let editingInstanceDate = null;

  function openEdit(masterId, instanceDate){
    const master = events.find(e => e.id === masterId);
    if(!master) return;
    editingMasterId = masterId;
    editingInstanceDate = instanceDate;

    // 取得這一天實際顯示的內容（已套用 override 的版本）
    const inst = getInstancesForDate(instanceDate).find(
      i => i.masterId === masterId && i.instanceDate === instanceDate
    );
    const data = inst || {
      title: master.title, start: master.start, end: master.end,
      notes: master.notes, participants: master.participants, color: master.color
    };

    fillEditForm(data, instanceDate, !!master.recurrence);
    renderWeekdayChips(master.recurrence ? master.recurrence.weekdays : []);
    syncField.style.display = master.recurrence ? 'flex' : 'none';
    fieldSyncEdit.checked = false;

    if(usingRealHistory){
      try{
        history.pushState({page:'edit'}, '', '#edit');
      }catch(err){
        usingRealHistory = false;
      }
    }
    showPage('edit');
  }

  /* ---------------- 月曆檢視（#page-month） ----------------
     只是「瀏覽」用的頁面，不改資料，所以完全不用碰復原/重做系統。
     每天格子裡的行程清單直接重用 getInstancesForDate()——跟時間軸主頁
     抓當天行程是同一個函式，顏色也是重用 eventColorById()/isLightColor()，
     這樣月曆上看到的顏色永遠跟時間軸上的一致，不會兩邊各自維護一套顏色
     邏輯結果對不上。 */
  const monthYearLabel = document.getElementById('monthYearLabel');
  const monthMonthLabel = document.getElementById('monthMonthLabel');
  const monthWeekdaysRow = document.getElementById('monthWeekdaysRow');
  const monthGrid = document.getElementById('monthGrid');
  let monthViewYear = 0, monthViewMonth = 0; // 目前月曆頁顯示的年月，0-based month

  function renderMonthGrid(){
    monthYearLabel.textContent = monthViewYear + '年';
    monthMonthLabel.textContent = (monthViewMonth+1) + '月';
    if(monthWeekdaysRow.children.length === 0){
      WEEKDAYS.forEach(w => {
        const el = document.createElement('span');
        el.textContent = w.slice(1); // 週日 → 日
        monthWeekdaysRow.appendChild(el);
      });
    }

    monthGrid.innerHTML = '';
    const startOffset = new Date(monthViewYear, monthViewMonth, 1).getDay(); // 0=日
    const daysInMonth = new Date(monthViewYear, monthViewMonth+1, 0).getDate();
    const daysInPrevMonth = new Date(monthViewYear, monthViewMonth, 0).getDate();
    const today = todayStr();
    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7; // 補滿整數週
    monthGrid.style.gridTemplateRows = 'repeat(' + (totalCells/7) + ', 1fr)'; // 不管這個月幾週，每排永遠平分滿整個可視高度

    for(let i=0; i<totalCells; i++){
      const dayNum = i - startOffset + 1;
      let cellDate, displayNum, outside = false;

      if(dayNum < 1){
        displayNum = daysInPrevMonth + dayNum;
        const pm = monthViewMonth === 0 ? 11 : monthViewMonth - 1;
        const py = monthViewMonth === 0 ? monthViewYear - 1 : monthViewYear;
        cellDate = py + '-' + pad2(pm+1) + '-' + pad2(displayNum);
        outside = true;
      } else if(dayNum > daysInMonth){
        displayNum = dayNum - daysInMonth;
        const nm = monthViewMonth === 11 ? 0 : monthViewMonth + 1;
        const ny = monthViewMonth === 11 ? monthViewYear + 1 : monthViewYear;
        cellDate = ny + '-' + pad2(nm+1) + '-' + pad2(displayNum);
        outside = true;
      } else {
        displayNum = dayNum;
        cellDate = monthViewYear + '-' + pad2(monthViewMonth+1) + '-' + pad2(dayNum);
      }

      const cell = document.createElement('div');
      cell.className = 'month-cell'
        + (outside ? ' outside-month' : '')
        + (cellDate === today ? ' today' : '')
        + (cellDate === currentDate ? ' current-day' : '');

      const dateEl = document.createElement('div');
      dateEl.className = 'cell-date';
      dateEl.textContent = displayNum;
      cell.appendChild(dateEl);

      const listEl = document.createElement('div');
      listEl.className = 'cell-events';
      const insts = getInstancesForDate(cellDate).sort((a,b) => a.start.localeCompare(b.start));
      insts.forEach(inst => {
        const pill = document.createElement('div');
        pill.className = 'cell-event-pill';
        const colorInfo = eventColorById(inst.color);
        pill.style.background = colorInfo.hex;
        pill.style.color = isLightColor(colorInfo.hex) ? 'rgba(30,26,22,0.92)' : '#FFFFFF';
        pill.textContent = inst.title;
        listEl.appendChild(pill);
      });
      cell.appendChild(listEl);

      // 點格子（不管本月還是延伸出來的上/下個月），先給一個短暫的按下反饋，
      // 然後從這一格的正中心展開一個圓，圓展開的範圍裡看到的就是那一天的
      // 時間軸頁面，圓展開滿整個畫面之後才真的算切換完成（月曆頁在這之後
      // 才收起來）。時間軸→月曆維持原本從右側滑入的方式，不受影響。
      cell.addEventListener('click', function(){
        cell.classList.add('cell-tapped-feedback');
        setTimeout(function(){
          goToTimelineViaCircleReveal(cell, cellDate);
        }, 90);
      });

      monthGrid.appendChild(cell);
    }

    syncMonthCellScrollHeights();
  }

  // 每格「日期數字 + 行程清單」這組 flex 版面，理論上 .cell-events 的
  // overflow-y:auto 應該會自動裁切超出的部分、變成格子內部自己可以捲動，
  // 但這種「CSS Grid 用 1fr 分配列高 → flex 子項目再用 min-height:0 撐開
  // 剩餘空間」的組合在部分瀏覽器（尤其手機版 Safari）不一定每次都能正確
  // 算出高度，導致清單直接撐爆格子而不是自己捲動。這裡改成量測每一格
  // 實際算出來的高度，直接用 px 明算出行程清單能用的高度並寫死成
  // max-height，不管排版引擎自己算得準不準，捲動一定會生效。
  //
  // 用 ResizeObserver 而不是渲染完馬上量一次：格子的「實際」大小要等
  // CSS Grid 真的把 1fr 分配完、頁面切換動畫也跑完才會定案，用
  // requestAnimationFrame 賭一個時間點很容易撲空（量到還沒定案的高度，
  // 常常量到 0 或不準）。ResizeObserver 會在格子的框架大小真正確定/
  // 改變的當下才觸發，包含月曆頁從背景切到前景、手機轉向等情況都會
  // 自動重新量測，不用另外自己猜時機。
  let monthCellObserver = null;
  function syncMonthCellScrollHeights(){
    if(monthCellObserver) monthCellObserver.disconnect(); // 上一次月份的格子已經從 DOM 移除，先斷開避免觀察者名單一直累積、洩漏記憶體
    monthCellObserver = new ResizeObserver(function(entries){
      entries.forEach(function(entry){
        const cell = entry.target;
        const dateEl = cell.querySelector('.cell-date');
        const listEl = cell.querySelector('.cell-events');
        if(!dateEl || !listEl) return;
        const avail = cell.clientHeight - dateEl.offsetHeight - 2; // 2px 對應 .cell-events 的 margin-top
        listEl.style.maxHeight = Math.max(0, avail) + 'px';
      });
    });
    monthGrid.querySelectorAll('.month-cell').forEach(function(cell){
      monthCellObserver.observe(cell); // 一 observe 就會立刻先跑一次，之後格子大小只要一變也會自動再跑
    });
  }

  // 月曆→時間軸的專屬轉場：以點下去的那一格正中心為圓心，展開一個圓，
  // 圓的範圍裡看到的是準備好的時間軸內容，展開到蓋滿整個畫面才算完成。
  // 跟一般的 showPage()/goBackToTimeline() 滑動轉場是兩套獨立機制——這裡
  // 全程手動控制 #page-timeline 的 clip-path，動畫跑完之後才收尾，把兩邊
  // 狀態（class、history）都補回正常值，之後其他地方呼叫的 showPage()還是
  // 完全正常運作，不會被這次的特殊轉場影響到。
  function goToTimelineViaCircleReveal(cellEl, cellDate){
    const phoneRect = phoneEl.getBoundingClientRect();
    const cellRect = cellEl.getBoundingClientRect();
    const cx = Math.round(cellRect.left + cellRect.width/2 - phoneRect.left);
    const cy = Math.round(cellRect.top + cellRect.height/2 - phoneRect.top);
    // 半徑取「圓心到畫面四個角落」裡最遠的那個距離，不管點在畫面哪個
    // 位置，圓展開到這個半徑一定能蓋滿整個 #phone。
    const radius = Math.ceil(Math.max(
      Math.hypot(cx, cy),
      Math.hypot(phoneRect.width - cx, cy),
      Math.hypot(cx, phoneRect.height - cy),
      Math.hypot(phoneRect.width - cx, phoneRect.height - cy)
    )) + 4;

    currentDate = cellDate;
    renderTimeline(); // 先把內容準備好，等一下圓圈展開看到的就是正確的那一天

    pageTimeline.classList.remove('pushed', 'pushed-by-month');
    pageTimeline.classList.add('circle-revealing'); // 暫時把時間軸拉到月曆頁上面，圓形範圍才能「蓋在」月曆上面被看到
    pageTimeline.style.clipPath = 'circle(0px at ' + cx + 'px ' + cy + 'px)';
    void pageTimeline.offsetWidth; // 強制 reflow：先讓瀏覽器畫出「半徑 0」這一幀，接下來改的值才會被當成動畫終點來跑 transition
    pageTimeline.style.clipPath = 'circle(' + radius + 'px at ' + cx + 'px ' + cy + 'px)';

    setTimeout(function(){
      // 圓已經展開滿整個畫面了，月曆頁可以收起來、時間軸清乾淨恢復正常狀態。
      // 月曆頁本身的 .page 基礎樣式帶了一個滑動用的 transition，這時候如果
      // 直接拿掉 active，會被那個 transition 接手、自己再滑出去一次
      // （這時候它還疊在時間軸上面，就會看到畫面又向右滑一下）。先關掉
      // 它的 transition、瞬間歸位，就不會有這多餘的第二段動畫了。
      pageMonth.classList.add('no-transition');
      pageMonth.classList.remove('active');
      void pageMonth.offsetWidth; // 強制 reflow，確保上面「關掉 transition」先生效，才不會被瀏覽器優化掉
      pageMonth.classList.remove('no-transition');

      pageTimeline.classList.remove('circle-revealing');
      pageTimeline.style.clipPath = '';
      if(usingRealHistory){
        try{ history.back(); } // 只是為了讓瀏覽器返回鍵/側滑手勢的堆疊維持正確，畫面本身已經手動切好了
        catch(err){ usingRealHistory = false; }
      }
    }, 520);
  }

  function openMonthView(){
    const [y,m] = currentDate.split('-').map(Number);
    monthViewYear = y; monthViewMonth = m-1;
    renderMonthGrid();
    if(usingRealHistory){
      try{
        history.pushState({page:'month'}, '', '#month');
      }catch(err){
        usingRealHistory = false;
      }
    }
    showPage('month');
  }
  document.getElementById('btnOpenMonth').addEventListener('click', openMonthView);
  document.getElementById('btnMonthBack').addEventListener('click', goBackToTimeline);
  document.getElementById('monthPrevBtn').addEventListener('click', function(){
    monthViewMonth--;
    if(monthViewMonth < 0){ monthViewMonth = 11; monthViewYear--; }
    renderMonthGrid();
  });
  document.getElementById('monthNextBtn').addEventListener('click', function(){
    monthViewMonth++;
    if(monthViewMonth > 11){ monthViewMonth = 0; monthViewYear++; }
    renderMonthGrid();
  });

  // 「回到今天」在不同月份時：不要直接跳過去，改成一頁一頁翻過去，
  // 讓使用者感覺得到自己「翻了幾個月」，而不是畫面忽然變成別的月份。
  // dir 沿用 attachSwipeNav 的方向習慣：-1＝往未來翻一頁（滑向左），
  // 1＝往過去翻一頁（滑向右）。
  function animateMonthGridStep(dir, applyMonthChange){
    const w = monthGrid.clientWidth || 300;
    monthGrid.style.transition = 'none';
    monthGrid.style.transform = 'translateX(0)';
    void monthGrid.offsetWidth; // 強制 reflow，確保上面「歸零」先生效
    monthGrid.style.transition = 'transform .15s ease';
    monthGrid.style.transform = 'translateX(' + (dir * w) + 'px)';
    const onSlideOutDone = function(){
      monthGrid.removeEventListener('transitionend', onSlideOutDone);
      monthGrid.style.transition = 'none';
      monthGrid.style.transform = 'translateX(' + (-dir * w) + 'px)';
      applyMonthChange(); // 這裡才真的換月份＋renderMonthGrid()，換的當下格子還在畫面外
      void monthGrid.offsetWidth;
      monthGrid.style.transition = 'transform .15s ease';
      monthGrid.style.transform = 'translateX(0)';
    };
    monthGrid.addEventListener('transitionend', onSlideOutDone);
  }

  function animateMonthGridTo(targetYear, targetMonth){
    const MAX_ANIMATED_STEPS = 6; // 隔太多年的話一頁一頁翻會翻到讓人不耐煩，超過的部分先直接跳過去，只留最後幾步做翻頁動畫
    const curIdx = monthViewYear*12 + monthViewMonth;
    const targetIdx = targetYear*12 + targetMonth;
    let diff = targetIdx - curIdx;
    if(diff === 0) return;

    const dir = diff > 0 ? -1 : 1; // 目標在未來→往左翻；目標在過去→往右翻
    let stepsLeft = Math.abs(diff);

    if(stepsLeft > MAX_ANIMATED_STEPS){
      const skip = stepsLeft - MAX_ANIMATED_STEPS;
      const skippedIdx = curIdx + (diff > 0 ? skip : -skip);
      monthViewYear = Math.floor(skippedIdx/12);
      monthViewMonth = ((skippedIdx%12)+12)%12;
      renderMonthGrid();
      stepsLeft = MAX_ANIMATED_STEPS;
    }

    function stepOnce(){
      if(stepsLeft <= 0) return;
      stepsLeft--;
      animateMonthGridStep(dir, function(){
        monthViewMonth += (dir === -1 ? 1 : -1);
        if(monthViewMonth < 0){ monthViewMonth = 11; monthViewYear--; }
        else if(monthViewMonth > 11){ monthViewMonth = 0; monthViewYear++; }
        renderMonthGrid();
      });
      if(stepsLeft > 0) setTimeout(stepOnce, 150); // 跟 animateMonthGridStep 的位移動畫時長對齊，一頁翻完接著翻下一頁
    }
    stepOnce();
  }

  /* ---------------- 左右滑動翻頁（月曆檢視 + 日期選擇器） ----------------
     兩個地方都是「一個 7 欄的月曆格子容器，上面已經有上一頁／下一頁的
     箭頭按鍵」，滑動手勢其實就是幫使用者按掉那顆箭頭鍵而已，所以這裡
     寫成一個共用的小工具：量測水平拖曳，超過門檻就讓格子容器整個滑出去、
     呼叫對應方向的既有換頁邏輯把內容換掉、再讓新內容從另一側滑回中間。
     沒超過門檻（或其實是想直向捲動格子內的行程清單）就彈回原位，不做
     任何事，原本點格子進某一天、格子內清單直向捲動都不受影響。 */
  function attachSwipeNav(containerEl, onSwipeLeft, onSwipeRight){
    const THRESHOLD = 45; // px，拖曳距離超過這個值（或容器寬度的 1/5，取較大者）才算成功翻頁
    let startX = null, startY = null, axisLocked = null, dragging = false;

    containerEl.style.touchAction = 'pan-y'; // 直向捲動（格子內清單）交給瀏覽器原生處理，水平方向自己攔截

    containerEl.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'mouse' && e.buttons !== 1) return;
      dragging = true; axisLocked = null;
      startX = e.clientX; startY = e.clientY;
      containerEl.style.transition = 'none';
    });

    containerEl.addEventListener('pointermove', function(e){
      if(!dragging || startX == null) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(axisLocked === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
        axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if(axisLocked === 'x'){
        e.preventDefault();
        containerEl.style.transform = 'translateX(' + dx + 'px)';
      }
    });

    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      if(axisLocked !== 'x'){
        containerEl.style.transform = '';
        startX = null; axisLocked = null;
        return;
      }
      const dx = (e.clientX != null ? e.clientX : startX) - startX;
      const w = containerEl.clientWidth || 300;
      const committed = Math.abs(dx) > Math.max(THRESHOLD, w * 0.2);
      containerEl.style.transition = 'transform .22s ease';

      if(committed){
        const dir = dx < 0 ? -1 : 1; // -1：向左滑（下一個），1：向右滑（上一個）
        containerEl.style.transform = 'translateX(' + (dir * w) + 'px)';
        const onSlideOutDone = function(){
          containerEl.removeEventListener('transitionend', onSlideOutDone);
          containerEl.style.transition = 'none';
          containerEl.style.transform = 'translateX(' + (-dir * w) + 'px)';
          if(dir < 0) onSwipeLeft(); else onSwipeRight(); // 這裡才真的換內容，換完時容器還在畫面外
          void containerEl.offsetWidth; // 強制 reflow，確保上面那行 transform 先生效，接下來的滑入才有動畫
          containerEl.style.transition = 'transform .22s ease';
          containerEl.style.transform = 'translateX(0)';
        };
        containerEl.addEventListener('transitionend', onSlideOutDone);
      } else {
        containerEl.style.transform = 'translateX(0)';
      }
      startX = null; axisLocked = null;
    }

    containerEl.addEventListener('pointerup', endDrag);
    containerEl.addEventListener('pointercancel', endDrag);
  }

  attachSwipeNav(monthGrid,
    function(){ document.getElementById('monthNextBtn').click(); }, // 左滑 → 下個月
    function(){ document.getElementById('monthPrevBtn').click(); }  // 右滑 → 上個月
  );
  attachSwipeNav(calGrid,
    function(){ calNextBtn.click(); }, // 左滑 → 下個月
    function(){ calPrevBtn.click(); }  // 右滑 → 上個月
  );
  document.getElementById('btnMonthToday').addEventListener('click', function(){
    const [ty, tm] = todayStr().split('-').map(Number);
    if(monthViewYear === ty && monthViewMonth === tm-1){
      // 已經在今天所在的月份：直接跳今天的時間軸頁面，不用再多點一次格子
      currentDate = todayStr();
      renderTimeline();
      goBackToTimeline();
    } else {
      // 不同月份：用翻頁動畫一頁一頁翻回今天所在的月份，而不是直接跳過去
      animateMonthGridTo(ty, tm-1);
    }
  });

  function showPage(name){
    pageEdit.classList.toggle('active', name === 'edit');
    pageMonth.classList.toggle('active', name === 'month');
    pageTimeline.classList.toggle('pushed', name === 'edit');
    pageTimeline.classList.toggle('pushed-by-month', name === 'month');
    if(name !== 'edit'){
      editingMasterId = null;
      editingInstanceDate = null;
    }
  }

  function goBackToTimeline(){
    if(usingRealHistory){
      try{
        history.back(); // 觸發 popstate -> showPage('timeline')
        return;
      }catch(err){
        usingRealHistory = false;
      }
    }
    showPage('timeline'); // 備援：直接切換，不依賴 History API
  }

  window.addEventListener('popstate', function(e){
    // 手機返回鍵 / 側滑手勢：只退回時間軸主頁，不離開網頁
    showPage('timeline');
  });

  document.getElementById('btnCancel').addEventListener('click', function(){
    goBackToTimeline(); // 不儲存任何變更
  });

  document.getElementById('btnDone').addEventListener('click', function(){
    if(!editingMasterId) return;
    const master = events.find(e => e.id === editingMasterId);
    if(!master) return;

    const newTitle = fieldTitle.value.trim() || '新行程';
    const newNotes = fieldNotes.value;
    const newParticipants = selectedParticipants.size ? Array.from(selectedParticipants) : [columns[0].id];

    // 開始／結束時間各自獨立，直接讀取使用者手動填的值；
    // 只有在結束時間沒填或不晚於開始時間時才做最低限度的保底（開始後5分鐘）
    const newStart = fieldStart.value || master.start;
    let newEnd = fieldEnd.value;
    if(!newEnd || timeToMinutes(newEnd) <= timeToMinutes(newStart)){
      newEnd = minutesToTime(Math.min(24*60, timeToMinutes(newStart) + 5));
    }

    const newWeekdays = Array.from(selectedWeekdays).sort((a,b)=>a-b);
    const wasRecurring = !!master.recurrence;
    const syncOn = fieldSyncEdit.checked;

    // 顏色是整個行程系列共用的分類標籤，不像時間/備註那樣需要區分「只改這一天」，
    // 一律直接寫回本體，不放進 override。
    master.color = selectedColor;

    // 「重複」規則永遠套用到整個系列，跟同步編輯開關無關（單一日期沒有自己的重複規則）
    master.recurrence = newWeekdays.length ? {weekdays:newWeekdays} : null;

    if(!wasRecurring && !master.recurrence){
      // 原本就是單一行程，也沒有設定重複：直接改本體（含日期）
      master.title = newTitle;
      master.date = fieldDate.value || master.date;
      master.start = newStart; master.end = newEnd;
      master.notes = newNotes; master.participants = newParticipants;
    } else if(!wasRecurring && master.recurrence){
      // 這次才剛把單一行程加上重複規則：本體變成系列的 master，
      // date 欄位保持原本的起始日（重複行程時日期欄位是鎖住的，不會被改到）
      master.title = newTitle;
      master.start = newStart; master.end = newEnd;
      master.notes = newNotes; master.participants = newParticipants;
    } else if(syncOn){
      // 同步編輯：套用到整個系列
      master.title = newTitle;
      master.start = newStart; master.end = newEnd;
      master.notes = newNotes; master.participants = newParticipants;
      // 這一天如果原本有獨立編輯過的內容，順便清掉，讓它跟系列同步一致
      if(master.overrides) delete master.overrides[editingInstanceDate];
    } else {
      // 沒開同步編輯：只改這一天，寫入 override，系列其他日期不受影響
      master.overrides = master.overrides || {};
      master.overrides[editingInstanceDate] = {
        title:newTitle, start:newStart, end:newEnd, notes:newNotes, participants:newParticipants
      };
    }

    currentDate = master.recurrence ? editingInstanceDate : master.date;
    renderTimeline();
    goBackToTimeline();
  });

  document.getElementById('btnDelete').addEventListener('click', function(){
    if(!editingMasterId) return;
    showConfirmDialog('確定刪除？', function(){
      const master = events.find(e => e.id === editingMasterId);
      if(!master) return;
      const syncOn = fieldSyncEdit.checked;

      if(!master.recurrence){
        events = events.filter(e => e !== master);
      } else if(syncOn){
        events = events.filter(e => e !== master); // 整個系列都刪除
      } else {
        // 只刪除這一天：加入排除清單，其餘日期的系列不受影響
        master.excluded = master.excluded || [];
        if(master.excluded.indexOf(editingInstanceDate) === -1) master.excluded.push(editingInstanceDate);
        if(master.overrides) delete master.overrides[editingInstanceDate];
      }

      renderTimeline();
      goBackToTimeline();
    }, {danger:true});
  });

  /* ---------------- 初始化 ---------------- */
  try{
    history.replaceState({page:'timeline'}, '', '#timeline');
  }catch(err){
    usingRealHistory = false;
  }
  buildHourRows();
  renderTimeline();

  /* ---------------- 垂直縮放手勢：雙指 pinch ＋ 雙擊快速切換 ----------------
     用 capture 階段監聽 pointerdown/pointermove/pointerup，這樣不管是點在
     空白處還是行程卡片上（子元素自己的 pointerdown 通常會 stopPropagation），
     都一定能偵測到「現在有幾根手指按著」，藉此判斷雙指 pinch 是否開始。
     一旦偵測到第二根手指按下，就把 pinchActive 設成 true，讓其他單指手勢
     （拖曳搬移、調整時長、長按新增行程）在各自的 pointerdown/onMove 裡
     自動略過（見前面幾處 `if(pinchActive) return;`）。 */
  (function(){
    const activePointers = new Map(); // pointerId -> {x, y}，縮放期間持續更新，用來算兩指距離
    let pinchStartDist = 0;
    let pinchStartHourPx = HOUR_PX_DEFAULT;

    function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
    function currentTwoPoints(){
      const pts = Array.from(activePointers.values());
      return pts.length >= 2 ? [pts[0], pts[1]] : null;
    }

    timelineScroll.addEventListener('pointerdown', function(e){
      activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(activePointers.size === 2){
        const [p1, p2] = currentTwoPoints();
        pinchActive = true;
        pinchStartDist = dist(p1, p2) || 1;
        pinchStartHourPx = hourPx;
        closeCardMenu();
        closeClusterMenu();
        stopMomentumScroll();
      }
    }, true);

    // setHourPx() 內部會整個重繪所有行程卡片並觸發存檔，pinch 手勢的 pointermove
    // 完全沒有節流的話，手指移動快時可能一秒觸發幾十次「整個重繪＋存檔」。這裡
    // 改成只記錄最新目標值，用 requestAnimationFrame 節流成每影格只真正呼叫一次。
    let pinchZoomRAF = null, pendingPinchTarget = null, pendingPinchMidY = null;
    function flushPinchZoom(){ // 手指放開/取消時要立刻套用最新目標值，確保縮放最終結果準確
      if(pinchZoomRAF){ cancelAnimationFrame(pinchZoomRAF); pinchZoomRAF = null; }
      if(pendingPinchTarget != null){ setHourPx(pendingPinchTarget, pendingPinchMidY); pendingPinchTarget = null; }
    }

    timelineScroll.addEventListener('pointermove', function(e){
      if(!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(!pinchActive || activePointers.size < 2) return;
      const [p1, p2] = currentTwoPoints();
      const curDist = dist(p1, p2) || 1;
      const midY = (p1.y+p2.y)/2;
      pendingPinchTarget = pinchStartHourPx * (curDist / pinchStartDist);
      pendingPinchMidY = midY;
      if(pinchZoomRAF) return;
      pinchZoomRAF = requestAnimationFrame(function(){
        pinchZoomRAF = null;
        if(pendingPinchTarget != null){ setHourPx(pendingPinchTarget, pendingPinchMidY); pendingPinchTarget = null; }
      });
    }, true);

    timelineScroll.addEventListener('pointerup', function(e){
      activePointers.delete(e.pointerId);
      downPositions.delete(e.pointerId);
      if(activePointers.size < 2){ pinchActive = false; flushPinchZoom(); }
    }, true);

    timelineScroll.addEventListener('pointercancel', function(e){
      activePointers.delete(e.pointerId);
      downPositions.delete(e.pointerId);
      if(activePointers.size < 2){ pinchActive = false; flushPinchZoom(); }
    }, true);
  })();

  // 開場自動捲到「現在時間線」的位置，讓那條線落在可視範圍由上往下 1/3
  // 的地方；如果現在時間太晚，往下捲會超過畫面底部，夾限會自動讓它
  // 停在捲動範圍的最底端，不會硬要維持在 1/3 處造成過捲。
  function scrollToNowLine(){
    if(currentDate !== todayStr()){
      timelineScroll.scrollTop = TIMELINE_BUFFER_PX + 7*hourPx; // 不是今天就沒有「現在時間線」，退回原本的預設位置
      return;
    }
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const nowTopPx = TIMELINE_BUFFER_PX + nowMin/60*hourPx;
    const visibleHeight = timelineScroll.clientHeight;
    let target = nowTopPx - visibleHeight/3;
    const maxScroll = Math.max(0, timelineScroll.scrollHeight - timelineScroll.clientHeight);
    target = Math.max(0, Math.min(maxScroll, target));
    timelineScroll.scrollTop = target;
  }
  scrollToNowLine();

  // 每分鐘更新一次「現在時間」紅線
  setInterval(renderNowLine, 60*1000);

})();
</script>
