<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>手帳曆 · 共編行事曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4;
    --paper-deep:#EFE8D6;
    --line:#DBD0B4;
    --line-soft:#E8E0CC;
    --ink:#20263A;
    --ink-soft:#5B6178;
    --ink-faint:#96876F; /* 低飽和度咖啡色，取代原本偏藍灰的淡字色 */
    --red:#B23A2F;
    --red-deep:#8E2C24;
    --card:#FFFDF8;
    --shadow:rgba(32,38,58,0.16);
    --gold:#C08A2E;
    --sage:#7C8F6A;
    --dusk:#6E7FA3;
    --blush:#C77B6C;
    --hour-px:50; /* 每小時的高度（px，不含單位），縮放時由 JS 更新這個變數，
                     所有跟每小時高度成比例的地方（格線、卡片容器）都跟著變 */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* 按下去的反饋（變暗/變色）統一補上漸變時間，不要瞬間切換。快速點一下
     的話，沒有 transition 的話變化常常只閃過一兩個 frame，很容易感覺不到；
     有了漸變，即使放開得快，退回原本樣子的過程也會被看見，反饋自然更
     明顯、有停留感。 */
  .add-col-btn, .select-toggle-btn, .select-delete-btn, .select-move-btn,
  .date-display, .fab, .month-fab, .undo-redo-btn, .date-value-btn,
  .time-value-btn, .picker-nav-btn, .picker-cal-cell, .picker-today-btn,
  .picker-confirm-btn, .picker-cancel-btn, .picker-confirm-ok-btn,
  .picker-confirm-cancel-btn, .month-back-btn, .month-today-btn, .month-cell{
    transition:opacity .16s ease, background-color .16s ease, filter .16s ease;
  }
  /* 整個介面預設不能被框選文字，這是像手機 App 一樣操作的關鍵：
     手指誤觸不會選到文字。雙擊/雙指縮放已經靠 viewport 的
     user-scalable=no 擋掉了，這裡刻意不再疊加 touch-action:manipulation——
     那樣會讓瀏覽器提早搶走垂直滑動的判斷權，害長按拖曳（移動行程、
     空白處拉框建立行程）的 400ms 判斷來不及生效，整個被當成頁面捲動。
     真正需要輸入文字的欄位（文字框、日期、時間、數字、多行備註）
     則保留正常的選取/游標行為，不然沒辦法編輯內容。 */
  html, body{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  input, textarea{
    -webkit-user-select:text; user-select:text;
    -webkit-touch-callout:default;
  }
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0;
    background:#DDD5C0;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100%;
    position:fixed;
    inset:0;
    width:100%;
  }
  #phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    min-height:100dvh; /* iOS Safari 的網址列會動態伸縮，100vh 是「網址列全收合」時的高度，
                           比實際看到的畫面還高，會讓整個 #phone 變得比可視區域高，
                           進而讓整個頁面（不是時間軸內部）被拖著捲動——這正是使用者
                           反應「日期列上方可以往下滑、捲到底時 23:00 後面留白跟右下角
                           鉛筆按鈕都看不到」的原因：#phone 整體被推出畫面外了，不是
                           時間軸緩衝區本身的問題。100dvh 會跟著網址列即時調整，把
                           #phone 鎖在實際看得到的範圍內。舊版 Safari 不支援 100dvh 時
                           這行會被忽略，自動退回上面的 100vh。 */
    background:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,0.35);
  }
  @media (min-width:431px){
    body{padding:28px 0;}
    #phone{min-height:860px; border-radius:28px; box-shadow:0 30px 70px rgba(20,20,30,0.45);}
  }

  .page{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    background:var(--paper);
    transform:translateX(0);
    transition:transform .32s cubic-bezier(.4,0,.2,1), opacity .32s ease;
  }
  .page.hidden{visibility:hidden; pointer-events:none;}
  #page-edit{transform:translateX(100%);}
  #page-edit.active{transform:translateX(0);}
  #page-month{transform:translateX(100%);}
  #page-month.active{transform:translateX(0);}
  #page-timeline.pushed{transform:translateX(-18%); filter:brightness(0.9);}
  #page-timeline.pushed-by-month{transform:translateX(-18%); filter:brightness(0.9);}
  #page-timeline.circle-revealing{
    z-index:20; /* 蓋到月曆頁（DOM 順序在後、預設疊在時間軸上面）之上，圓形範圍才看得到 */
    transform:translateX(0); filter:none; /* 立刻歸位、不要滑動或變暗，只有 clip-path 這個圓在動 */
    transition:clip-path .5s ease, transform 0s, filter 0s;
  }
  .page.no-transition{transition:none !important;}

  /* ---------- Timeline page ---------- */
  .planner-header{
    padding:16px 20px 14px 20px;
    display:flex; flex-direction:column; gap:12px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:relative;
    z-index:3;
  }
  .date-center-nav{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    min-height:44px;
  }
  .add-col-btn{
    position:absolute;
    right:0; top:50%;
    transform:translateY(-50%);
    padding:7px 10px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .add-col-btn svg{flex:0 0 auto;}
  .add-col-btn:active{opacity:.6;}
  /* 「選取」控制項：跟右側新增共編者按鍵左右對稱（left:0 對 right:0，
     同樣的 top:50% + translateY(-50%) 垂直置中），viewport 邊界間距一致。
     內含「選取／×」切換鍵本身，以及只有在選取狀態下才出現的垃圾桶鍵。
     造型先跟新增共編者按鍵同款（黑色圓角長方形），之後再依需求微調。 */
  .select-controls{
    position:absolute;
    left:0; top:50%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .select-toggle-btn{
    height:30px;
    padding:0 14px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.02em;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .select-toggle-btn:active{opacity:.6;}
  .select-toggle-btn.active{
    background:var(--red);
    border-color:var(--red);
  }
  .select-right-controls{
    position:absolute;
    right:0; top:50%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .select-delete-btn{
    height:30px;
    padding:0 10px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .select-delete-btn svg{flex:0 0 auto;}
  .select-delete-btn:active{opacity:.6;}
  .select-delete-btn[hidden]{display:none;}
  #phone.select-mode-active .fab,
  #phone.select-mode-active .add-col-btn,
  #phone.select-mode-active .undo-redo-stack{
    display:none;
  }
  /* 「移動」鍵：跟「選取」鍵放在同一個 .select-controls 群組裡（左側），
     大小/字體比照左側「選取」鍵（.select-toggle-btn），維持整排按鍵
     視覺一致。預設用 [hidden] 隱藏，只有選取模式中且至少勾選一個
     行程時才由 JS 拿掉 hidden。 */
  .select-move-btn{
    height:30px;
    padding:0 8px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.02em;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .select-move-btn:active{opacity:.6;}
  .select-move-btn[hidden]{display:none;}
  .date-display{
    position:relative;
    text-align:center;
    min-width:150px;
    padding:5px 14px;
    /* 白色實心底板，襯出「嵌在螢幕裡」的感覺 */
    background:#FFFFFF;
    border-radius:10px;
    border:2px solid transparent; /* 預留邊框粗細，是今天時只換顏色，不會因為邊框出現/消失而跳動 */
    box-shadow:inset 0 1px 4px rgba(32,38,58,0.18), 0 1px 0 rgba(255,255,255,0.6);
    overflow:hidden;
  }
  .date-display.is-today{
    border-color:var(--red);
  }
  .date-display:active{opacity:.6;}
  .date-content{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    width:100%;
  }
  .date-content-preview{
    position:absolute;
    top:6px; left:14px; right:14px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    pointer-events:none;
  }
  .date-display.animating .date-content,
  .date-display.animating .date-content-preview{
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  .date-display .weekday{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.12em;
    color:var(--ink-faint);
  }
  .date-display .date-num{
    display:block;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:17px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  /* 疊在日期文字上的原生日期輸入框：本身完全透明，但可以點擊/觸控，
     點下去就會跳出手機/瀏覽器內建的日期選擇器，選完直接換日。 */
  .date-picker-input{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    opacity:0;
    border:none;
    padding:0; margin:0;
    cursor:pointer;
    -webkit-appearance:none;
  }

  .timeline-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;
    touch-action:pan-y;
    overscroll-behavior:contain;
  }
  .day-slider{
    position:relative;
    /* 24 小時本體高度 + 上下各 110px 緩衝，讓 00:00/24:00 附近能捲離畫面邊緣。
       這裡直接算進 day-slider 自己的高度（真正的版面內容），不是用 timeline-scroll
       的 padding 做——捲動容器的 padding-bottom 在部分瀏覽器不會確實算進可捲動範圍，
       是常見的跨瀏覽器相容性陷阱。這個 220px（=上下各110px）要跟 JS 裡的
       TIMELINE_BUFFER_PX 保持一致，改其中一邊記得另一邊也要跟著改。 */
    height:calc(var(--hour-px) * 24px + 220px);
    overflow-x:hidden;
  }
  .timeline-grid, .day-preview-panel{
    position:absolute;
    top:110px; left:0; right:16px;
    height:calc(var(--hour-px) * 24px);
    will-change:transform;
  }
  .timeline-grid{
    touch-action:none;
  }
  .day-preview-panel{
    pointer-events:none; /* 純預覽用，滑動中不可互動 */
  }
  .day-slider.animating .timeline-grid,
  .day-slider.animating .day-preview-panel{
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  .margin-rule{
    position:absolute;
    top:0; bottom:0;
    left:52px;
    width:1.5px;
    background:var(--red);
    opacity:.55;
    z-index:1;
  }
  .hour-row{
    position:absolute;
    left:0; right:0;
    height:calc(var(--hour-px) * 1px);
    border-top:1px solid var(--line-soft);
  }
  .hour-row:first-child{border-top:none;}
  .hour-row .hlabel{
    position:absolute;
    left:6px; top:-7px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    background:var(--paper);
    padding:0 3px;
  }
  .hour-row .half-tick{
    position:absolute;
    left:52px; right:0; top:calc(var(--hour-px) * 0.5px);
    border-top:1px dashed var(--line);
    opacity:.7;
  }
  .hour-row .quarter-tick{
    position:absolute;
    left:52px; right:0;
    border-top:1px dotted var(--line);
    opacity:.4;
  }
  .now-line{
    position:absolute;
    left:52px; right:0;
    height:0;
    border-top:2px solid var(--red);
    z-index:4;
  }
  .now-line::before{
    content:"";
    position:absolute;
    left:-4px; top:-4px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--red);
  }
  .events-layer{
    position:absolute; inset:0;
    left:58px; right:14px;
    z-index:2;
  }
  .event-card{
    position:absolute;
    left:0; right:0;
    min-height:8px;
    touch-action:none;
    background:var(--ecard-color, var(--card));
    border-radius:8px;
    box-shadow:0 2px 6px var(--shadow);
    padding:5px 10px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    user-select:none;
  }
  /* 新建立的行程卡片：像捲軸攤開一樣，頂部邊緣固定不動，可見範圍從 0
     長到完整高度。這裡故意用 clip-path 而不是真的去改 height——真正的
     height 從卡片一出現就已經是最終值，JS 那邊量測「文字裝不裝得下」
     （決定要不要拿掉備註、時間，甚至縮小字體）全部依賴這個最終 height，
     動畫如果真的從 0 開始長高，量出來的高度會一路是錯的，文字排版判斷
     會整個亂掉。clip-path 只影響「看得到多少」，不影響版面計算，卡片
     的真實尺寸/排版全程維持最終結果，視覺上一樣是由上往下展開。
     只在建立當下那一次渲染套用（見 JS 的 justCreatedEventId），動畫
     結束就把這個 class 拿掉，之後任何其他重繪都不會再帶到這個過渡效果。 */
  .event-card.card-unfurl{
    clip-path:inset(0 0 100% 0);
    transition:clip-path .32s cubic-bezier(.16,1,.3,1), transform .15s ease, box-shadow .15s ease;
  }
  .event-card.card-unfurl.card-unfurl-open{
    clip-path:inset(0 0 0% 0);
  }
  .event-card .ecard-title{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--ecard-text, var(--ink));
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .event-card .ecard-time{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    color:var(--ecard-text-soft, var(--ink-soft));
    margin-top:1px;
  }
  .event-card .ecard-notes{
    font-family:'Noto Sans TC', sans-serif;
    font-size:9.5px;
    line-height:1.35;
    color:var(--ecard-text-soft, var(--ink-soft));
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    word-break:break-word;
  }
  /* 格子小到只剩標題一行時，讓標題在格子裡「垂直置中、水平靠左」，
     不要用預設文字排版那種貼在上緣（字體縮小後看起來像貼在下緣）的
     錨點方式。 */
  .event-card.title-only{
    display:flex;
    align-items:center;
  }
  .event-card.title-only .ecard-title{
    width:100%;
  }
  .event-card .resize-handle::after{background:var(--ecard-handle-color, var(--ecard-color, var(--gold)));}
  /* 選取狀態：拖曳圓點收起（避免跟選取手勢打架）。進入選取模式時維持
     行程原本的顏色，只有實際被勾選的那一項才變灰；沒有權限選取的
     行程則疊上半透明淡出、無法點擊。 */
  .event-card.select-mode .resize-handle{display:none;}
  .event-card.select-picked{
    background:#CBCDD4 !important;
  }
  .event-card.select-picked .ecard-title,
  .event-card.select-picked .ecard-time,
  .event-card.select-picked .ecard-notes{
    color:#4B5066;
  }
  .event-card.select-locked{
    opacity:.4;
    cursor:not-allowed;
  }
  .event-card.dragging{
    transform:scale(1.04);
    box-shadow:0 10px 26px var(--shadow);
    z-index:10;
  }
  .event-card.resizing{
    box-shadow:0 10px 26px var(--shadow);
    z-index:12;
  }
  .event-card.card-tapped-feedback{
    filter:brightness(0.82);
    transition:filter .1s ease;
  }
  .resize-handle{
    position:absolute;
    width:36px; height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    z-index:13;
  }
  .resize-handle.rh-tl{ left:-13px; top:-13px; cursor:nw-resize; }
  .resize-handle.rh-tr{ right:-13px; top:-13px; cursor:ne-resize; }
  .resize-handle.rh-bl{ left:-13px; bottom:-13px; cursor:sw-resize; }
  .resize-handle.rh-br{ right:-13px; bottom:-13px; cursor:se-resize; }
  .resize-handle::after{
    content:"";
    display:block;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--ecard-handle-color, var(--ink));
    border:2.5px solid var(--paper);
    opacity:0;
    transform:scale(.4);
    transition:opacity .12s ease, transform .12s ease;
  }
  /* 平常隱形，手指按下格子角落的那一刻（不用等長按判定完成）先給觸控回饋，
     真正進入縮放狀態（長按 400ms 判定通過）後再放大一級，跟原本單一把手
     的手感一致。 */
  .resize-handle.touched::after{
    opacity:1;
    transform:scale(1);
  }
  .resize-handle.active::after{
    opacity:1;
    transform:scale(1.55);
  }

  /* 長按拖曳行程時的浮動卡片：脫離欄位的百分比定位系統，直接用
     position:fixed 跟著手指座標走，可以自由跨欄、跨日移動，
     不會被卡在固定的欄位位置上。 */
  .card-ghost{
    position:fixed !important;
    right:auto !important;
    z-index:2; /* 故意比 .planner-header 跟 .column-header-row 低（見下方），
                  拖曳經過畫面上方時卡片會滑到日期列／使用者欄位「後面」，
                  不會蓋住那兩排固定的介面。 */
    pointer-events:none;
    box-shadow:0 14px 30px rgba(32,38,58,0.38);
    transform:scale(1.06);
    opacity:0.97;
  }
  .card-ghost .resize-handle{ display:none; }

  /* 長按行程卡片（不拖動）跳出的「複製／刪除」快捷選單 */
  .card-menu{
    position:fixed;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow:visible;
    z-index:1000;
  }
  /* 只有標題被縮小過字體的行程，長按時才會多這一行，直接顯示完整
     名稱，不用再多點一次按鈕。 */
  .card-menu-title-row{
    background:var(--ink);
    color:var(--paper);
    border-radius:11px;
    padding:10px 16px;
    max-width:240px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
    font-weight:700;
    line-height:1.4;
    word-break:break-word;
    box-shadow:0 10px 24px rgba(32,38,58,0.4);
  }
  .card-menu-actions{
    display:flex;
    background:var(--ink);
    border-radius:11px;
    box-shadow:0 10px 24px rgba(32,38,58,0.4);
    overflow:hidden;
  }
  .card-menu-actions button{
    border:none;
    background:none;
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;
    font-weight:700;
    padding:11px 18px;
    cursor:pointer;
    white-space:nowrap;
  }
  .card-menu-actions button + button{
    border-left:1px solid rgba(246,241,228,0.22);
  }
  .card-menu-actions button:active{background:rgba(246,241,228,0.14);}
  .card-menu-actions button.danger{color:#F4B8AA;}
  .card-menu.arrow-down::after,
  .card-menu.arrow-up::after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    border-width:6px 6px 0 6px;
    border-style:solid;
    border-color:var(--ink) transparent transparent transparent;
  }
  .card-menu.arrow-down::after{ bottom:-6px; }
  .card-menu.arrow-up::after{ top:-6px; transform:translateX(-50%) rotate(180deg); }

  /* 好幾個很短、緊挨在一起的行程：各自的浮動標籤會疊在一起沒辦法辨識，
     這種情況乾脆合併成一個「N 項行程」提示，點下去才展開清單。
     清單本身的視覺跟長按選單（.card-menu）同一套語彙，只是改成直向排列。 */
  .event-card .ecard-solo.ecard-cluster{
    pointer-events:auto;
    cursor:pointer;
    color:var(--paper);
    background:var(--red);
  }
  .cluster-menu{
    position:fixed;
    display:flex;
    flex-direction:column;
    background:var(--ink);
    border-radius:11px;
    box-shadow:0 10px 24px rgba(32,38,58,0.4);
    overflow:hidden;
    z-index:1000;
    min-width:180px;
    max-width:min(280px, 84vw);
  }
  .cluster-menu-title{
    color:var(--ink-faint);
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:10px 14px 4px;
  }
  .cluster-menu button{
    border:none;
    background:var(--item-bg, var(--ink));
    color:var(--item-text, var(--paper));
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;
    font-weight:700;
    padding:10px 14px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:baseline;
    gap:8px;
    white-space:nowrap;
    overflow:hidden;
  }
  .cluster-menu button span.cluster-title{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1 1 auto;
    min-width:0;
  }
  .cluster-menu button span.cluster-time{
    flex:0 0 auto;
    font-weight:600;
    font-size:14px;
    color:var(--item-text-soft, var(--ink-faint));
  }
  .cluster-menu button:active{filter:brightness(0.92);}
  .cluster-menu button + button{border-top:1px solid rgba(255,255,255,0.22);}
  /* 進入選取模式時維持行程原本的顏色，只有實際被勾選的那一項才變灰
     （跟時間軸上的卡片邏輯一致：選取狀態本身不改變顏色，勾選才改變）。 */
  .cluster-menu button.selected{
    background:#CBCDD4 !important;
    color:#4B5066;
  }
  .cluster-menu button.selected span.cluster-time{
    color:#6B7086;
  }
  .cluster-menu button.locked{
    opacity:.4;
    cursor:not-allowed;
  }

  /* 時長 < 45 分鐘：高度放不下兩行，標題與時間改成同一行並排 */
  .event-card.compact{
    display:flex;
    align-items:center;
    padding:2px 9px;
  }
  .event-card.compact .ecard-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    min-width:0;
    width:100%;
    overflow:hidden;
    white-space:nowrap;
  }
  .event-card.compact .ecard-row .ecard-title{
    flex:0 1 auto;
    min-width:0;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .event-card.compact .ecard-row .ecard-time{
    flex:0 0 auto;
    margin:0;
  }

  /* 好幾個緊挨在一起、疊到快分不清的行程，合併顯示成一個「N 項行程」
     浮動提示，點下去才展開完整清單，點清單裡的項目就直接跳去那個行程的
     編輯頁（跟平常點行程卡片一樣）。格子本身留一條乾淨的色塊當作這段
     時間的視覺提示即可。 */
  .event-card.label-floated{
    overflow:visible;
    padding:0;
  }
  .event-card .ecard-solo{
    position:absolute;
    left:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:11px;
    line-height:1.3;
    color:var(--ecard-text, var(--paper));
    background:var(--ecard-color, var(--ink));
    padding:3px 8px;
    border-radius:8px;
    box-shadow:0 3px 8px rgba(32,38,58,0.32);
    z-index:6;
    pointer-events:none; /* 純顯示用，點擊要穿透到底下的色塊，不擋原本的卡片互動 */
  }
  .event-card.float-above .ecard-solo{ bottom:calc(100% + 4px); }
  .event-card.float-below .ecard-solo{ top:calc(100% + 4px); }

  .fab{
    position:absolute;
    right:16px; bottom:22px;
    width:auto; height:auto;
    padding:10px;
    border-radius:12px;
    background:none;
    color:var(--ink);
    border:none;
    box-shadow:none;
    filter:drop-shadow(0 3px 6px rgba(32,38,58,0.28));
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:5;
  }
  .fab:active{opacity:.6;}
  .month-fab{
    left:16px; right:auto; /* 跟右下角鉛筆鍵鏡像，蓋在時間軸左側的時間刻度欄上面 */
    width:46px; height:46px;
    padding:0;
    border-radius:50%;
    background:var(--paper); /* 跟整個行事曆的紙面背景同色 */
    filter:none; /* 改用下面的 box-shadow 做陰影，不用 .fab 原本那種只描邊圖示的 drop-shadow */
    box-shadow:0 4px 12px rgba(32,38,58,0.32);
  }
  .month-fab:active{opacity:.7;}

  .undo-redo-stack{
    position:absolute;
    right:16px; bottom:84px; /* 鉛筆鍵(bottom:22px + 約52px高) 再加一點間距 */
    display:flex; flex-direction:column;
    gap:10px;
    z-index:5;
  }
  .undo-redo-btn{
    width:40px; height:40px;
    padding:0;
    border-radius:12px;
    border:none;
    background:none;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    filter:drop-shadow(0 3px 6px rgba(32,38,58,0.28));
  }
  .undo-redo-btn:active{opacity:.6;}
  .undo-redo-btn:disabled{
    color:var(--ink-faint);
    opacity:.5;
    cursor:default;
    filter:none;
  }

  .selection-box{
    position:absolute;
    left:58px; right:14px;
    background:rgba(178,58,47,0.12);
    border:1.5px dashed var(--red);
    border-radius:6px;
    z-index:6;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .selection-box .selection-label{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:11px;
    color:var(--red-deep);
    background:var(--paper);
    padding:2px 8px;
    border-radius:10px;
    white-space:nowrap;
  }
  .selection-box.no-room{
    background:rgba(120,120,120,0.14);
    border-color:var(--ink-faint);
  }
  .selection-box.no-room .selection-label{
    color:var(--ink-faint);
    font-size:13px;
  }

  .column-header-row{
    display:flex;
    padding:10px 14px 8px 58px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    gap:0;
    position:relative;
    z-index:3; /* 跟 .planner-header 同一層，兩者都要蓋在拖曳中的 .card-ghost（z-index:2）上面 */
  }
  .column-header-row .col-head{
    flex:1 1 0;
    min-width:0;
    text-align:center;
    padding:0 4px;
  }
  .col-head .col-name{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .col-head .col-name.col-name-editable{
    cursor:pointer;
    border:1.5px solid var(--gold);
    border-radius:6px;
    padding:2px 7px;
    /* 一定要設，不然手指按著不放的過程中只要有一點點自然的手震，瀏覽器
       就可能把它判定成「使用者想捲動」而觸發原生的捲動接管，接管當下
       會對這個元素丟出 pointercancel，把我們自己計時中的長按判斷整組
       取消掉——長按永遠等不到 500ms，摸起來就像完全沒反應。 */
    touch-action:none;
  }
  .col-head .col-name.col-name-editable:active{
    opacity:.6;
  }

  /* 選取狀態下，欄位標題也是可點擊的選取對象：自己的欄位可以點擊圈選，
     別人的欄位變半透明表示不可操作；圈選後整欄（含標題）都會出現灰底。 */
  .col-head.select-pickable{cursor:pointer;}
  .col-head.select-locked{opacity:.4; cursor:not-allowed;}
  .col-head.select-picked{
    background:rgba(91,97,120,0.22);
    border-radius:8px;
  }
  .col-head.select-picked .col-name{color:var(--ink-soft);}
  /* 整欄由上到下的灰底，畫在 col-dividers 這層（在格線之上、行程卡之下） */
  .col-select-band{
    position:absolute;
    top:0; bottom:0;
    background:rgba(91,97,120,0.16);
    pointer-events:none;
  }

  .col-dividers{
    position:absolute;
    inset:0;
    left:58px; right:14px;
    z-index:1;
    pointer-events:none;
  }
  .col-dividers .col-div-line{
    position:absolute;
    top:0; bottom:0;
    width:1px;
    background:var(--line);
    opacity:.8;
  }

  .hint-empty{
    /* 改成 sticky 而不是釘死在內容座標的 top:14px——events-layer 跟時間軸
       內容一樣高（24 小時），原本 top:14px 只在捲到最上面時看得到，往下
       捲一點提示文字就整個滾出畫面外。sticky + top:50% + translateY(-50%)
       這組合會讓它跟著可視範圍走，不管使用者捲到哪一段時間，提示永遠
       浮在目前看得到的範圍正中央。 */
    position:sticky;
    top:50%;
    transform:translateY(-50%);
    font-size:13px; color:var(--ink-faint);
    font-family:'JetBrains Mono', monospace;
    text-align:center;
    pointer-events:none;
  }

  /* ---------- Edit page ---------- */
  .edit-header{
    padding:20px 16px 16px 16px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .edit-title-label{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:.18em;
    color:var(--ink-faint);
  }
  .text-btn{
    background:none; border:none;
    font-family:'Noto Sans TC', sans-serif;
    font-size:14.5px;
    color:var(--ink-soft);
    padding:6px 4px;
    cursor:pointer;
  }
  .text-btn.primary{
    color:#fff;
    background:var(--red);
    border-radius:20px;
    padding:7px 18px;
    font-weight:700;
  }
  .text-btn.primary:active{background:var(--red-deep);}
  .text-btn:active{color:var(--ink);}

  .edit-body{
    flex:1;
    overflow-y:auto;
    padding:22px 20px 40px 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  .field input[type=text],
  .field input[type=date],
  .field textarea{
    font-family:'Noto Serif TC', serif;
    font-size:17px;
    color:var(--ink);
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    padding:6px 2px 10px 2px;
    outline:none;
    width:100%;
  }
  .field input:focus-visible,
  .field textarea:focus-visible,
  .time-trio input:focus-visible{
    outline:none;
    border-bottom-color:var(--red);
  }
  .field textarea{
    font-family:'Noto Sans TC', sans-serif;
    font-size:14.5px;
    line-height:1.7;
    resize:vertical;
    border:1px dashed var(--line);
    border-radius:8px;
    padding:12px;
    background:var(--card);
  }

  .ticket{
    display:flex;
    background:var(--card);
    border-radius:12px;
    box-shadow:0 2px 8px var(--shadow);
    position:relative;
    overflow:visible;
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:16px; height:16px;
    background:var(--paper);
    border-radius:50%;
  }
  .ticket::before{left:-8px;}
  .ticket::after{right:-8px;}
  .time-trio{
    display:flex;
    width:100%;
    padding:14px 16px;
  }
  .time-trio .tcell{
    flex:1;
    display:flex; flex-direction:column; gap:6px;
    position:relative;
  }
  .time-trio .tcell + .tcell{
    margin-left:12px;
    padding-left:12px;
    border-left:1px dashed var(--line);
  }
  .time-trio label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  .time-trio input{
    border:none;
    background:transparent;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    padding:2px 0;
    width:100%;
  }
  .time-trio input[type=number]{
    -moz-appearance:textfield;
  }

  /* 取代原生 input[type=date] 的日期欄位按鍵，樣式照抄原本 .field
     input[type=date] 的排版（Noto Serif TC、底線），行程編輯頁「日期」
     那一列用。 */
  .date-value-btn{
    display:block;
    font-family:'Noto Serif TC', serif;
    font-size:17px;
    color:var(--ink);
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    padding:6px 2px 10px 2px;
    outline:none;
    width:100%;
    text-align:left;
    cursor:pointer;
  }
  .date-value-btn:active{opacity:.6;}
  .date-value-btn.disabled{
    color:var(--ink-faint);
    font-size:20px;
    pointer-events:none;
  }
  /* 取代原生 input[type=time] 的時間欄位按鍵，樣式照抄原本 .time-trio
     input。 */
  .time-value-btn{
    display:block;
    border:none;
    background:transparent;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    padding:2px 0;
    width:100%;
    text-align:left;
    cursor:pointer;
  }
  .time-value-btn:active{opacity:.6;}

  /* ---------------- 自訂日期／時間選擇器（見 #pickerOverlay） ----------------
     從畫面底部滑出的紙感卡片，取代原生 iOS 選擇器。日期一律點選即刻套用
     （跟原生日期選擇器選完馬上換日的手感一致，不用再按一次確定）；
     時間因為要選「時＋分」兩個值，才保留一個「確定」鍵。 */
  .picker-overlay{
    position:absolute; inset:0;
    z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .picker-overlay[hidden]{display:none;}
  .picker-backdrop{
    position:absolute; inset:0;
    background:rgba(32,38,58,0.42);
  }
  .picker-sheet{
    position:relative;
    width:100%;
    background:var(--paper);
    border-radius:20px 20px 0 0;
    box-shadow:0 -10px 30px rgba(32,38,58,0.28);
    padding:20px 20px calc(14px + env(safe-area-inset-bottom, 0px)) 20px;
    display:flex; flex-direction:column; gap:14px;
    animation:picker-sheet-in .22s ease;
  }
  @keyframes picker-sheet-in{
    from{ transform:translateY(28px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  /* 關閉時往下滑走消失，不管是取消、按確定、還是選好日期，統一都是這個
     動畫，不會有「畫面忽然跳掉」的感覺。 */
  .picker-sheet.closing{
    animation:picker-sheet-out .22s ease forwards;
  }
  @keyframes picker-sheet-out{
    from{ transform:translateY(0); opacity:1; }
    to{ transform:translateY(100%); opacity:0; }
  }
  .picker-cal-head{
    display:flex; align-items:center; justify-content:space-between;
  }
  .picker-nav-btn{
    width:32px; height:32px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:17px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .picker-nav-btn:active{opacity:.6;}
  .picker-cal-title{
    display:flex; align-items:baseline; gap:6px;
  }
  .picker-cal-title .picker-cal-year{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:var(--ink-faint);
  }
  .picker-cal-title .picker-cal-month{
    font-family:'Noto Serif TC', serif;
    font-size:19px;
    font-weight:700;
    color:var(--ink);
  }
  .picker-cal-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    text-align:center;
    letter-spacing:.03em;
  }
  .picker-cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    row-gap:2px;
  }
  .picker-cal-cell{
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:var(--ink);
    border-radius:50%;
    cursor:pointer;
  }
  .picker-cal-cell.empty{ cursor:default; }
  .picker-cal-cell.today{ color:var(--red); font-weight:700; }
  .picker-cal-cell.selected{
    background:var(--gold);
    color:var(--paper);
    font-weight:700;
  }
  .picker-cal-cell.selected.today{
    background:var(--red); /* 選到的日期剛好是今天：直接用今天的紅色就好，不用金色再疊一層 */
  }
  .picker-cal-cell:active{opacity:.6;}
  .picker-today-btn{
    align-self:center;
    margin-top:10px;
    padding:5px 14px; /* 縮小約 20% */
    border-radius:9px;
    border:1.5px solid var(--red);
    background:none;
    color:var(--red);
    font-family:'Noto Sans TC', sans-serif;
    font-size:11.5px; /* 縮小約 20% */
    font-weight:700;
    cursor:pointer;
  }
  .picker-today-btn:active{opacity:.6;}

  .picker-time-title{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:.14em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  .picker-time-wheels{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    gap:8px;
    height:200px;
  }
  .picker-wheel{
    height:200px;
    width:76px;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:80px 0;
  }
  .picker-wheel::-webkit-scrollbar{display:none;}
  .picker-wheel-item{
    height:40px;
    display:flex; align-items:center; justify-content:center;
    scroll-snap-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:19px;
    color:var(--ink-faint);
  }
  .picker-wheel-item.picked{
    color:var(--ink);
    font-weight:700;
    font-size:24px;
  }
  .picker-wheel-colon{
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    font-weight:700;
    color:var(--ink);
  }
  .picker-wheel-highlight{
    position:absolute;
    left:10px; right:10px; top:50%;
    transform:translateY(-50%);
    height:40px;
    border-top:1.5px solid var(--line);
    border-bottom:1.5px solid var(--line);
    pointer-events:none;
  }
  .picker-confirm-btn{
    padding:12px;
    border-radius:10px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .picker-confirm-btn:active{opacity:.6;}
  .picker-cancel-btn{
    padding:8px;
    border:none;
    background:none;
    color:var(--ink-faint);
    font-family:'Noto Sans TC', sans-serif;
    font-size:15.5px;
    cursor:pointer;
  }
  .picker-cancel-btn:active{opacity:.6;}

  .picker-confirm{
    display:flex; flex-direction:column;
    gap:16px;
    padding:10px 4px 4px 4px;
  }
  .picker-confirm[hidden]{display:none;}
  .picker-confirm-message{
    font-family:'Noto Serif TC', serif;
    font-size:16px;
    color:var(--ink);
    text-align:center;
    line-height:1.5;
  }
  .picker-confirm-input-wrap{
    padding:0 4px;
  }
  .picker-confirm-input{
    width:100%;
    font-family:'Noto Serif TC', serif;
    font-size:17px;
    color:var(--ink);
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    padding:6px 2px 10px 2px;
    outline:none;
    box-sizing:border-box;
  }
  .picker-confirm-actions{
    display:flex;
    gap:10px;
  }
  .picker-confirm-cancel-btn,
  .picker-confirm-ok-btn{
    flex:1 1 0;
    padding:12px;
    border-radius:10px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .picker-confirm-cancel-btn{
    border:1.5px solid var(--line);
    background:none;
    color:var(--ink-soft);
  }
  .picker-confirm-ok-btn{
    border:none;
    background:var(--ink);
    color:var(--paper);
  }
  .picker-confirm-ok-btn.danger{
    background:var(--red);
  }
  .picker-confirm-cancel-btn:active,
  .picker-confirm-ok-btn:active{opacity:.7;}

  /* ---------------- 月曆檢視頁面（#page-month） ---------------- */
  .month-back-btn{
    position:absolute;
    left:0; top:50%;
    transform:translateY(-50%);
    width:34px; height:34px;
    padding:0;
    border-radius:10px;
    border:none;
    background:none;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .month-back-btn:active{opacity:.6;}
  .month-today-btn{
    position:absolute;
    right:0; top:50%;
    transform:translateY(-50%);
    padding:5px 14px; /* 比 .picker-today-btn 的 6px 18px 縮小約 20% */
    border-radius:9px;
    border:1.5px solid var(--red);
    background:none;
    color:var(--red);
    font-family:'Noto Sans TC', sans-serif;
    font-size:11.5px; /* 比 .picker-today-btn 的 14.5px 縮小約 20% */
    font-weight:700;
    cursor:pointer;
  }
  .month-today-btn:active{opacity:.6;}
  .month-title-nav{
    display:flex; align-items:center; gap:10px;
  }
  .month-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr);
    padding:4px 8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    text-align:center;
    letter-spacing:.03em;
  }
  .month-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    /* grid-template-rows 由 JS 依這個月實際幾週動態設成 repeat(N,1fr)，
       每一列平分剩餘高度，最後一列會剛好貼齊頁面底部，不會留一截空白。 */
    gap:3px;
    padding:0 8px 8px 8px;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden; /* 高度已經用 1fr 平分滿剩餘空間，不需要整體再捲動；每格內部的行程清單各自可以捲動 */
  }
  .month-cell{
    width:100%; height:100%;
    display:flex; flex-direction:column;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    padding:3px 2px 2px 2px;
    overflow:hidden;
    cursor:pointer;
    min-width:0;
  }
  .month-cell:active{opacity:.7;}
  .month-cell.cell-tapped-feedback{
    filter:brightness(0.88); /* 加深格子原本的顏色，不換色 */
    transition:filter .1s ease;
  }
  .month-cell.outside-month{opacity:.4;}
  .month-cell .cell-date{
    flex:0 0 auto;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink);
    text-align:center;
    line-height:18px;
  }
  .month-cell.current-day .cell-date{
    width:18px; height:18px;
    line-height:18px;
    border-radius:50%;
    background:var(--gold);
    color:var(--paper);
    font-weight:700;
    margin:0 auto;
  }
  .month-cell.today .cell-date{
    width:18px; height:18px;
    line-height:18px;
    border-radius:50%;
    background:var(--red);
    color:var(--paper);
    font-weight:700;
    margin:0 auto;
  }
  .month-cell .cell-events{
    flex:1 1 auto;
    min-height:0; /* 沒有這行 flex 子項目預設不會被壓縮，內容一多就會撐爆格子而不是自己捲動 */
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column;
    gap:1.5px;
    margin-top:2px;
  }
  .month-cell .cell-events::-webkit-scrollbar{display:none;}
  .month-cell .cell-event-pill{
    flex:0 0 auto;
    font-family:'Noto Sans TC', sans-serif;
    font-size:9px;
    line-height:1.4;
    padding:0 3px;
    border-radius:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .delete-btn{
    margin-top:6px;
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1.5px solid var(--red);
    background:transparent;
    color:var(--red);
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  .delete-btn:active{background:var(--red); color:#fff;}

  .participants-box{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .participant-chip{
    display:flex; align-items:center; gap:6px;
    padding:8px 14px;
    border-radius:18px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .participant-chip .chip-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--ink-faint);
  }
  .participant-chip.selected{
    border-color:var(--ink);
    background:var(--ink);
    color:var(--paper);
  }
  .participant-chip.selected .chip-dot{background:var(--paper);}

  .color-box{
    display:flex; flex-wrap:wrap; gap:10px;
  }
  .color-swatch{
    width:32px; height:32px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06);
  }
  .color-swatch.selected{
    border-color:var(--ink);
  }
  .color-swatch.selected::after{
    content:"";
    position:absolute; inset:6px;
    border-radius:50%;
    border:2px solid var(--paper);
  }

  .weekday-box{
    display:flex; gap:8px;
  }
  .weekday-chip{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--line);
    background:var(--card);
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .weekday-chip.selected{
    border-color:var(--red);
    background:var(--red);
    color:#fff;
  }

  .sync-toggle{
    display:flex; align-items:center; gap:9px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:16px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .sync-toggle input{
    display:none; /* 用視覺化的 toggle-switch 取代原生 checkbox 外觀 */
  }
  .toggle-switch{
    position:relative;
    width:36px; height:20px;
    border-radius:11px;
    background:var(--line);
    flex:0 0 auto;
    transition:background .18s ease;
  }
  .toggle-switch::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:16px; height:16px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
    transition:transform .18s ease;
  }
  .sync-toggle input:checked + .toggle-switch{
    background:var(--red);
  }
  .sync-toggle input:checked + .toggle-switch::after{
    transform:translateX(16px);
  }

  .field input[type=date]:disabled{
    color: var(--ink-faint);
    -webkit-text-fill-color: var(--ink-faint);
    opacity: 1;
  }

  .ecard-recur-tag{
    float:right;
    font-size:22px;
    line-height:0.7;
    color:var(--ecard-text-soft, var(--ink-soft));
    margin-left:4px;
  }
  .ecard-recur-inline{
    font-size:1.7em;
    line-height:0;
    vertical-align:-3px;
    color:var(--ecard-text-soft, var(--ink-soft));
    margin-right:2px;
    display:inline-block;
  }

  ::-webkit-scrollbar{width:0;height:0;}

  @media (prefers-reduced-motion: reduce){
    .page{transition:none;}
    .event-card{transition:none;}
  }
</style>
</head>
<body>
<div id="phone">

  <!-- ============ 頁面一：時間軸主頁 ============ -->
  <section id="page-timeline" class="page active">
    <header class="planner-header">
      <div class="date-center-nav">
        <div class="select-controls" id="selectControls">
          <button id="btnSelectToggle" class="select-toggle-btn" aria-label="選取">
            <span id="selectToggleIcon">選取</span>
          </button>
        </div>
        <div class="date-display" id="dateDisplayBtn">
          <div class="date-content" id="dateContentCurrent">
            <span class="weekday" id="weekdayLabel">—</span>
            <span class="date-num" id="dateLabel">—</span>
          </div>
          <input type="date" id="datePicker" hidden>
        </div>
        <button id="btnAddColumn" class="add-col-btn" aria-label="新增使用者欄位">
          <svg width="23" height="18" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <g transform="scale(-1,1) translate(-30,0)">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="23" y1="7" x2="23" y2="17"/>
              <line x1="18" y1="12" x2="28" y2="12"/>
            </g>
          </svg>
        </button>
        <!-- 選取模式下、有勾選任何行程時才出現的「移動」+「刪除」鍵，兩個
             綁在同一個右側群組裡（移動在左、刪除在右），群組整體貼右邊，
             跟左邊日期顯示屏、右邊螢幕邊緣都留出間距，不會頂到。 -->
        <div class="select-right-controls" id="selectRightControls">
          <div id="btnMoveSelected" class="select-move-btn" aria-label="移動選取的行程" hidden>
            <span>移動</span>
            <input type="date" id="moveTargetDatePicker" hidden>
          </div>
          <button id="btnDeleteSelected" class="select-delete-btn" aria-label="刪除已選取的項目" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="column-header-row" id="columnHeaderRow"></div>
    <div class="timeline-scroll" id="timelineScroll">
      <div class="day-slider" id="daySlider">
        <div class="timeline-grid" id="timelineGrid">
          <div class="margin-rule"></div>
          <!-- hour-row 由 JS 產生 -->
          <div class="col-dividers" id="colDividers"></div>
          <div class="events-layer" id="eventsLayer"></div>
        </div>
      </div>
    </div>

    <!-- 月曆檢視入口：疊在時間軸左下角（蓋到左側時間刻度那一欄），跟右下角
         鉛筆鍵是同一顆 .fab 的鏡像版本，只是換了邊、換了圖示。 -->
    <button class="fab month-fab" id="btnOpenMonth" aria-label="月曆檢視">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="3"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </button>

    <button class="fab" id="fabAdd" aria-label="新增行程">
      <svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true">
        <g transform="rotate(45 50 50)" fill="currentColor">
          <!-- 橡皮擦 -->
          <rect x="40" y="8" width="20" height="14" rx="4"/>
          <!-- 金屬箍(上下用留白間隙跟橡皮擦、筆身分開) -->
          <rect x="40" y="25" width="20" height="6"/>
          <!-- 筆身 -->
          <rect x="40" y="34" width="20" height="40"/>
          <!-- 筆尖(用留白間隙跟筆身分開) -->
          <path d="M40 77 L60 77 L50 95 Z"/>
        </g>
      </svg>
    </button>

    <!-- 回上一步／下一步：整個資料狀態（columns + events）的復原/重做，
         垂直排列在鉛筆鍵正上方。實作方式見 JS 段落的「復原／重做」區塊：
         用整包資料的快照比對，不是針對每種操作分別寫復原邏輯，這樣不管
         是改行程內容、時間、日期、參與者、還是新增/改名/刪除共編者欄位，
         全部都自動可以復原，不用每加一種新操作就要記得補一段復原邏輯。 -->
    <div class="undo-redo-stack">
      <button type="button" id="btnUndo" class="undo-redo-btn" aria-label="回上一步" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 14 4 9 9 4"></polyline>
          <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
        </svg>
      </button>
      <button type="button" id="btnRedo" class="undo-redo-btn" aria-label="下一步" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 14 20 9 15 4"></polyline>
          <path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>
        </svg>
      </button>
    </div>
  </section>

  <!-- ============ 頁面二：行程編輯頁 ============ -->
  <section id="page-edit" class="page">
    <header class="edit-header">
      <button id="btnCancel" class="text-btn">取消</button>
      <span class="edit-title-label">行程卡</span>
      <button id="btnDone" class="text-btn primary">完成</button>
    </header>

    <div class="edit-body">
      <div class="field">
        <span class="field-label">行程名稱</span>
        <input id="fieldTitle" type="text">
      </div>

      <div class="field">
        <span class="field-label">詳細備註</span>
        <textarea id="fieldNotes" rows="2"></textarea>
      </div>

      <div class="field">
        <span class="field-label">日期</span>
        <button type="button" id="fieldDateBtn" class="date-value-btn">—</button>
        <input id="fieldDate" type="date" hidden>
      </div>

      <div class="field">
        <span class="field-label">時間設定</span>
        <div class="ticket">
          <div class="time-trio">
            <div class="tcell">
              <label for="fieldStartBtn">開始時間</label>
              <button type="button" id="fieldStartBtn" class="time-value-btn">—</button>
              <input id="fieldStart" type="time" step="300" hidden>
            </div>
            <div class="tcell">
              <label for="fieldEndBtn">結束時間</label>
              <button type="button" id="fieldEndBtn" class="time-value-btn">—</button>
              <input id="fieldEnd" type="time" step="300" hidden>
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <span class="field-label">顏色</span>
        <div class="color-box" id="colorBox"></div>
      </div>

      <div class="field">
        <span class="field-label">重複</span>
        <div class="weekday-box" id="weekdayBox"></div>
      </div>

      <div class="field" id="syncField" style="display:none;">
        <label class="sync-toggle">
          <input type="checkbox" id="fieldSyncEdit">
          <span class="toggle-switch" aria-hidden="true"></span>
          <span>同步編輯</span>
        </label>
      </div>

      <div class="field">
        <span class="field-label">參與者</span>
        <div class="participants-box" id="participantsBox"></div>
      </div>

      <button id="btnDelete" class="delete-btn">刪除此行程</button>
    </div>
  </section>

  <!-- ============ 頁面三：月曆檢視 ============
       只負責「一眼看到整個月每天有什麼行程」跟「點某一天跳去那天的時間軸」，
       本身不編輯任何資料，所以不用接復原/重做系統。行程清單直接重用
       getInstancesForDate()（跟時間軸主頁抓當天行程是同一個函式），顏色
       也是重用 eventColorById()/isLightColor()，確保跟時間軸上看到的顏色
       永遠一致，不會有兩邊各自維護一套顏色邏輯結果對不上的問題。 -->
  <section id="page-month" class="page">
    <header class="planner-header">
      <div class="date-center-nav">
        <button type="button" id="btnMonthBack" class="month-back-btn" aria-label="返回時間軸">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div class="month-title-nav">
          <button type="button" id="monthPrevBtn" class="picker-nav-btn" aria-label="上個月">‹</button>
          <div class="picker-cal-title">
            <span class="picker-cal-year" id="monthYearLabel">—</span>
            <span class="picker-cal-month" id="monthMonthLabel">—</span>
          </div>
          <button type="button" id="monthNextBtn" class="picker-nav-btn" aria-label="下個月">›</button>
        </div>
        <!-- 已經在今天所在的月份時，點下去直接跳今天的時間軸頁面；
             不同月份時，只是把月曆切回今天所在的月份，留在月曆頁。 -->
        <button type="button" id="btnMonthToday" class="month-today-btn" aria-label="回到今天">回到今天</button>
      </div>
    </header>
    <div class="month-weekdays" id="monthWeekdaysRow"></div>
    <div class="month-grid" id="monthGrid"></div>
  </section>

  <!-- ============ 共用元件：自訂日期／時間選擇器 ============
       取代原生 input[type=date] / input[type=time]，套用手帳曆本身的紙感
       配色與字體（JetBrains Mono 數字、Noto Serif TC 標題）。放在 #phone
       這一層、兩個 .page 之外，這樣不管目前在時間軸頁還是編輯頁，都能疊在
       最上層（#phone 本身是 position:relative + overflow:hidden，這個
       overlay 用 position:absolute; inset:0 剛好貼齊整個手機畫面）。
       實際資料還是寫回原本那些 input（fieldDate/fieldStart/fieldEnd/
       datePicker/moveTargetDatePicker），只是那些 input 現在改成 hidden，
       純粹當「資料容器」用，選完後照樣 dispatch 一個 change 事件，周邊
       既有的存檔/連動邏輯完全不用改。 -->
  <div id="pickerOverlay" class="picker-overlay" hidden>
    <div class="picker-backdrop" id="pickerBackdrop"></div>
    <div class="picker-sheet" id="pickerSheet" role="dialog" aria-modal="true">

      <div class="picker-date" id="pickerDateView">
        <div class="picker-cal-head">
          <button type="button" class="picker-nav-btn" id="calPrevBtn" aria-label="上個月">‹</button>
          <div class="picker-cal-title">
            <span class="picker-cal-year" id="calYearLabel">—</span>
            <span class="picker-cal-month" id="calMonthLabel">—</span>
          </div>
          <button type="button" class="picker-nav-btn" id="calNextBtn" aria-label="下個月">›</button>
        </div>
        <div class="picker-cal-weekdays" id="calWeekdaysRow"></div>
        <div class="picker-cal-grid" id="calGrid"></div>
        <button type="button" class="picker-today-btn" id="calTodayBtn">回到今天</button>
      </div>

      <div class="picker-time" id="pickerTimeView" hidden>
        <div class="picker-time-title" id="pickerTimeTitle">選擇時間</div>
        <div class="picker-time-wheels">
          <div class="picker-wheel-highlight" aria-hidden="true"></div>
          <div class="picker-wheel" id="hourWheel"></div>
          <div class="picker-wheel-colon">:</div>
          <div class="picker-wheel" id="minuteWheel"></div>
        </div>
        <button type="button" class="picker-confirm-btn" id="timeConfirmBtn">確定</button>
      </div>

      <!-- 取代原生 window.confirm()／window.prompt()，樣式跟日期/時間選擇器
           共用同一張紙感卡片。confirmInputWrap 平常隱藏，只有 showPromptDialog
           （目前是「修改編輯者姓名」在用）才會顯示成一個輸入框；純確認用的
           showConfirmDialog（「確定刪除？」）不需要輸入框。 -->
      <div class="picker-confirm" id="pickerConfirmView" hidden>
        <div class="picker-confirm-message" id="pickerConfirmMessage">確定刪除？</div>
        <div class="picker-confirm-input-wrap" id="pickerConfirmInputWrap" hidden>
          <input type="text" id="pickerConfirmInput" class="picker-confirm-input">
        </div>
        <div class="picker-confirm-actions">
          <button type="button" class="picker-confirm-cancel-btn" id="pickerConfirmCancelBtn">取消</button>
          <button type="button" class="picker-confirm-ok-btn" id="pickerConfirmOkBtn">確定</button>
        </div>
      </div>

      <button type="button" class="picker-cancel-btn" id="pickerCancelBtn">取消</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ---------------- 資料狀態 ---------------- */
  const pad2 = n => String(n).padStart(2,'0');
  const todayStr = () => {
    const d = new Date();
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  };
  const T0 = todayStr();
  const dateByOffset = (dateStr, delta) => {
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d+delta);
    return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());
  };

  // 每個 column 代表一位共編者自己的直向欄位
  let columns = [
    {id:'p1', name:'我'}
  ];

  // 目前這台裝置的操作者是誰：整個 App 現在還沒有登入／切換使用者的機制，
  // 一律視為 columns[0]（id 'p1'，也就是「我」）本人在操作這台裝置。
  // 「選取」功能的權限判斷（自己的欄位／自己欄位上的行程可以選取刪除，
  // 共同行程只有創建者可以選取刪除）都是以這個常數為準。未來如果加上
  // 真正的多裝置登入機制，只要讓這個值改成「目前登入者的 column id」即可，
  // 其餘判斷邏輯不需要更動。
  const CURRENT_USER_ID = 'p1';

  let events = [
    {id:'e1', title:'晨間會議', date:T0, start:'09:00', end:'10:30', notes:'記得帶筆電與投影線材。', participants:['p1'], creatorId:'p1', color:'morandi-blue'},
    {id:'e2', title:'研究冰淇淋機', date:T0, start:'14:00', end:'15:00', notes:'客廳桌上製作，不准上床。', participants:['p1'], creatorId:'p1', color:'macaron-peach'},
    {id:'e3', title:'健身房', date:T0, start:'19:00', end:'20:00', notes:'', participants:['p1'], creatorId:'p1', color:'morandi-sage'}
  ];

  /* ---------------- 本機儲存（重新整理、關掉分頁再打開，資料還在） ----------------
     用瀏覽器的 localStorage，只存在「這一台裝置的這個瀏覽器」裡，不會跨裝置
     同步（跨裝置即時共編需要接後端資料庫，是下一步要做的事）。
     這裡刻意包一層 try/catch：像 Claude 對話裡內建的預覽視窗這種沙盒環境，
     可能會擋掉 localStorage 的存取；擋掉的話就安靜地退回純記憶體模式（跟
     之前的行為一樣），不會讓其他功能跟著壞掉。實際部署到 Netlify／自己網域
     之後，就是一般瀏覽器環境，會正常運作。 */
  const STORAGE_KEY = 'shared-planner-v1';
  let storageAvailable = true;

  function saveToStorage(){
    if(!storageAvailable) return;
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({columns, events}));
    }catch(err){
      storageAvailable = false;
    }
  }

  /* saveToStorage() 是同步、阻塞主執行緒的操作，資料量越大越貴，而 renderEvents()
     幾乎每個操作（拖曳/縮放/新增）都會觸發一次存檔。改成 debounce：停止操作 400ms
     後才真的寫入；使用者切走分頁或關閉頁面時強制立刻存檔，避免資料遺失。 */
  let saveDebounceTimer = null;
  function scheduleSaveToStorage(){
    if(saveDebounceTimer) clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(function(){
      saveDebounceTimer = null;
      saveToStorage();
    }, 400);
  }
  function flushSaveToStorage(){
    if(saveDebounceTimer){ clearTimeout(saveDebounceTimer); saveDebounceTimer = null; }
    saveToStorage();
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden') flushSaveToStorage();
  });
  window.addEventListener('pagehide', flushSaveToStorage);

  function loadFromStorage(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(data && Array.isArray(data.columns) && data.columns.length && Array.isArray(data.events)){
        return data;
      }
    }catch(err){
      storageAvailable = false;
    }
    return null;
  }

  const savedData = loadFromStorage();
  if(savedData){
    columns = savedData.columns;
    events = savedData.events;
  }

  /* ---------------- 復原／重做 ----------------
     不是針對「刪除」「編輯」「拖曳」……每一種操作分別寫一段復原邏輯，而是
     整包資料（columns + events —— 這剛好就是 saveToStorage() 存的東西，
     行程內容/時間/日期/參與者、共編者欄位的新增/改名/刪除，全部都在裡面）
     拍快照、比對前後差異。掛在跟 saveToStorage 完全同一組「資料可能剛
     被動過」的偵測點上（renderColumnHeader/renderEvents），所以不用擔心
     以後新加一種操作忘記補復原邏輯——只要那個操作會讓畫面重繪，就自動
     被記錄進來。

     每筆快照除了資料本身，也記錄「拍下這筆快照當下，畫面顯示的是哪一
     天」（lastCommittedDate）。單純換日瀏覽不會被記成新的一步（資料沒變，
     下面比對就直接跳過），但會順便更新 lastCommittedDate，這樣如果之後
     做了個會換日的操作（例如把行程搬到別天、選取後用「移動」搬過去），
     復原時才能連著畫面顯示的日期一起退回去，而不是只有資料復原、畫面
     卻還留在搬移後的那一天。 */
  let undoStack = [];
  let redoStack = [];
  let lastCommittedDataJSON = JSON.stringify({columns, events});
  let lastCommittedDate = T0; // currentDate 這時候還沒宣告，用它的初始值 T0 代替
  let isRestoringSnapshot = false; // 復原/重做本身在改資料時，不要又把這次改動記成新的一步
  const UNDO_STACK_LIMIT = 50;

  function captureUndoCheckpoint(){
    if(isRestoringSnapshot) return;
    const snap = JSON.stringify({columns, events});
    if(snap === lastCommittedDataJSON){
      lastCommittedDate = currentDate; // 資料沒變，只是換了顯示的日期，記住就好
      return;
    }
    undoStack.push({data: lastCommittedDataJSON, date: lastCommittedDate});
    if(undoStack.length > UNDO_STACK_LIMIT) undoStack.shift();
    redoStack.length = 0; // 有新的動作了，原本能重做的「未來」就作廢
    lastCommittedDataJSON = snap;
    lastCommittedDate = currentDate;
    updateUndoRedoButtons();
  }

  function applySnapshot(entry){
    const data = JSON.parse(entry.data);
    isRestoringSnapshot = true;
    columns = data.columns;
    events = data.events;
    currentDate = entry.date;
    selectedEventKeys.clear();
    selectedColumnIds.clear();
    renderTimeline(); // 資料 + 畫面顯示的日期一起換回去（日期標籤、星期、今天樣式也一併更新）
    isRestoringSnapshot = false;
    lastCommittedDataJSON = entry.data;
    lastCommittedDate = entry.date;
    scheduleSaveToStorage();
    updateUndoRedoButtons();
  }

  function undo(){
    if(undoStack.length === 0) return;
    redoStack.push({data: lastCommittedDataJSON, date: lastCommittedDate});
    const prev = undoStack.pop();
    applySnapshot(prev);
  }
  function redo(){
    if(redoStack.length === 0) return;
    undoStack.push({data: lastCommittedDataJSON, date: lastCommittedDate});
    const next = redoStack.pop();
    applySnapshot(next);
  }
  function updateUndoRedoButtons(){
    btnUndo.disabled = undoStack.length === 0;
    btnRedo.disabled = redoStack.length === 0;
  }

  let currentDate = T0;      // 目前檢視的日期 (YYYY-MM-DD)

  const timeToMinutes = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
  const minutesToTime = min => {
    min = Math.max(0, Math.min(23*60+55, min));
    const h = Math.floor(min/60), m = min%60;
    return pad2(h)+':'+pad2(m);
  };
  const PALETTE = ['gold','sage','dusk','blush'];
  const colByIndex = idx => PALETTE[((idx%PALETTE.length)+PALETTE.length)%PALETTE.length];

  // 行程自訂顏色：莫蘭迪＋馬卡龍色系，讓使用者以顏色為行程分類
  // （跟上面 colByIndex 那組「依使用者欄位分色」的邏輯彼此獨立，
  // 欄位標題用 colByIndex，行程卡片本身改用這裡的 EVENT_COLORS）
  const EVENT_COLORS = [
    {id:'morandi-mauve',  name:'霧霧藕色', hex:'#B79C97'},
    {id:'morandi-blue',   name:'霧灰藍',   hex:'#8FA1B0'},
    {id:'morandi-sage',   name:'鼠尾草綠', hex:'#A3AC93'},
    {id:'morandi-oat',    name:'燕麥杏',   hex:'#CBBBA3'},
    {id:'morandi-lilac',  name:'霧灰紫',   hex:'#A79BB0'},
    {id:'morandi-teal',   name:'煙燻藍綠', hex:'#7E9C93'},
    {id:'morandi-clay',   name:'陶土棕',   hex:'#BA8F76'},
    {id:'morandi-fog',    name:'霧灰',     hex:'#B7B6AC'},
    {id:'macaron-peach',  name:'粉桃',     hex:'#FBD3C4'},
    {id:'macaron-mint',   name:'薄荷綠',   hex:'#CDEBD8'},
    {id:'macaron-lavender', name:'淡紫',   hex:'#E4D6F5'},
    {id:'macaron-lemon',  name:'檸檬黃',   hex:'#FCEFB4'},
    {id:'macaron-sky',    name:'天空藍',   hex:'#CBE6F6'},
    {id:'macaron-pink',   name:'草莓粉',   hex:'#FBCBD7'},
    {id:'morandi-charcoal', name:'深灰藍', hex:'#5C6B73'},
    {id:'morandi-plum',   name:'深梅紫',   hex:'#6E5265'}
  ];
  const DEFAULT_EVENT_COLOR = EVENT_COLORS[0].id;
  const eventColorById = id => EVENT_COLORS.find(c => c.id === id) || EVENT_COLORS[0];

  // 淺色格子配黑字、深色格子配白字：用感知亮度（YIQ）快速判斷，
  // 不需要精確色彩科學，只要淺／深兩邊都選對就好。
  function isLightColor(hex){
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const yiq = (r*299 + g*587 + b*114) / 1000;
    return yiq >= 150;
  }

  // 把把手顏色調得比格子本身的顏色略深一些，讓把手在同色格子上仍看得出輪廓。
  function darkenHex(hex, amount){
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const dr = Math.max(0, Math.round(r*(1-amount)));
    const dg = Math.max(0, Math.round(g*(1-amount)));
    const db = Math.max(0, Math.round(b*(1-amount)));
    return '#' + [dr,dg,db].map(v => v.toString(16).padStart(2,'0')).join('');
  }

  // 套用行程自訂顏色到卡片：整個格子填滿該色，並依明暗決定文字用黑或白。
  function applyEventColor(card, colorId){
    const c = eventColorById(colorId);
    const light = isLightColor(c.hex);
    card.style.setProperty('--ecard-color', c.hex);
    card.style.setProperty('--ecard-text', light ? 'rgba(30,26,22,0.92)' : '#FFFFFF');
    card.style.setProperty('--ecard-text-soft', light ? 'rgba(30,26,22,0.68)' : 'rgba(255,255,255,0.78)');
    card.style.setProperty('--ecard-handle-color', darkenHex(c.hex, 0.22));
  }

  function colIndex(colId){
    return columns.findIndex(c => c.id === colId);
  }
  // 一個行程可能橫跨多欄，但參與者不一定相鄰（例如選了第1、3位，
  // 沒選第2位）。這種情況要拆成多個連續區段分別顯示，中間空著，
  // 而不是把整個範圍都畫滿。
  function eventColRuns(ev){
    const idxs = Array.from(new Set((ev.participants||[]).map(colIndex).filter(i => i>=0))).sort((a,b)=>a-b);
    if(idxs.length===0) return [[0,0]];
    const runs = [];
    let start = idxs[0], prev = idxs[0];
    for(let i=1; i<idxs.length; i++){
      if(idxs[i] === prev+1){
        prev = idxs[i];
      } else {
        runs.push([start, prev]);
        start = idxs[i]; prev = idxs[i];
      }
    }
    runs.push([start, prev]);
    return runs;
  }

  // 判斷「某個欄位範圍 + 時間範圍」是否跟這一天其他既有行程重疊。
  // excludeMasterId/excludeDate 用來排除自己（拖曳/縮放中的那個行程本身）。
  // 回傳第一個找到的碰撞對象（{runMin, runMax, startMin, endMin}），沒有碰撞回傳 null。
  function findCollision(dateStr, colMin, colMax, startMin, endMin, excludeMasterId, excludeDate){
    const insts = getInstancesForDate(dateStr);
    for(let i=0; i<insts.length; i++){
      const inst = insts[i];
      if(inst.masterId === excludeMasterId && inst.instanceDate === excludeDate) continue;
      const iStart = timeToMinutes(inst.start);
      const iEnd = timeToMinutes(inst.end);
      if(!(startMin < iEnd && iStart < endMin)) continue; // 時間沒重疊
      const runs = eventColRuns(inst);
      for(let j=0; j<runs.length; j++){
        const [runMin, runMax] = runs[j];
        if(colMin <= runMax && runMin <= colMax){
          return {runMin, runMax, startMin:iStart, endMin:iEnd};
        }
      }
    }
    return null;
  }

  const WEEKDAYS = ['週日','週一','週二','週三','週四','週五','週六'];

  function weekdayOf(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y, m-1, d).getDay();
  }

  /* ---------------- 共用元件：自訂日期／時間選擇器 ----------------
     取代所有原生 input[type=date] / input[type=time]（頂部日期切換、
     行程編輯頁的日期/開始/結束時間、選取模式的「移動」）。每個呼叫端
     只需要給「目前值」跟「選完要做什麼」，實際的畫面/手勢都在這裡統一
     處理，之後要再調整風格只用改這一塊。 */
  const pickerOverlay = document.getElementById('pickerOverlay');
  const pickerBackdrop = document.getElementById('pickerBackdrop');
  const pickerSheet = document.getElementById('pickerSheet');
  const pickerDateView = document.getElementById('pickerDateView');
  const pickerTimeView = document.getElementById('pickerTimeView');
  const pickerCancelBtn = document.getElementById('pickerCancelBtn');

  const pickerConfirmView = document.getElementById('pickerConfirmView');
  const pickerConfirmMessage = document.getElementById('pickerConfirmMessage');
  const pickerConfirmInputWrap = document.getElementById('pickerConfirmInputWrap');
  const pickerConfirmInput = document.getElementById('pickerConfirmInput');
  const pickerConfirmCancelBtn = document.getElementById('pickerConfirmCancelBtn');
  const pickerConfirmOkBtn = document.getElementById('pickerConfirmOkBtn');

  const calPrevBtn = document.getElementById('calPrevBtn');
  const calNextBtn = document.getElementById('calNextBtn');
  const calYearLabel = document.getElementById('calYearLabel');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const calWeekdaysRow = document.getElementById('calWeekdaysRow');
  const calGrid = document.getElementById('calGrid');
  const calTodayBtn = document.getElementById('calTodayBtn');

  const hourWheel = document.getElementById('hourWheel');
  const minuteWheel = document.getElementById('minuteWheel');
  const timeConfirmBtn = document.getElementById('timeConfirmBtn');
  const pickerTimeTitle = document.getElementById('pickerTimeTitle');

  let pickerOnConfirm = null; // 目前這次呼叫的 callback，關閉時清掉避免殘留
  let calViewYear = 0, calViewMonth = 0; // 月曆目前顯示（不代表已選）的年月，0-based month
  let calSelectedDate = ''; // 'YYYY-MM-DD'
  let pickedHour = 0, pickedMinute = 0;

  const PICKER_CLOSE_ANIM_MS = 220; // 要跟 CSS 的 picker-sheet-out 動畫時間一致

  // 讓選擇器往下滑走消失，不是直接把整塊藏起來，動畫跑完才真的隱藏、
  // 並且在這之後才呼叫 afterHidden（例如真正套用選好的日期/時間）。
  function hidePickerSheet(afterHidden){
    pickerSheet.classList.add('closing');
    setTimeout(function(){
      pickerSheet.classList.remove('closing');
      pickerOverlay.hidden = true;
      pickerOnConfirm = null;
      if(afterHidden) afterHidden();
    }, PICKER_CLOSE_ANIM_MS);
  }

  // 一般關閉（取消／點背景）：不用等待，直接開始往下滑走。
  function closePicker(){
    hidePickerSheet(null);
  }
  pickerBackdrop.addEventListener('click', closePicker);
  pickerCancelBtn.addEventListener('click', closePicker);

  function renderCalGrid(){
    calYearLabel.textContent = calViewYear + '年';
    calMonthLabel.textContent = (calViewMonth+1) + '月';
    if(calWeekdaysRow.children.length === 0){
      WEEKDAYS.forEach(w => {
        const el = document.createElement('span');
        el.textContent = w.slice(1); // 週日→日
        calWeekdaysRow.appendChild(el);
      });
    }
    calGrid.innerHTML = '';
    const firstOfMonth = new Date(calViewYear, calViewMonth, 1);
    const startOffset = firstOfMonth.getDay(); // 0=日
    const daysInMonth = new Date(calViewYear, calViewMonth+1, 0).getDate();
    const today = todayStr();
    for(let i=0; i<startOffset; i++){
      const cell = document.createElement('div');
      cell.className = 'picker-cal-cell empty';
      calGrid.appendChild(cell);
    }
    for(let day=1; day<=daysInMonth; day++){
      const dateStr = calViewYear+'-'+pad2(calViewMonth+1)+'-'+pad2(day);
      const cell = document.createElement('div');
      cell.className = 'picker-cal-cell';
      if(dateStr === today) cell.classList.add('today');
      if(dateStr === calSelectedDate) cell.classList.add('selected');
      cell.textContent = day;
      cell.addEventListener('click', function(){
        calSelectedDate = dateStr;
        // 先立刻給按鍵反饋（變成跟「選中」一樣的紅底），其他格子的反白拿掉，
        // 讓使用者確定自己點到了哪一天。
        calGrid.querySelectorAll('.picker-cal-cell.selected').forEach(el => el.classList.remove('selected'));
        cell.classList.add('selected');
        const cb = pickerOnConfirm;
        // 停留一下讓使用者看清楚反饋，再讓整塊選擇器往下滑走消失，
        // 消失後才真的套用日期——不要選了馬上跳頁，感覺太突兀。
        setTimeout(function(){
          hidePickerSheet(function(){ if(cb) cb(dateStr); });
        }, 350);
      });
      calGrid.appendChild(cell);
    }
  }

  calPrevBtn.addEventListener('click', function(){
    calViewMonth--;
    if(calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
    renderCalGrid();
  });
  calNextBtn.addEventListener('click', function(){
    calViewMonth++;
    if(calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
    renderCalGrid();
  });
  calTodayBtn.addEventListener('click', function(){
    const [y,m] = todayStr().split('-').map(Number);
    if(calViewYear === y && calViewMonth === m-1){
      // 已經在今天所在的月份：直接選定並套用今天，不用再多點一次格子
      calSelectedDate = todayStr();
      calGrid.querySelectorAll('.picker-cal-cell.selected').forEach(el => el.classList.remove('selected'));
      const todayCell = calGrid.querySelector('.picker-cal-cell.today');
      if(todayCell) todayCell.classList.add('selected');
      const cb = pickerOnConfirm;
      setTimeout(function(){
        hidePickerSheet(function(){ if(cb) cb(calSelectedDate); });
      }, 350);
    } else {
      // 不同月份：只是把月曆切回今天所在的月份，選擇器留著開
      calViewYear = y; calViewMonth = m-1;
      renderCalGrid();
    }
  });

  // 打開日期選擇器。initialDateStr 是 'YYYY-MM-DD'；onSelect(dateStr) 在
  // 使用者點選某一天之後立刻被呼叫（點了就套用，不用另外按確定，
  // 跟原本原生日期選擇器的手感一致）。
  function openDatePicker(initialDateStr, onSelect){
    pickerSheet.classList.remove('closing');
    const base = initialDateStr || todayStr();
    const [y,m] = base.split('-').map(Number);
    calViewYear = y; calViewMonth = m-1;
    calSelectedDate = base;
    pickerOnConfirm = onSelect;
    pickerDateView.hidden = false;
    pickerTimeView.hidden = true;
    pickerConfirmView.hidden = true;
    pickerCancelBtn.hidden = false;
    renderCalGrid();
    pickerOverlay.hidden = false;
  }

  const HOURS = Array.from({length:24}, (_,i) => i);
  const MINUTES = Array.from({length:12}, (_,i) => i*5); // 跟原本 step="300" 的 5 分鐘間隔一致
  const WHEEL_ROW_H = 40;

  function buildWheel(container, values, formatFn){
    container.innerHTML = '';
    values.forEach(v => {
      const item = document.createElement('div');
      item.className = 'picker-wheel-item';
      item.textContent = formatFn(v);
      item.dataset.value = v;
      container.appendChild(item);
    });
  }
  buildWheel(hourWheel, HOURS, v => pad2(v));
  buildWheel(minuteWheel, MINUTES, v => pad2(v));

  function nearestIndex(container){
    return Math.round(container.scrollTop / WHEEL_ROW_H);
  }
  function markPicked(container, index){
    Array.from(container.children).forEach((el,i) => {
      el.classList.toggle('picked', i === index);
    });
  }
  function scrollWheelTo(container, index, smooth){
    container.scrollTo({ top: index*WHEEL_ROW_H, behavior: smooth ? 'smooth' : 'auto' });
  }

  let hourScrollTimer = null, minuteScrollTimer = null;
  hourWheel.addEventListener('scroll', function(){
    const idx = nearestIndex(hourWheel);
    markPicked(hourWheel, idx);
    clearTimeout(hourScrollTimer);
    hourScrollTimer = setTimeout(function(){
      pickedHour = HOURS[Math.max(0, Math.min(HOURS.length-1, idx))];
    }, 100);
  });
  minuteWheel.addEventListener('scroll', function(){
    const idx = nearestIndex(minuteWheel);
    markPicked(minuteWheel, idx);
    clearTimeout(minuteScrollTimer);
    minuteScrollTimer = setTimeout(function(){
      pickedMinute = MINUTES[Math.max(0, Math.min(MINUTES.length-1, idx))];
    }, 100);
  });
  hourWheel.addEventListener('click', function(e){
    const item = e.target.closest('.picker-wheel-item');
    if(!item) return;
    scrollWheelTo(hourWheel, Array.from(hourWheel.children).indexOf(item), true);
  });
  minuteWheel.addEventListener('click', function(e){
    const item = e.target.closest('.picker-wheel-item');
    if(!item) return;
    scrollWheelTo(minuteWheel, Array.from(minuteWheel.children).indexOf(item), true);
  });

  // 打開時間選擇器。initialTimeStr 是 'HH:MM'；onSelect(timeStr) 在使用者
  // 按下「確定」之後才呼叫（時間要同時選「時」跟「分」兩個值，比較適合
  // 用一個明確的確定鍵，不像日期點了就能直接確定）。label 是標題文字，
  // 用來區分目前調的是開始還是結束時間，沒給的話退回「選擇時間」。
  function openTimePicker(initialTimeStr, onSelect, label){
    pickerSheet.classList.remove('closing');
    pickerTimeTitle.textContent = label || '選擇時間';
    const [h,mi] = (initialTimeStr || '09:00').split(':').map(Number);
    pickedHour = h;
    // 把分鐘吸附到最近的 5 分鐘刻度，跟原本 input[type=time] step=300 一致
    pickedMinute = MINUTES.reduce((closest, v) => Math.abs(v-mi) < Math.abs(closest-mi) ? v : closest, 0);
    pickerOnConfirm = onSelect;
    pickerDateView.hidden = true;
    pickerTimeView.hidden = false;
    pickerConfirmView.hidden = true;
    pickerCancelBtn.hidden = false;
    pickerOverlay.hidden = false;
    // 要等 overlay 從 hidden 變成可見、版面量得到高度之後才能量測捲動位置，
    // 用 rAF 讓瀏覽器先跑完一次排版。
    requestAnimationFrame(function(){
      const hIdx = HOURS.indexOf(pickedHour);
      const mIdx = MINUTES.indexOf(pickedMinute);
      scrollWheelTo(hourWheel, hIdx, false);
      scrollWheelTo(minuteWheel, mIdx, false);
      markPicked(hourWheel, hIdx);
      markPicked(minuteWheel, mIdx);
    });
  }
  timeConfirmBtn.addEventListener('click', function(){
    const timeStr = pad2(pickedHour)+':'+pad2(pickedMinute);
    const cb = pickerOnConfirm;
    hidePickerSheet(function(){ if(cb) cb(timeStr); });
  });

  // 取代原生 window.confirm() / window.prompt()，用同一張紙感選擇器卡片
  // 顯示訊息（+ 需要輸入時的一個文字框），跟日期/時間選擇器共用同一套
  // 開關動畫。因為原生 confirm()/prompt() 是同步阻塞的寫法（直接 if(!confirm(...))
  // return;），這裡改成非同步的 callback 寫法：只有使用者按下「確定」，
  // onConfirm 才會被呼叫；按「取消」或點背景關閉則什麼都不做。
  function showConfirmDialog(message, onConfirm, opts){
    opts = opts || {};
    pickerSheet.classList.remove('closing');
    pickerConfirmMessage.textContent = message;
    pickerConfirmInputWrap.hidden = true;
    pickerConfirmOkBtn.textContent = opts.okLabel || '確定';
    pickerConfirmOkBtn.classList.toggle('danger', !!opts.danger);
    pickerOnConfirm = onConfirm;
    pickerDateView.hidden = true;
    pickerTimeView.hidden = true;
    pickerConfirmView.hidden = false;
    pickerCancelBtn.hidden = true; // 下面自己的取消/確定鍵就夠了，不用再疊一個
    pickerOverlay.hidden = false;
  }
  // 取代原生 window.prompt()：多一個文字輸入框，預設值放 defaultValue，
  // 使用者按下「確定」時 onConfirm 會收到輸入框目前的文字（沒有 trim，
  // 呼叫端自己處理，跟原本 window.prompt() 的回傳值習慣一致）。
  function showPromptDialog(message, defaultValue, onConfirm, opts){
    showConfirmDialog(message, onConfirm, opts);
    pickerConfirmInputWrap.hidden = false;
    pickerConfirmInput.value = defaultValue || '';
    requestAnimationFrame(function(){
      pickerConfirmInput.focus();
      pickerConfirmInput.select();
    });
  }
  pickerConfirmCancelBtn.addEventListener('click', closePicker);
  pickerConfirmOkBtn.addEventListener('click', function(){
    const cb = pickerOnConfirm;
    const isPrompt = !pickerConfirmInputWrap.hidden;
    const val = isPrompt ? pickerConfirmInput.value : true;
    hidePickerSheet(function(){ if(cb) cb(val); });
  });

  // 把「行程資料」展開成某一天實際要顯示的「實例」清單。
  // 一般行程：date 完全相符才顯示。
  // 重複行程（有 ev.recurrence）：只要 dateStr 的星期幾在
  // recurrence.weekdays 裡、且 dateStr >= 起始日期、且沒有被排除，
  // 就會展開出一個實例；若這個日期有獨立編輯過的 overrides，
  // 就用 overrides 蓋掉原本的欄位（同步編輯模式關閉時的效果）。
  function getInstancesForDate(dateStr){
    const list = [];
    events.forEach(ev => {
      // 舊資料（此功能上線前建立的行程）可能沒有 creatorId 欄位，
      // 一律當作是「我」建立的，避免既有行程突然變成「不能選取刪除」。
      const creatorId = ev.creatorId || CURRENT_USER_ID;
      if(ev.recurrence){
        const excluded = ev.excluded || [];
        if(dateStr >= ev.date &&
           ev.recurrence.weekdays.includes(weekdayOf(dateStr)) &&
           excluded.indexOf(dateStr) === -1){
          const ov = (ev.overrides && ev.overrides[dateStr]) || {};
          list.push({
            masterId: ev.id,
            instanceDate: dateStr,
            title: ov.title !== undefined ? ov.title : ev.title,
            start: ov.start !== undefined ? ov.start : ev.start,
            end: ov.end !== undefined ? ov.end : ev.end,
            notes: ov.notes !== undefined ? ov.notes : ev.notes,
            participants: ov.participants !== undefined ? ov.participants : ev.participants,
            color: ev.color || DEFAULT_EVENT_COLOR,
            creatorId: creatorId,
            isRecurring: true,
            hasOverride: !!(ev.overrides && ev.overrides[dateStr])
          });
        }
      } else if(ev.date === dateStr){
        list.push({
          masterId: ev.id,
          instanceDate: dateStr,
          title: ev.title, start: ev.start, end: ev.end,
          notes: ev.notes, participants: ev.participants,
          color: ev.color || DEFAULT_EVENT_COLOR,
          creatorId: creatorId,
          isRecurring: false, hasOverride: false
        });
      }
    });
    return list;
  }

  // 拖曳調整時間（快速手勢，沒有經過編輯頁的同步開關）一律視為「只改這一天」：
  // 一般行程直接改本體；重複行程則寫入這一天的 override，不影響系列其他日期。
  function quickSetTime(masterId, dateStr, newStart, newEnd){
    const master = events.find(e => e.id === masterId);
    if(!master) return;
    if(!master.recurrence){
      master.start = newStart;
      master.end = newEnd;
    } else {
      master.overrides = master.overrides || {};
      master.overrides[dateStr] = Object.assign({}, master.overrides[dateStr]||{}, {start:newStart, end:newEnd});
    }
  }

  // 拖曳／縮放行程卡片放開後，套用最終的時間、參與者、（可能）新日期。
  // 一般行程：直接改本體。重複行程：不要只寫「這一天的 override」──那樣
  // 表面上還留著重複圖示，但其實已經不會再被整個系列的同步編輯影響到，
  // 反而容易讓人誤會。這裡直接把這一次徹底獨立成一個單次、不重複的行程，
  // 系列其餘日期完全不受影響，圖示也會正確地跟著消失。
  function applyQuickPlacement(masterId, homeDate, targetDate, newStart, newEnd, newParticipants){
    const master = events.find(e => e.id === masterId);
    if(!master) return;

    if(!master.recurrence){
      master.start = newStart;
      master.end = newEnd;
      master.participants = newParticipants;
      master.date = targetDate;
      return;
    }

    const ov = (master.overrides && master.overrides[homeDate]) || {};
    events.push({
      id: 'e' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
      title: ov.title !== undefined ? ov.title : master.title,
      date: targetDate,
      start: newStart,
      end: newEnd,
      notes: ov.notes !== undefined ? ov.notes : master.notes,
      participants: newParticipants,
      recurrence: null
    });
    master.excluded = master.excluded || [];
    if(master.excluded.indexOf(homeDate) === -1) master.excluded.push(homeDate);
    if(master.overrides) delete master.overrides[homeDate];
  }

  // 複製這一次行程：在同一天建立一個內容完全一樣、獨立不重複的新行程
  function duplicateInstance(masterId, instanceDate){
    const inst = getInstancesForDate(instanceDate).find(i => i.masterId === masterId);
    if(!inst) return;
    const newId = 'e' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
    events.push({
      id: newId,
      title: inst.title,
      date: instanceDate,
      start: inst.start,
      end: inst.end,
      notes: inst.notes,
      participants: (inst.participants||[]).slice(),
      color: inst.color,
      recurrence: null
    });
    justCreatedEventId = newId; // 複製出來的也是一張全新的卡片，一樣套用「捲軸攤開」進場動畫
  }

  // 快速刪除這一次行程（長按選單用）：非重複行程直接刪掉；重複行程只排除
  // 這一天，系列其餘日期不受影響——跟拖曳移動/縮放預設「只改這一次」一致。
  function deleteInstanceQuick(masterId, instanceDate){
    const master = events.find(e => e.id === masterId);
    if(!master) return;
    if(!master.recurrence){
      events = events.filter(e => e !== master);
      return;
    }
    master.excluded = master.excluded || [];
    if(master.excluded.indexOf(instanceDate) === -1) master.excluded.push(instanceDate);
    if(master.overrides) delete master.overrides[instanceDate];
  }

  /* ---------------- 長按卡片（不拖動）跳出的「複製／刪除」快捷選單 ---------------- */
  let cardMenuEl = null;

  function closeCardMenu(){
    if(cardMenuEl){ cardMenuEl.remove(); cardMenuEl = null; }
  }

  function openCardMenu(card, masterId, instanceDate, shrunkTitle){
    closeCardMenu();
    const rect = card.getBoundingClientRect();

    const menu = document.createElement('div');
    menu.className = 'card-menu';
    menu.innerHTML =
      (shrunkTitle ? '<div class="card-menu-title-row"></div>' : '') +
      '<div class="card-menu-actions">' +
        '<button type="button" data-action="dup">複製</button>' +
